<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="60" y="52" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#1e293b">图 3　权限码头为什么排在 -80：一次请求的时间切片</text>
  <text x="60" y="86" font-family="Microsoft YaHei" font-size="19" fill="#64748b">auth 抖动时，800ms 的回落调用若被算进下游超时，就会把「auth 慢」误判成「下游挂了」，白白打开熔断。</text>

  <rect x="60" y="118" width="150" height="44" rx="8" fill="#e2e8f0"/>
  <text x="135" y="146" font-family="Microsoft YaHei" font-size="18" fill="#1e293b" text-anchor="middle">客户端</text>
  <rect x="330" y="118" width="150" height="44" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="405" y="146" font-family="Microsoft YaHei" font-size="18" fill="#0f766e" text-anchor="middle">网关过滤器链</text>
  <rect x="580" y="118" width="150" height="44" rx="8" fill="#e2e8f0"/>
  <text x="655" y="146" font-family="Microsoft YaHei" font-size="18" fill="#1e293b" text-anchor="middle">Redis</text>
  <rect x="830" y="118" width="150" height="44" rx="8" fill="#e2e8f0"/>
  <text x="905" y="146" font-family="Microsoft YaHei" font-size="18" fill="#1e293b" text-anchor="middle">auth 服务</text>
  <rect x="1040" y="118" width="130" height="44" rx="8" fill="#e2e8f0"/>
  <text x="1105" y="146" font-family="Microsoft YaHei" font-size="18" fill="#1e293b" text-anchor="middle">下游服务</text>

  <line x1="135" y1="162" x2="135" y2="748" stroke="#cbd5e1" stroke-dasharray="5 5"/>
  <line x1="405" y1="162" x2="405" y2="748" stroke="#5eead4" stroke-dasharray="5 5"/>
  <line x1="655" y1="162" x2="655" y2="748" stroke="#cbd5e1" stroke-dasharray="5 5"/>
  <line x1="905" y1="162" x2="905" y2="748" stroke="#cbd5e1" stroke-dasharray="5 5"/>
  <line x1="1105" y1="162" x2="1105" y2="748" stroke="#cbd5e1" stroke-dasharray="5 5"/>

  <rect x="66" y="174" width="640" height="26" fill="#ffffff"/>
  <text x="70" y="194" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#0f766e">1</text>
  <text x="96" y="194" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">GET /crm/v1/customer（Authorization: Bearer ...）</text>
  <line x1="135" y1="208" x2="400" y2="208" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="66" y="224" width="800" height="26" fill="#ffffff"/>
  <text x="70" y="244" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#0f766e">2</text>
  <text x="96" y="244" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">-80 读缓存 whale:{tenantId}:cache:auth:user:perm:{userId}</text>
  <line x1="405" y1="258" x2="650" y2="258" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="66" y="268" width="720" height="26" fill="#ffffff"/>
  <text x="70" y="288" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#0f766e">3</text>
  <text x="96" y="288" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">命中：权限码逗号串；空集合写哨兵 __NULL__，按未命中处理</text>
  <line x1="655" y1="308" x2="410" y2="308" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="66" y="324" width="880" height="26" fill="#ffffff"/>
  <text x="70" y="344" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#b45309">4</text>
  <text x="96" y="344" font-family="Microsoft YaHei" font-size="17" fill="#b45309">未命中 / 异常：GET /auth/v1/me，带原 Authorization，800ms 上限，超时即失败</text>
  <line x1="405" y1="358" x2="900" y2="358" stroke="#b45309" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="380" y="374" width="420" height="26" fill="#ffffff"/>
  <text x="384" y="394" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#b45309">5</text>
  <text x="410" y="394" font-family="Microsoft YaHei" font-size="17" fill="#b45309">data.permissions 权限数组</text>
  <line x1="905" y1="408" x2="410" y2="408" stroke="#b45309" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="66" y="426" width="1000" height="26" fill="#ffffff"/>
  <text x="70" y="446" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#0f766e">6</text>
  <text x="96" y="446" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">本地完成：删掉客户端入站的 X-Permission-Codes，写入网关自己算出来的值</text>
  <rect x="470" y="456" width="350" height="34" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="645" y="479" font-family="Microsoft YaHei" font-size="16" fill="#0f766e" text-anchor="middle">两级全失败 → 注入空串 + 告警，但不阻断流量</text>

  <rect x="66" y="516" width="1000" height="26" fill="#ffffff"/>
  <text x="70" y="536" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#b45309">7</text>
  <text x="96" y="536" font-family="Microsoft YaHei" font-size="17" fill="#b45309">-75 熔断开始计时：timeout 3000ms 只覆盖这一格之后的链路</text>
  <rect x="405" y="546" width="700" height="34" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="755" y="569" font-family="Microsoft YaHei" font-size="16" fill="#b45309" text-anchor="middle">超时或异常各计一次失败；窗口内失败率达阈值即打开熔断，直接返回 503</text>

  <rect x="66" y="592" width="900" height="26" fill="#ffffff"/>
  <text x="70" y="612" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#0f766e">8</text>
  <text x="96" y="612" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">转发下游，携带 OTel traceparent 与身份头</text>
  <line x1="405" y1="624" x2="1100" y2="624" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="430" y="646" width="200" height="26" fill="#ffffff"/>
  <text x="440" y="666" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">业务响应</text>
  <line x1="1105" y1="676" x2="410" y2="676" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="330" y="692" width="440" height="26" fill="#ffffff"/>
  <text x="440" y="712" font-family="Microsoft YaHei" font-size="17" fill="#1e293b">响应回客户端（X-Trace-Id 一并回写）</text>
  <line x1="405" y1="722" x2="140" y2="722" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <line x1="405" y1="748" x2="405" y2="766" stroke="#b45309" stroke-dasharray="4 4"/>
  <rect x="60" y="766" width="392" height="56" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="76" y="790" font-family="Microsoft YaHei" font-size="16" fill="#0f766e">①~⑥ 权限码头：Redis / auth 调用</text>
  <text x="76" y="811" font-family="Microsoft YaHei" font-size="16" fill="#0f766e">在熔断计时之外，再慢也不计入失败</text>
  <rect x="464" y="766" width="676" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="480" y="790" font-family="Microsoft YaHei" font-size="16" fill="#b45309">⑦~⑩ 熔断计时区间：这里统计的才是「下游真实耗时」</text>
  <text x="480" y="811" font-family="Microsoft YaHei" font-size="16" fill="#b45309">若权限码头排在 -75 之后，auth 的 800ms 会被错记成下游故障</text>
</svg>
