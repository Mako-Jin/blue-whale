server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9101}
  servlet:
    context-path: /

spring:
  application:
    name: whale-ops-audit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bluewhale_audit?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理（阶段 4 铺开）。仅扫描 classpath:db/migration；
  # db/init.sql 与历史 migration-*.sql 属于手工/追溯脚本，不在扫描路径内。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    # 存量库无历史表时自动写入 version=1 基线并跳过 V1，只执行之后的增量
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    # 生产禁止通过 Flyway 清库
    clean-disabled: true
    # 脚本中可能含 ${} 类片段，关闭占位符替换
    placeholder-replacement: false
    # 容器启动时数据库可能尚未就绪
    connect-retries: 10
  # AUTH-10 审计 MQ 汇聚（消费端）：RabbitMQ 连接与监听重试策略。
  # 默认 guest/guest 仅适用于本机开发；生产须以环境变量覆盖。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    # 默认 guest/guest 仅适用于本机开发；生产必须通过环境变量覆盖为独立账号
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        # 高并发审计下多消费者并行；默认值对小流量环境无感知
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:10}
        # 重试耗尽后不重新入队，经死信交换机转入 DLQ，避免毒消息无限回环
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务查询接口的 sys:audit:log:list 权限。
whale:
  permission:
    header:
      enabled: true
  # S5/T5.9 起居殿概览：base-path 含服务一级前缀，网关不剥前缀（REQ-ARCH-003）
  overview:
    base-path: /audit/overview
    timeout: 5s
    ttl: 30s
  # REQ-SEC-006 日志保留期清理：默认关闭（enabled=false 时不装配调度器、不清理）；
  # 仅清理 api_log/outbound_log/frontend_log/behavior_log 四张日志表，不触碰 audit_log（AUTH-09）。
  audit:
    # AUTH-08 审计导出/归档：导出接口与保留期归档任务共用；fileServiceUrl 为 whale-file 内网直连地址。
    export:
      file-service-url: ${WHALE_AUDIT_EXPORT_FILE_SERVICE_URL:http://127.0.0.1:8085}
      bucket: ${WHALE_AUDIT_EXPORT_BUCKET:bluewhale-audit-archive}
      max-rows: ${WHALE_AUDIT_EXPORT_MAX_ROWS:50000}
      # 归档分页流式单批行数：每批独立生成 CSV、上传并推进水位，控制单批内存峰值
      batch-rows: ${WHALE_AUDIT_EXPORT_BATCH_ROWS:1000}
      # 归档清单 HMAC 签名密钥（等保 2.0 8.1.4.3）：为空时清单只有 SHA-256 与链式哈希，
      # 能发现误改与批次插入/删除，但挡不住有库写权限者连同哈希一起改写。
      # 生产必须注入，禁止明文入库入仓。
      sign-key: ${WHALE_AUDIT_EXPORT_SIGN_KEY:}
      # 强制签名：为 true 且 sign-key 为空时，归档任务直接失败且不产生任何批次
      # （失败经作业心跳暴露为 audit.job.stale.days 增长）。生产建议 true：
      # 无签名归档物事后无法补救，补签等于伪造时间线。
      require-sign-key: ${WHALE_AUDIT_EXPORT_REQUIRE_SIGN_KEY:false}
    retention:
      enabled: ${WHALE_AUDIT_RETENTION_ENABLED:false}
      days: ${WHALE_AUDIT_RETENTION_DAYS:30}
      cron: ${WHALE_AUDIT_RETENTION_CRON:0 0 3 * * ?}
      # 归档积压指标 audit.archive.pending 的刷新周期（定时 count 后写入 Gauge，抓取时不再查库）
      backlog-cron: ${WHALE_AUDIT_ARCHIVE_BACKLOG_CRON:0 */5 * * * ?}
      # AUTH-09 归档开关：默认 true（可显式关闭）；随保留期 cron 导出 audit_log 过期记录并上传，
      # 仅导出归档，绝不对 audit_log 做物理/逻辑删除。归档与清理解耦：
      # enabled 仍默认 false（不清理 4 张日志表），但 archive-enabled=true 时调度器照常装配并归档。
      archive-enabled: ${WHALE_AUDIT_RETENTION_ARCHIVE_ENABLED:true}
      # 作业心跳陈旧告警阈值（天）：距上次成功执行超过该天数即告警（指标 audit.job.stale.days）。
      # 作业默认每日 03:00 跑，连续 2 天没有成功记录说明调度被停 / cron 写错 / 一直失败。
      stale-alert-days: ${WHALE_AUDIT_RETENTION_STALE_ALERT_DAYS:2}
    # AUTH-10 MQ 汇聚（消费端）：默认关闭，开启后声明审计交换机/队列/死信拓扑并消费落库。
    # 依赖增量脚本 db/migration-auth10.sql 创建 audit_mq_message 去重表。
    mq:
      consume-enabled: ${WHALE_AUDIT_MQ_CONSUME_ENABLED:false}
      exchange: ${WHALE_AUDIT_MQ_EXCHANGE:bluewhale.audit.exchange}
      routing-key: ${WHALE_AUDIT_MQ_ROUTING_KEY:audit.log}
      queue: ${WHALE_AUDIT_MQ_QUEUE:bluewhale.audit.queue}
      dead-letter-exchange: ${WHALE_AUDIT_MQ_DLX:bluewhale.audit.dlx}
      dead-letter-queue: ${WHALE_AUDIT_MQ_DLQ:bluewhale.audit.dlq}
      # 去重表保留期：须不短于 RabbitMQ 消息最大存活时间，避免去重键先于重投窗口失效
      dedup-retention-days: ${WHALE_AUDIT_MQ_DEDUP_RETENTION_DAYS:7}
      dedup-clean-cron: ${WHALE_AUDIT_MQ_DEDUP_CLEAN_CRON:0 30 3 * * ?}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
