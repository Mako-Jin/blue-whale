server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9102}
  servlet:
    context-path: /

spring:
  application:
    name: whale-monitor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 本服务为「无库」采集型服务（roadmap §2.5 标「——」）：仅做 Nacos 服务发现聚合，不持有业务库。
  # 平台 starter（whale-spring-boot-starter）无条件传递引入 MyBatis-Plus + 审计/接口日志模块（均以库为前置），
  # 故此处排除 DB 相关自动配置，仅保留统一响应体 / 全局异常 / 权限码头等无库能力。
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - com.bluewhale.common.mybatis.config.MybatisPlusConfig
      - com.bluewhale.common.audit.config.AuditLogAutoConfiguration
      - com.bluewhale.common.log.config.WhaleLogAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务监控接口的 sys:monitor:list 权限。
whale:
  permission:
    header:
      enabled: true
  overview:
    # 数枢殿总控（S5/T5.1）：本服务只做聚合，不查任何业务库。
    # base-path 含服务一级前缀（REQ-ARCH-003：网关不剥前缀），外部路径与这里一致。
    base-path: /monitor/overview
    # 比单殿的 2s 长一档：各殿是并行问的，SDK 这一层等的是"最慢的那座 + 汇总开销"
    timeout: 5s
    # 前端 30s 轮询一次，服务端缓存与之同量级，避免每次轮询都穿透到 8 个下游
    ttl: 30s
    aggregate:
      enabled: true
      # 单殿超时：超过它就当这座殿"未通"，不让一座慢殿拖住整块总控
      timeout: 2s
      cache-ttl: 30s
      # 在册的殿：T5.2–T5.9 每接入一座殿，这里加一行即可（聚合与前端都不用改）。
      # 容器内用容器名 + 端口直连（不经过网关：网关挂了总控仍要看得到各殿的真实状态）。
      # 本机起服时把地址改成 http://127.0.0.1:<各服务端口>。
      targets:
        - nodeKey: hubu-hall
          name: 户部
          url: http://bw-erp:9001/erp/overview
          permission: sys:erp:bi:cockpit:list
        - nodeKey: shumi-hall
          name: 枢密殿
          url: http://bw-auth:8081/auth/overview
          permission: sys:login:history:list
        - nodeKey: duzhi-hall
          name: 度支殿
          url: http://bw-pay:8086/pay/overview
          permission: sys:pay:list
        - nodeKey: cangshu-hall
          name: 藏书殿
          url: http://bw-file:8085/file/overview
          permission: sys:file:list
        - nodeKey: shichen-hall
          name: 时辰殿
          url: http://bw-job:8082/job/overview
          permission: sys:job:list
        - nodeKey: zhengshi-hall
          name: 政事殿
          url: http://bw-workflow:8083/workflow/overview
          permission: sys:workflow:instance:list
        - nodeKey: kaogong-hall
          name: 考功殿
          url: http://bw-form:8084/form/overview
          permission: sys:form:list
        - nodeKey: tongzheng-hall
          name: 通政殿
          url: http://bw-message:8094/message/overview
          permission: sys:message:record:list
        - nodeKey: qiju-hall
          name: 起居殿
          url: http://bw-audit:9101/audit/overview
          permission: sys:audit:log:list
        # S6 内城十二坊：T6.4 起逐坊接入，这里加一行即可
        - nodeKey: gongbu-hall
          name: 工部坊
          url: http://bw-mes:9002/mes/overview
          permission: sys:mes:dashboard:view
        - nodeKey: libu-hall
          name: 吏部坊
          url: http://bw-oa:9004/oa/overview
          permission: sys:oa:attendance:daily:list
        - nodeKey: libu-ritual-hall
          name: 礼部坊
          url: http://bw-crm:9007/crm/overview
          permission: sys:crm:analytics:dashboard
        - nodeKey: bingbu-hall
          name: 兵部坊
          url: http://bw-iot:8088/iot/overview
          permission: sys:iot:device
        - nodeKey: xingtan-hall
          name: 杏坛坊
          url: http://bw-lms:9008/lms/overview
          permission: sys:lms:analytics:view
        - nodeKey: jiangzuo-bureau
