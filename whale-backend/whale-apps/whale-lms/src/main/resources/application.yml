server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9008}
  servlet:
    context-path: /

spring:
  application:
    name: whale-lms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_lms?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 版本化建表（V1 基线审计表，V2 起业务表）
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

whale:
  permission:
    header:
      enabled: true
  lms:
    # 需求门禁（REQ-FUNC-087..090 / REQ-ARCH-025 / REQ-SEC-035）已通过（Wave 5.87）；
    # 置为 false 可一键回退到仅 /lms/meta 的维护态
    demand-gate-passed: ${WHALE_LMS_DEMAND_GATE_PASSED:true}
    # 课程单页上限
    course-page-limit: ${WHALE_LMS_COURSE_PAGE_LIMIT:100}
    # 章节数上限（单课程）
    chapter-limit: ${WHALE_LMS_CHAPTER_LIMIT:100}
    # 单章节课件数上限
    ware-limit-per-chapter: ${WHALE_LMS_WARE_LIMIT_PER_CHAPTER:20}
    # 报进度百分比上限
    progress-max-percent: 100
  # 概览契约（三维王城数据厅 - 杏坛坊）：SDK 注册 GET /lms/overview，本服务只提供 provider。
  # 路径带服务前缀（REQ-ARCH-003：网关不剥前缀）；TTL 30s 对应前端 30s 轮询。
  # timeout 2s 比 ERP 窄一档：看板的数是三个 metrics() 聚合 + 当日快照，
  # 不扫明细表；超过 2s 说明库已经不正常，早点降级比让屏风转圈强。
  overview:
    base-path: /lms/overview
    ttl: 30s
    timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
