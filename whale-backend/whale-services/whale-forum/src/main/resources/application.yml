server:
  # 网关注入的 X-Permission-Codes 随权限数量增长，Tomcat 默认 8KB 头上限会导致 400（对齐 whale-twin）
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9011}
  servlet:
    context-path: /

spring:
  application:
    name: whale-forum
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_forum?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由 starter 的
    # DataSourcePasswordGuard 启动守卫给出明确报错（与 whale-twin 同一口径）
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理。仅扫描 classpath:db/migration。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# V-02 内网令牌：/forum/internal/** 仅供服务间内网直调（网关 internal-deny 已统一 403）
bluewhale:
  internal-token:
    path-patterns:
      - /**/internal/**

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务 sys:forum:* 权限。
whale:
  permission:
    header:
      enabled: true
  forum:
    max-title-length: ${WHALE_FORUM_MAX_TITLE_LENGTH:120}
    max-content-length: ${WHALE_FORUM_MAX_CONTENT_LENGTH:100000}
    max-posts-per-thread: ${WHALE_FORUM_MAX_POSTS_PER_THREAD:5000}
    page-size-default: ${WHALE_FORUM_PAGE_SIZE_DEFAULT:20}
    page-size-max: ${WHALE_FORUM_PAGE_SIZE_MAX:100}
    max-page-number: ${WHALE_FORUM_MAX_PAGE_NUMBER:500}
    max-mentions-per-post: ${WHALE_FORUM_MAX_MENTIONS:20}
    post-interval-seconds: ${WHALE_FORUM_POST_INTERVAL_SECONDS:60}
    # 滑动窗口：默认 10 分钟内最多 5 帖（F-03-17）
    post-window-seconds: ${WHALE_FORUM_POST_WINDOW_SECONDS:600}
    post-window-max: ${WHALE_FORUM_POST_WINDOW_MAX:5}
    reply-interval-seconds: ${WHALE_FORUM_REPLY_INTERVAL_SECONDS:10}
    # 作者可编辑自身帖子的时间窗（分钟），超时需治理权限
    edit-window-minutes: ${WHALE_FORUM_EDIT_WINDOW_MINUTES:30}
    # 列表摘要截断长度
    summary-length: ${WHALE_FORUM_SUMMARY_LENGTH:200}
    hot-refresh-minutes: ${WHALE_FORUM_HOT_REFRESH_MINUTES:30}
    # 审核模式版块内发布态编辑自动退回待审（规格 §6.6）；关闭等于审核白做
    audit-on-edit: ${WHALE_FORUM_AUDIT_ON_EDIT:true}
    # 匿名编号 HMAC 密钥；为空时匿名发帖强制关闭（fail-closed）
    anonymous-secret: ${WHALE_FORUM_ANONYMOUS_SECRET:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
