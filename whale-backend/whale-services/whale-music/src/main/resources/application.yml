server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8096}
  servlet:
    context-path: /

spring:
  application:
    name: whale-music
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_music?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由部署侧显式配置
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  data:
    # 播放票据 / 播放计数 / 榜单 / 首页缓存（M2 起使用）
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  # REQ-SEC-022：Flyway 数据库版本化（阶段 4 铺开），脚本位于 classpath:db/migration
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# 启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定 sys:music:* 权限。
whale:
  permission:
    header:
      enabled: true
  music:
    # 上传前置：必须签署当前版本《版权无争议协议》
    agreement-version: ${WHALE_MUSIC_AGREEMENT_VERSION:V1}
    agreement-title: ${WHALE_MUSIC_AGREEMENT_TITLE:音乐作品版权无争议协议}
    upload-max-bytes: ${WHALE_MUSIC_UPLOAD_MAX_BYTES:104857600}
    audio-formats: ${WHALE_MUSIC_AUDIO_FORMATS:audio/mpeg,audio/aac,audio/flac}
    cover-formats: ${WHALE_MUSIC_COVER_FORMATS:image/jpeg,image/png,image/webp}
    # 播放票据：绑定 tenantId + userId + songId，允许一次播放内的多次 Range 请求
    play-ticket-ttl-seconds: ${WHALE_MUSIC_PLAY_TICKET_TTL_SECONDS:120}
    stream-chunk-bytes: ${WHALE_MUSIC_STREAM_CHUNK_BYTES:1048576}
    # 评论默认先发后审 + 审核队列
    comment-pre-audit: ${WHALE_MUSIC_COMMENT_PRE_AUDIT:false}
    playlist-max-songs: ${WHALE_MUSIC_PLAYLIST_MAX_SONGS:500}
    play-history-retention-days: ${WHALE_MUSIC_PLAY_HISTORY_RETENTION_DAYS:90}
    file-service-name: ${WHALE_MUSIC_FILE_SERVICE:whale-file}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    # M5-5：输出 http.server.requests 直方图桶，供首页 / 详情 / 流式 P95（SLO-6/7/8）查询
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
