server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  # 8096–8099 已被 music/scene/video/mail 占用，8100 是后端最后一段空闲端口（8101 起为前端子应用）
  port: ${SERVER_PORT:8100}
  servlet:
    context-path: /

spring:
  application:
    name: whale-map
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_map?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由部署侧显式配置
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：新服务自 M0 起直接使用 Flyway 版本化建表
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

whale:
  permission:
    header:
      enabled: true
  # 三维王城概览（S7/T7.6）：舆图司屏风读 /map/overview。
  # 路径带服务前缀（REQ-ARCH-003：网关不剥前缀）；TTL 30s 对应前端 30s 轮询。
  # timeout 2s：四次索引 count + 一次七日台账扫描，不碰缓存大字段；超过 2s
  # 说明库已经不正常，早点降级比让屏风转圈强。
  overview:
    base-path: /map/overview
    ttl: 30s
    timeout: 2s
  # 国际化：BizException 文案键按请求 Locale 解析；属性文件回退源为 classpath:i18n/map/messages*
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
  map:
    # 默认供应商：能力路由未显式指定时使用
    default-provider: ${WHALE_MAP_DEFAULT_PROVIDER:tencent}
    # 对外（前端）统一坐标系；内部存储统一 WGS84。两者都在服务端定死，不接受调用方改
    display-coord: ${WHALE_MAP_DISPLAY_COORD:GCJ02}
    storage-coord: ${WHALE_MAP_STORAGE_COORD:WGS84}
    # 能力 → 供应商。真空项走 default-provider；DISTANCE 为本地球面计算，不消耗任何配额
    capability-routing:
      GEOCODE: ${WHALE_MAP_ROUTING_GEOCODE:tencent}
      REGEO: ${WHALE_MAP_ROUTING_REGEO:tencent}
      POI: ${WHALE_MAP_ROUTING_POI:tencent}
      ROUTE: ${WHALE_MAP_ROUTING_ROUTE:amap}
      DISTANCE: local
    # 降级顺序：主供应商超时/超配额/返回空结果时依次尝试
    fallback: ${WHALE_MAP_FALLBACK:amap}
    providers:
      tencent:
        # Key 只存服务端（环境变量或配置中心加密项），前端不得出现明文
        key: ${TENCENT_MAP_KEY:}
        base-url: ${TENCENT_MAP_BASE_URL:https://apis.map.qq.com}
        quota-per-day: ${WHALE_MAP_TENCENT_QUOTA:10000}
        connect-timeout-millis: ${WHALE_MAP_CONNECT_TIMEOUT_MS:2000}
        read-timeout-millis: ${WHALE_MAP_READ_TIMEOUT_MS:5000}
      amap:
        key: ${AMAP_MAP_KEY:}
        base-url: ${AMAP_MAP_BASE_URL:https://restapi.amap.com}
        quota-per-day: ${WHALE_MAP_AMAP_QUOTA:10000}
        connect-timeout-millis: ${WHALE_MAP_CONNECT_TIMEOUT_MS:2000}
        read-timeout-millis: ${WHALE_MAP_READ_TIMEOUT_MS:5000}
    cache:
      # 地址解析结果落库缓存：同一地址反复解析是常态（列表页每次刷新都解析一次），
      # 关掉缓存会让日配额在演示阶段就被打满
      enabled: ${WHALE_MAP_CACHE_ENABLED:true}
      ttl-hours: ${WHALE_MAP_CACHE_TTL_HOURS:2160}
      # 超长地址不缓存：截断后的 key 会让两个不同地址命中同一条，宁可每次都问
      max-text-length: ${WHALE_MAP_CACHE_MAX_TEXT_LENGTH:200}
    location:
      # 附近查询半径上限：超过这个范围 geohash 邻域枚举会退化成全表扫描
      nearby-max-radius-meters: ${WHALE_MAP_NEARBY_MAX_RADIUS:5000}
      nearby-max-rows: ${WHALE_MAP_NEARBY_MAX_ROWS:200}
      # 单次批量距离计算上限：球面距离是纯内存计算，卡上限只为防单请求打满 CPU
      distance-max-batch: ${WHALE_MAP_DISTANCE_MAX_BATCH:200}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
