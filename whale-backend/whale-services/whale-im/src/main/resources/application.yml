server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: /

spring:
  application:
    name: whale-im
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_im?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  data:
    # 消息序号 INCR / WS ticket / 在线状态；懒连接，Redis 不可用时不阻断服务启动
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  # REQ-SEC-022：Flyway 数据库版本化（阶段 4 铺开），脚本位于 classpath:db/migration
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务 sys:im:* 权限。
whale:
  permission:
    header:
      enabled: true
  im:
    ws:
      # 握手阶段允许的来源；生产同源部署可收紧为具体域名（ticket 为一次性凭证，不入 URL 日志）
      allowed-origins: ${WHALE_IM_WS_ALLOWED_ORIGINS:*}
      # 服务端建议心跳间隔（秒），客户端按其一半频率发送 ping 帧
      heartbeat-seconds: ${WHALE_IM_WS_HEARTBEAT_SECONDS:30}
      # WS ticket 有效期（秒）与在线状态 TTL（秒）
      ticket-ttl-seconds: ${WHALE_IM_WS_TICKET_TTL_SECONDS:60}
      presence-ttl-seconds: ${WHALE_IM_PRESENCE_TTL_SECONDS:90}
    # 消息撤回时限（秒）：自落库起算，超时不允许撤回
    recall-window-seconds: ${WHALE_IM_RECALL_WINDOW_SECONDS:120}
    # 群成员合法性校验：创建会话 / 添加群成员前经内网调用 whale-service-auth POST /user/internal/exists
    member:
      validation-enabled: ${WHALE_IM_MEMBER_VALIDATION_ENABLED:true}
      timeout-seconds: ${WHALE_IM_MEMBER_VALIDATION_TIMEOUT_SECONDS:3}
    # 用户目录服务（默认走 Nacos 服务发现；显式 base-url 时优先使用，便于本地联调）
    auth:
      service-name: ${WHALE_IM_AUTH_SERVICE_NAME:whale-service-auth}
      base-url: ${WHALE_IM_AUTH_BASE_URL:}
    # 消息服务回执上报：站内通知送达/已读以 clientMsgId 作为 providerMessageId 回传
    message:
      service-name: ${WHALE_IM_MESSAGE_SERVICE_NAME:whale-service-message}
      base-url: ${WHALE_IM_MESSAGE_BASE_URL:}
      receipt-enabled: ${WHALE_IM_MESSAGE_RECEIPT_ENABLED:true}
      timeout-seconds: ${WHALE_IM_MESSAGE_RECEIPT_TIMEOUT_SECONDS:2}
    # 内置机器人「蓝鲸助手」：逻辑用户ID不落 sys_user，仅用于 BOT 会话成员与消息发送者
    bot:
      name: ${WHALE_IM_BOT_NAME:蓝鲸助手}
      user-id: ${WHALE_IM_BOT_USER_ID:900000000000000001}
      scenario: ${WHALE_IM_BOT_SCENARIO:DEFAULT}
    # 智能体流式调用（whale-agent SSE /agent/chat）；timeout-seconds 为建连与首字节超时
    agent:
      base-url: ${WHALE_IM_AGENT_BASE_URL:http://127.0.0.1:8090}
      timeout-seconds: ${WHALE_IM_AGENT_TIMEOUT_SECONDS:120}
      pool-size: ${WHALE_IM_AGENT_POOL_SIZE:4}
      # 单用户每分钟提问上限（Redis 计数；超限落提示消息，不触发智能体）
      rate-limit-per-minute: ${WHALE_IM_AGENT_RATE_LIMIT_PER_MINUTE:20}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
