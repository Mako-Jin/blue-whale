server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8097}
  servlet:
    context-path: /

spring:
  application:
    name: whale-scene
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_scene?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由部署侧显式配置
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：新服务自 M0 起直接使用 Flyway 版本化建表，不沿用 init.sql 模式
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    # 生产禁止通过 Flyway 清库
    clean-disabled: true
    # 权限 path 等配置可能含 ${} 片段，关闭占位符替换
    placeholder-replacement: false
    # 容器启动时数据库可能尚未就绪
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# 启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定 sys:scene:* 权限。
whale:
  permission:
    header:
      enabled: true
  # P2 国际化：BizException 文案键按请求 Locale 解析；启动时幂等创建 sys_i18n_message，
  # 属性文件回退源为 classpath:i18n/scene/messages*。
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
  scene:
    # 2D 首屏预算：单场景节点数与树深度上限（发布校验硬卡口）
    max-nodes-per-scene: ${WHALE_SCENE_MAX_NODES_PER_SCENE:200}
    max-node-depth: ${WHALE_SCENE_MAX_NODE_DEPTH:5}
    navigation-node-limit: ${WHALE_SCENE_NAVIGATION_NODE_LIMIT:200}
    # M1/M2 固定关闭；M3 解冻评审通过后再开启
    three-d-enabled: ${WHALE_SCENE_3D_ENABLED:false}
    allowed-schemes: ${WHALE_SCENE_ALLOWED_SCHEMES:http,https}
    # 3D 看板向 ERP 内网取实时数量（取数失败显式降级，不返回假数据）
    erp-base-url: ${WHALE_SCENE_ERP_BASE_URL:http://127.0.0.1:9001}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
