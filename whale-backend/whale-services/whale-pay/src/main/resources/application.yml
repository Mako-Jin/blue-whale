server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: /

spring:
  application:
    name: whale-pay
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_pay?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化（阶段 4 铺开），脚本位于 classpath:db/migration
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务支付接口的 sys:pay:* 权限。
# 内网接口 /pay/internal/** 由 starter 的 InternalTokenFilter 校验 X-Internal-Token，
# 非 dev 环境未配置令牌时 InternalTokenGuard 拒绝启动（WHALE_INTERNAL_TOKEN）。
whale:
  permission:
    header:
      enabled: true
  # 三维王城度支殿（T5.3）：SDK 注册 GET /pay/overview，本服务只提供 provider。
  # base-path 含服务一级前缀（REQ-ARCH-003：网关不剥前缀），外部路径与这里一致。
  overview:
    base-path: /pay/overview
    # 四张 KPI + 两张图要打 6 次库（收款/建单/待支付/退款/趋势/渠道），比 ERP 单快照慢一档
    timeout: 5s
    # 前端 30s 轮询一次；支付数据本就是分钟级变化，缓存 30s 不会让值班的人看到旧数
    ttl: 30s
  # 国际化：启用 whale-i18n-sdk，异常文案键按请求 Locale 解析
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
  # F-04：默认 mock 渠道，支付/退款只生成模拟流水号，不发起真实资金请求。
  # 关闭 mock 会由 PayChannelStartupGuard 拒绝启动（渠道调用仍在本地事务内，禁止真实资金上线）。
  # allowed-channels 必须与已实现的适配器一一对应，否则 PayChannelGateway 启动即失败。
  pay:
    mock: ${WHALE_PAY_MOCK:true}
    allowed-channels: ${WHALE_PAY_ALLOWED_CHANNELS:MOCK}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
