server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8081}

# P2-3：API 契约自动化（仅服务直连端口，网关未放行）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: whale-service-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Spring Boot 4 API Versioning：/v1 由 ApiVersionConfig 注册的路径段解析器解析；
  # 未携带版本段的存量请求按 v1 处理，不影响既有非版本化接口。
  mvc:
    apiversion:
      default: "1"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bluewhale_auth?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理（试点服务）。仅扫描 classpath:db/migration；
  # db/init.sql 与历史 migration-*.sql 属于手工/追溯脚本，不在扫描路径内。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    # 存量库无历史表时自动写入 version=1 基线并跳过 V1，只执行 V2 及之后的增量
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    # 生产禁止通过 Flyway 清库
    clean-disabled: true
    # 权限 path 中可能含 ${} 类片段，关闭占位符替换
    placeholder-replacement: false
    # 容器启动时数据库可能尚未就绪
    connect-retries: 10
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  # AUTH-10 审计 MQ 汇聚（生产端）：RabbitMQ 连接。默认 guest/guest 仅适用于本机开发，
  # 生产须以环境变量覆盖；Broker 不可达时 MQ 投递失败会自动回退 HTTP 转发与本地落库。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

whale:
  # S-02 Redis 降级口径：false=可用性优先（Redis 不可读时放行并告警），
  # true=安全优先（按已撤销/已命中黑名单拒绝请求）；需与网关保持一致。
  security:
    degradation:
      fail-closed: ${SECURITY_DEGRADATION_FAIL_CLOSED:false}
  auth:
    jwt:
      # HS256 签名密钥，与 whale-service-gateway 保持完全一致；生产环境务必覆盖
      secret: ${JWT_SECRET:bluewhale-jwt-secret-2026-please-change-in-production}
      expire-minutes: 120
      refresh-expire-minutes: 1440
    # OAuth2.0 授权服务器（权限中心扩展 M1）：issuer 对外可见地址，须与网关/前端访问域名一致，
    # 否则发现文档（/.well-known/oauth-authorization-server）返回的端点不可达。
    oauth2:
      issuer: ${OAUTH2_ISSUER:http://localhost:8081}
    # 三方登录（权限中心扩展 M2：钉钉 / 飞书 / 企业微信）。总开关默认关闭；
    # 渠道凭据属敏感信息，生产经环境变量 / Nacos 注入，切勿硬编码。
    # callback-base-url 为服务侧接收渠道回调的对外基地址（经网关时填网关地址）；
    # frontend-base-url 为三方登录完成后 302 回跳的前端回调页（回跳路径须以 / 开头，防开放重定向）。
    social:
      enabled: ${WHALE_AUTH_SOCIAL_ENABLED:false}
      state-ttl-seconds: 300
      login-code-ttl-seconds: 60
      callback-base-url: ${WHALE_AUTH_SOCIAL_CALLBACK_BASE_URL:http://localhost:8081}
      frontend-base-url: ${WHALE_AUTH_SOCIAL_FRONTEND_BASE_URL:http://localhost:5173/social/callback}
      providers:
        dingtalk:
          enabled: ${WHALE_AUTH_SOCIAL_DINGTALK_ENABLED:false}
          client-id: ${WHALE_AUTH_SOCIAL_DINGTALK_CLIENT_ID:}
          client-secret: ${WHALE_AUTH_SOCIAL_DINGTALK_CLIENT_SECRET:}
        feishu:
          enabled: ${WHALE_AUTH_SOCIAL_FEISHU_ENABLED:false}
          client-id: ${WHALE_AUTH_SOCIAL_FEISHU_CLIENT_ID:}
          client-secret: ${WHALE_AUTH_SOCIAL_FEISHU_CLIENT_SECRET:}
        wecom:
          enabled: ${WHALE_AUTH_SOCIAL_WECOM_ENABLED:false}
          client-id: ${WHALE_AUTH_SOCIAL_WECOM_CORP_ID:}
          client-secret: ${WHALE_AUTH_SOCIAL_WECOM_CORP_SECRET:}
          agent-id: ${WHALE_AUTH_SOCIAL_WECOM_AGENT_ID:}
    # V-03 认证 Cookie：refresh 令牌（whale_refresh_token，HttpOnly）与 CSRF（whale_csrf，前端可读）
    # 走 Cookie 下发，响应体不再返回 refreshToken。secure 为 Cookie Secure 标记开关：
    # HTTPS 站点必须开启（生产经 WHALE_AUTH_COOKIE_SECURE=true），dev 走 HTTP 联调默认关闭。
    cookie:
      secure: ${WHALE_AUTH_COOKIE_SECURE:false}
    # REQ-SEC-021 / REQ-SEC-023 口令策略：90 天到期、提前 7 天提醒、最近 5 次不可复用、
    # 最小 12 位且必须含大小写字母/数字/特殊字符；新建与管理员重置后强制首登改密。
    password:
      max-age-days: ${WHALE_AUTH_PASSWORD_MAX_AGE_DAYS:90}
      warn-days: ${WHALE_AUTH_PASSWORD_WARN_DAYS:7}
      history-size: ${WHALE_AUTH_PASSWORD_HISTORY_SIZE:5}
      min-length: ${WHALE_AUTH_PASSWORD_MIN_LENGTH:12}
      max-length: 64
      require-upper: true
      require-lower: true
      require-digit: true
      require-special: true
      force-change-on-create: ${WHALE_AUTH_PASSWORD_FORCE_CHANGE:true}
      notice-cron: ${WHALE_AUTH_PASSWORD_NOTICE_CRON:0 0 2 * * ?}
    # P1-3 权限缓存跨实例失效：本地批量删除当前租户完整 Key + Redisson RTopic 广播；
    # Redis 断连时删除失败的 Key 进入待处理集合，由定时任务在恢复后重对齐。
    permission-cache:
      enabled: ${PERMISSION_CACHE_ENABLED:true}
      ttl: ${PERMISSION_CACHE_TTL:5m}
      broadcast-enabled: ${PERMISSION_CACHE_BROADCAST_ENABLED:true}
      reconcile-enabled: ${PERMISSION_CACHE_RECONCILE_ENABLED:true}
      reconcile-interval-ms: ${PERMISSION_CACHE_RECONCILE_INTERVAL_MS:30000}
      reconcile-initial-delay-ms: ${PERMISSION_CACHE_RECONCILE_INITIAL_DELAY_MS:10000}
      reconcile-batch-size: ${PERMISSION_CACHE_RECONCILE_BATCH_SIZE:500}
      pending-limit: ${PERMISSION_CACHE_PENDING_LIMIT:10000}
      # 待重对齐 Key 本地持久化：进程重启后自动读回，避免断连期间漏失效的 Key 永久丢失；
      # 容器部署建议把 pending-file 挂到持久卷（多实例共用一个文件时重复 Key 自动去重）
      pending-persistence-enabled: ${PERMISSION_CACHE_PENDING_PERSISTENCE:true}
      pending-file: ${PERMISSION_CACHE_PENDING_FILE:${java.io.tmpdir}/bluewhale-auth-permission-pending.keys}
    # 权限中心扩展 M3 档案敏感字段加密密钥（证件号 / 密保答案）：生产经环境变量注入，
    # 空值时 infrastructure 适配器使用开发默认密钥兜底（仅限本地联调，禁止生产依赖兜底值）。
    profile:
      crypto-key: ${WHALE_AUTH_PROFILE_CRYPTO_KEY:}
  # P1-3 审计跨库汇聚：审计记录转发 whale-audit:9101。
  # 2026-11-13 决策：auth 本地不再建 audit_log（V25 已删表），兜底由 whale-audit 多实例承担，
  # local-fallback 显式关闭；转发失败时丢弃并告警，可靠性依赖 whale-audit 部署口径。
  audit:
    forward:
      enabled: ${WHALE_AUDIT_FORWARD_ENABLED:true}
      url: ${WHALE_AUDIT_FORWARD_URL:http://127.0.0.1:9101}
      timeout-millis: ${WHALE_AUDIT_FORWARD_TIMEOUT_MILLIS:800}
      local-fallback: ${WHALE_AUDIT_FORWARD_LOCAL_FALLBACK:false}
    # AUTH-10 审计 MQ 汇聚（生产端）：默认关闭；开启后审计记录优先投递 RabbitMQ，
    # 投递失败自动回退 HTTP 转发（forward）与本地落库，不丢记录。
    mq:
      publish-enabled: ${WHALE_AUDIT_MQ_PUBLISH_ENABLED:false}
      exchange: ${WHALE_AUDIT_MQ_EXCHANGE:bluewhale.audit.exchange}
      routing-key: ${WHALE_AUDIT_MQ_ROUTING_KEY:audit.log}

  # 接口观测日志（ApiLogFilter）：auth 本地不建 api_log（V25 已删表），显式关闭本地采集；
  # 观测汇聚由 whale-audit 承担（其自身 api_log 经同款过滤器落 whale-audit 库）。
  log:
    api:
      enabled: ${WHALE_LOG_API_ENABLED:false}

  # 建用户后自动开邮箱（Wave 5.89 M2）：监听 UserDomainEvent.CREATED，异步回调 whale-mail 内网代开。
  # 默认关闭——邮件是可选能力，不能让「建用户」依赖邮件服务的健康度。
  mail:
    provision-enabled: ${WHALE_AUTH_MAIL_PROVISION_ENABLED:false}
    provision-url: ${WHALE_AUTH_MAIL_PROVISION_URL:http://whale-mail:8099/mail/internal/provision}
    connect-timeout-millis: ${WHALE_AUTH_MAIL_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${WHALE_AUTH_MAIL_READ_TIMEOUT_MS:8000}

  # Wave 5.50：国际化 SDK 自治化。启动时在本服务库幂等创建 sys_i18n_message，
  # 文案回退源为 classpath:i18n/auth/messages*；本地管理接口显式开启（默认关闭）。
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
    admin:
      enabled: true
      path: /auth/i18n/message

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 审计修复：StdOutImpl 绕过日志框架把 SQL（含参数）直打 stdout，生产存在性能与敏感信息问题；
    # 改走 SLF4J，dev 由 com.bluewhale=debug 输出 SQL，生产 INFO 级别自然关闭
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.bluewhale: debug
    org.springframework: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # P1-3b：开启 HTTP 请求耗时直方图，供 SLO-1 登录 P95 的 histogram_quantile 查询使用
      percentiles-histogram:
        "[http.server.requests]": true
