server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    # 与 whale-service-auth 命名口径一致；Nacos dataId（whale-gateway-routes/access-list.yaml）
    # 为既有外部配置资产，重命名需运维同步发布，故沿用历史 dataId
    name: whale-service-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # T5 Nacos 动态路由：从 Nacos 导入网关动态路由配置（dataId/group 见 NacosRouteDefinitionRepository）；
  # AUTH-41 应急黑名单：dataId=whale-gateway-access-list.yaml，改完由 @ConfigurationProperties 热重绑定。
  # optional: 前缀保证 Nacos 不可用时网关仍能启动，refreshEnabled=true 支持配置变更后刷新。
  config:
    import:
      - "optional:nacos:whale-gateway-routes.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:whale-gateway-access-list.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
    gateway:
      server:
        webflux:
          # 路由约定（REQ-ARCH-003）：服务自持对外一级路径前缀，网关只转发、不剥离前缀；禁止 StripPrefix
          # 服务发现路由定位器（Gateway 5.x 官方前缀：spring.cloud.gateway.server.webflux）
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            # V-02：剥离外部请求自带的内网令牌头，防止伪造直通下游服务侧校验
            - RemoveRequestHeader=X-Internal-Token
          # 基础路由已迁至 classpath:gateway-routes-fallback.yaml（冷备），由 NacosRouteDefinitionRepository 加载；
          # Nacos whale-gateway-routes.yaml 的动态路由按 id 合并，Nacos 优先。

whale:
  # S-02 Redis 降级口径：false=可用性优先（Redis 不可读时放行并告警），
  # true=安全优先（按已撤销/已停用/已命中黑名单拒绝请求）。
  security:
    degradation:
      fail-closed: ${SECURITY_DEGRADATION_FAIL_CLOSED:false}
  gateway:
    jwt:
      # HS256 签名密钥，必须与 whale-service-auth 保持一致；auth 切换 RS256 后仅用于验签存量令牌
      secret: ${WHALE_GATEWAY_JWT_SECRET:bluewhale-jwt-secret-2026-please-change-in-production}
      # E-2 JWKS 密钥轮换：auth 配置 RSA 私钥后开启，网关按 kid 拉取公钥并本地缓存；
      # 未知 kid 强制刷新一次，无 kid 的 HS256 令牌仍走上方共享密钥。
      jwks-enabled: ${WHALE_GATEWAY_JWKS_ENABLED:false}
      jwks-uri: ${WHALE_GATEWAY_JWKS_URI:lb://whale-service-auth/oauth2/jwks}
      jwks-timeout-millis: ${WHALE_GATEWAY_JWKS_TIMEOUT_MILLIS:800}
      jwks-cache-minutes: ${WHALE_GATEWAY_JWKS_CACHE_MINUTES:10}
    # P1-2 跨域配置：dev 默认放行本机任意端口（Vite 8001/8002/8003 直连网关联调）；
    # 生产通过环境变量 WHALE_GATEWAY_CORS_ALLOWED_ORIGINS 覆盖为具体域名白名单（逗号分隔），
    # 未命中来源的预检请求返回 403，由 Nginx 同源转发兜底。
    cors:
      allowed-origins: ${WHALE_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    # 不需要 JWT 认证的白名单路径（支持 Ant 通配符）。
    # P2-7 精简：远程名单（auth 库 sys_gateway_whitelist，60s 拉取）为权威源，本地仅保留
    #   「登录闭环 + 外部不可重试回调」兜底；其余放行项（文档、actuator、审计上报、WS、
    #   音视频流、OAuth2 协议端点等）只在远程名单维护，管理端增删 ≤60s 生效。
    # 保留本地兜底的原因：冷启动且 auth 长时间不可用时远程快照为空，登录链路与外部回调
    #   不能因为网关 401 而中断；反过来，这些条目在管理端停用/删除后本地仍会放行，属有意例外。
    white-list:
      # 登录与续期（登录页在未认证状态必须可用）
      - /auth/v1/login
      - /auth/v1/refresh
      # 登录页品牌解析（登录前渲染品牌，免 JWT）
      - /brand/v1/resolve
      # 三方登录渠道回调：外部 IdP 浏览器跳转，失败不可重试
      - /social/v1/*/callback
      # 第三方电子签章回调：外部平台匿名回调，安全依赖渠道 HMAC/RSA 验签 + 时间戳窗口 + 幂等
      - /contract/sign/callback/**
      # 支付渠道异步回调：外部渠道匿名回调，安全依赖渠道验签 + 幂等键；白名单请求会剥离
      # 客户端伪造的身份/租户头（JwtAuthGlobalFilter#withoutIdentityHeaders），租户由支付单反查
      - /pay/v1/callback/**
    # P2-6 WebSocket 握手 ticket 校验路径（精确匹配，不参与 Ant 通配）：
    #   必须与远程白名单（auth 库 sys_gateway_whitelist）、gateway-routes-fallback.yaml 的
    #   WS 路由 predicates 三处一致。新增 WS 端点时：本配置加路径 + 远程白名单加同路径
    #   （WS 握手无法带 Authorization）+ 路由 predicates 同步。
    ws-ticket:
      paths: ${WHALE_GATEWAY_WS_TICKET_PATHS:/im/ws,/im/world,/doc/ws}
    # P2-14 管理端点收口：/actuator 不走网关路由链，JWT 白名单对其无效。
    #   默认仅允许内网/回环来源，并校验 X-Forwarded-For 首段（公网经 Nginx 转发也拒绝）；
    #   仅当网络层已隔离 /actuator 时才可置 false。
    actuator:
      internal-only: ${WHALE_GATEWAY_ACTUATOR_INTERNAL_ONLY:true}
    # 访问名单动态加载：以权限中心（whale-service-auth）DB 为准，网关按 refresh-interval-ms 周期拉取
    #   白名单 GET /auth/v1/internal/gateway/whitelist → 与上方 white-list 取并集；
    #   黑名单 GET /auth/v1/internal/gateway/blacklist → 优先级高于白名单，命中即 403。
    # 远程失败保留上一份快照；白名单另有本地 white-list 兜底，避免 auth 抖动导致登录链路 401。
    access-list:
      enabled: ${WHALE_GATEWAY_ACCESS_LIST_ENABLED:true}
      whitelist-uri: ${WHALE_GATEWAY_WHITELIST_URI:lb://whale-service-auth/auth/v1/internal/gateway/whitelist}
      blacklist-uri: ${WHALE_GATEWAY_BLACKLIST_URI:lb://whale-service-auth/auth/v1/internal/gateway/blacklist}
      refresh-interval-ms: ${WHALE_GATEWAY_ACCESS_LIST_REFRESH_INTERVAL_MS:60000}
      initial-delay-ms: ${WHALE_GATEWAY_ACCESS_LIST_INITIAL_DELAY_MS:5000}
      timeout-millis: ${WHALE_GATEWAY_ACCESS_LIST_TIMEOUT_MILLIS:800}
      # 与服务侧 InternalTokenFilter 共享令牌（生产必须配置 WHALE_INTERNAL_TOKEN）
      internal-token: ${WHALE_INTERNAL_TOKEN:}
      internal-token-header: X-Internal-Token
      # AUTH-41 应急封禁通道：Nacos 热配置，不依赖 auth 可用性，优先级最高、不限 HTTP 方法。
      # 在 Nacos dataId=whale-gateway-access-list.yaml 写入（本地默认空列表）：
      #   whale.gateway.access-list.emergency-blacklist:
      #     - /some/hot/path/**
      # 变更后 @ConfigurationProperties 重新绑定，下一个请求即生效（不受 enabled 开关影响）。
      emergency-blacklist: []
    # GW-10 Phase 2 路由业务属性覆盖：DB 不存路由定义（权威源 Nacos、冷备本地 YAML），
    #   只存 enabled/生效窗口，表落 whale-service-auth 库，经内部只读接口 60s 快照拉取；
    #   快照变更即发布 RefreshRoutesEvent 重载路由（≤60s 生效、不重启），auth 不可用保留旧快照。
    route-override:
      enabled: ${WHALE_GATEWAY_ROUTE_OVERRIDE_ENABLED:true}
      uri: ${WHALE_GATEWAY_ROUTE_OVERRIDE_URI:lb://whale-service-auth/auth/v1/internal/gateway/route-overrides}
      refresh-interval-ms: ${WHALE_GATEWAY_ROUTE_OVERRIDE_REFRESH_INTERVAL_MS:60000}
      initial-delay-ms: ${WHALE_GATEWAY_ROUTE_OVERRIDE_INITIAL_DELAY_MS:5000}
      timeout-millis: ${WHALE_GATEWAY_ROUTE_OVERRIDE_TIMEOUT_MILLIS:800}
      # 与服务侧 InternalTokenFilter 共享令牌（生产必须配置 WHALE_INTERNAL_TOKEN）
      internal-token: ${WHALE_INTERNAL_TOKEN:}
      internal-token-header: X-Internal-Token
    # P1-13 路由治理端点鉴权：/actuator/routeGovernance 不受 JWT 保护（actuator 端点不经过网关路由链），
    # 且含写操作（回滚路由），必须携带 X-Governance-Token；令牌未配置时一律 403（fail-closed），
    # 生产通过环境变量 WHALE_GATEWAY_GOVERNANCE_TOKEN 显式启用。health/info/prometheus 仍匿名可用。
    governance:
      token: ${WHALE_GATEWAY_GOVERNANCE_TOKEN:}
    # AUTH-06 权限码头注入：JwtAuthGlobalFilter 注入 X-User-Id 后，PermissionHeaderGlobalFilter(order=-80)
    # 读 Redis 权限码缓存（命中即注入）；未命中/哨兵/异常回落 lb://whale-service-auth/auth/v1/me，两级均失败注入空串并告警。
    # order 必须早于熔断过滤器（-75）：否则权限码头回落耗时会被计入下游熔断超时，auth 抖动会误开熔断。
    permission-header:
      enabled: ${WHALE_GATEWAY_PERMISSION_HEADER_ENABLED:true}
      # 回落 /auth/me 的强制超时（毫秒）：auth 抖动时快速失败，超时按 fail-closed 注入空权限码
      fallback-timeout-millis: ${WHALE_GATEWAY_PERMISSION_FALLBACK_TIMEOUT_MILLIS:800}
    # T5.4 网关入口限流（Redis 计数器 + 固定窗口，REQ-DIST-003）：
    # window-seconds 为固定窗口长度（秒），limit 为单窗口允许的最大请求数，超阈值返回 HTTP 429 + Result 体；
    # Redis 不可用时降级放行（可用性优先），由 RateLimitGlobalFilter 执行。
    # path-rules 为按路径特化的更严规则（最长匹配优先）：前端/行为上报接口为 permitAll 公开写库，
    # 单独收紧阈值防刷量（REQ-SEC-006）；未命中规则的路径沿用上方全局阈值。
    rate-limit:
      enabled: ${WHALE_GATEWAY_RATE_LIMIT_ENABLED:true}
      # 客户端标识是否信任 X-Forwarded-For 首段：网关部署在 Nginx 之后（由 Nginx 覆写）时为 true；
      # 若网关直接暴露公网，必须置 false，改用 TCP 远端地址，防止伪造 XFF 绕过限流
      trust-forwarded-for: ${WHALE_GATEWAY_RATE_LIMIT_TRUST_XFF:true}
      limit: ${WHALE_GATEWAY_RATE_LIMIT:200}
      window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:1}
      path-rules:
        # P1-4 登录/令牌端点防爆破：全局 200/s 对单 IP 撞库等于不限，网关层按 IP 追加更严阈值
        # （auth 侧账号锁定之外成本最低的一道；阈值按环境变量可调）
        - path-pattern: /auth/v1/login
          limit: ${WHALE_GATEWAY_RATE_LIMIT_LOGIN:10}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
        - path-pattern: /auth/v1/refresh
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REFRESH:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
        - path-pattern: /social/v1/login
          limit: ${WHALE_GATEWAY_RATE_LIMIT_SOCIAL_LOGIN:10}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_SOCIAL_LOGIN_WINDOW_SECONDS:60}
        # OAuth2 客户端凭据模式同样可被爆破，单独收紧
        - path-pattern: /oauth2/token
          limit: ${WHALE_GATEWAY_RATE_LIMIT_OAUTH2_TOKEN:60}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_OAUTH2_TOKEN_WINDOW_SECONDS:60}
        - path-pattern: /audit/v1/log/frontend/batch
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REPORT:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REPORT_WINDOW_SECONDS:1}
        - path-pattern: /audit/v1/log/behavior/batch
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REPORT:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REPORT_WINDOW_SECONDS:1}
        # Wave 5.75 音频流：一次播放会发起多次 Range 请求，按路径独立阈值防止直连刷流
        - path-pattern: /music/stream/**
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_STREAM:120}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_STREAM_WINDOW_SECONDS:60}
        # Wave 5.75 评论与收藏按用户写操作，单独收紧阈值
        - path-pattern: /music/song/*/comment
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_COMMENT:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_COMMENT_WINDOW_SECONDS:60}
        # Wave 5.75 M5-4 播放票据签发：防止刷票与歌曲探测（正常播放一次播放仅签发一次）
        - path-pattern: /music/play/ticket
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_TICKET:60}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_TICKET_WINDOW_SECONDS:60}
        # Wave 5.75 M5-4 收藏 / 取消收藏：写操作防刷（幂等但会触发计数回写）
        - path-pattern: /music/song/*/like
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_LIKE:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_LIKE_WINDOW_SECONDS:60}
        # Wave 5.77 视频流：一次播放会发起多次 Range 请求，按路径独立阈值防止直连刷流
        - path-pattern: /video/stream/**
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_STREAM:120}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_STREAM_WINDOW_SECONDS:60}
        # Wave 5.77 播放票据签发（单个 / 批量）：防止刷票与内容探测
        - path-pattern: /video/play/ticket
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_TICKET:60}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_TICKET_WINDOW_SECONDS:60}
        # Wave 5.77 评论发表：按用户写操作，单独收紧阈值
        - path-pattern: /video/content/*/comment
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_COMMENT:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_COMMENT_WINDOW_SECONDS:60}
        # Wave 5.77 点赞 / 收藏：写操作防刷（幂等但会触发计数回写）
        - path-pattern: /video/content/*/like
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE_WINDOW_SECONDS:60}
        - path-pattern: /video/content/*/favorite
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE_WINDOW_SECONDS:60}
        # Wave 5.77 上传代理（若前端经网关调用文件上传）：收紧阈值
        - path-pattern: /video/upload/**
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_UPLOAD:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_UPLOAD_WINDOW_SECONDS:60}
    # T4 熔断降级（轻量实现，由 CircuitBreakerGlobalFilter 执行）：
    # timeout-millis 为单次下游调用超时；failure-rate-threshold 为触发阈值（百分比）；
    # sliding-window-size 为失败率统计窗口；wait-duration-in-open-state-millis 为打开后等待时长；
    # apply-to-routes 为启用熔断的路由 id，命中后超时/失败按失败率熔断并降级返回 503。
    # alert-base-url 为熔断打开/恢复时的告警上报地址（whale-ops-alert 内网接口）；留空表示不上报。
    circuit-breaker:
      enabled: ${WHALE_GATEWAY_CIRCUIT_BREAKER_ENABLED:true}
      alert-base-url: ${WHALE_GATEWAY_ALERT_BASE_URL:}
      # 与访问名单/路由覆盖共用同一内网令牌（生产必须配置 WHALE_INTERNAL_TOKEN）：
      # 三处统一从配置项读取，避免只配 Nacos 未设环境变量导致告警上报 401 静默丢失
      internal-token: ${WHALE_INTERNAL_TOKEN:}
      timeout-millis: ${WHALE_GATEWAY_CIRCUIT_BREAKER_TIMEOUT_MILLIS:3000}
      failure-rate-threshold: ${WHALE_GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE:50}
      sliding-window-size: ${WHALE_GATEWAY_CIRCUIT_BREAKER_WINDOW_SIZE:20}
      wait-duration-in-open-state-millis: ${WHALE_GATEWAY_CIRCUIT_BREAKER_WAIT_MILLIS:10000}
      apply-to-routes:
        - whale-service-auth
        - whale-service-auth-brand
        - whale-service-auth-oauth2
        - whale-service-job
        - whale-service-file
        - whale-ops-audit
        - whale-archive
        - whale-service-message
        - whale-mail
        - whale-doc
        - whale-music
        - whale-map
    # T6 内网接口屏蔽（由 InternalApiDenyGlobalFilter 执行）：命中 patterns 的外部请求直接返回 403
    # 2026-11-09 第九批收口（上线必检 network-boundary）：原为逐 Wave 累积的 20+ 条显式清单，
    # 新服务易漏配；现收敛为单段星号通配（星号不跨段）覆盖全部 /<service>/internal/** 形态，
    # 新服务内网端点按该命名约定自动纳管；discovery.locator 服务名前缀形态由过滤器剥前缀兜底（V-01）。
    # 服务侧 InternalTokenFilter 校验 X-Internal-Token 为第二道防线（default-filters 已剥外部伪造头）。
    internal-deny:
      enabled: ${WHALE_GATEWAY_INTERNAL_DENY_ENABLED:true}
      patterns:
        # 单段通配：覆盖 erp/mes/crm/oa/pm/contract/pdm/lms/party/mall/pay/im/music/video/
        # scene/map/doc/mail/message/file/user/dept/tenant/workflow/form/archive/alert 等全部前缀
        - /*/internal/**
        # 版本化内网端点：/user/v1/internal/**（internal 段位于版本段之后，单段通配不跨段；
        # 第二段为版本号，用 `*` 匹配 v1/v2…）
        - /*/*/internal/**
        # P1-3 审计汇聚摄入端点：非 /internal 命名，单独收口
        - /audit/v1/log/ingest/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,routeGovernance
  metrics:
    tags:
      application: ${spring.application.name}
  # E-1 分布式追踪：WebFlux 请求自动产生 span，通过 OTLP 导出到 collector；
  # 与 X-Trace-Id 并存（前者用于链路图，后者用于既有日志 grep 口径）。
  tracing:
    sampling:
      probability: ${WHALE_GATEWAY_TRACE_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}

# 网关调试日志仅在 dev profile 开启（application-dev.yml），避免生产每请求多条 debug 日志放大 IO
logging:
  level:
    org.springframework.cloud.gateway: info
