server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: whale-file
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_file?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理（阶段 4 铺开）。仅扫描 classpath:db/migration；
  # db/init.sql 与历史 migration-*.sql 属于手工/追溯脚本，不在扫描路径内。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  servlet:
    multipart:
      # 与 whale.file.max-size-bytes（默认 50MB）对齐，超限由服务层校验抛参数错误
      max-file-size: 50MB
      max-request-size: 60MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务文件接口的 sys:file:* 权限。
whale:
  permission:
    header:
      enabled: true
  # Wave 5.50：国际化 SDK 自治化。启动时在本服务库幂等创建 sys_i18n_message，
  # 文案回退源为 classpath:i18n/file/messages*；本地管理接口保持默认关闭。
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
    admin:
      enabled: false
  file:
    storage:
      # 活动存储插件类型：local（本地磁盘，默认）| minio（MinIO/S3 兼容对象存储）
      type: ${WHALE_FILE_STORAGE_TYPE:local}
      # 本地插件根目录，同时作为分片上传临时目录根：按 ${root}/${bucket}/${objectKey} 落盘。
      # 默认相对进程工作目录（跨平台），生产环境建议通过环境变量配置绝对路径。
      root: ${WHALE_FILE_STORAGE_ROOT:./data/whale-file}
    # MinIO/S3 插件配置：endpoint 非空时插件自动装配；type=minio 时选为活动插件。
    # 生产/联调通过环境变量注入，凭据不入仓。
    minio:
      # endpoint: http://127.0.0.1:9000
      access-key: ${WHALE_FILE_MINIO_ACCESS_KEY:}
      secret-key: ${WHALE_FILE_MINIO_SECRET_KEY:}
      bucket: ${WHALE_FILE_MINIO_BUCKET:bluewhale}
      region: ${WHALE_FILE_MINIO_REGION:}
      # 写入前自动创建缺失桶：解锁 job/audit 归档独立桶，无需人工预建
      auto-create-bucket: ${WHALE_FILE_MINIO_AUTO_CREATE_BUCKET:true}
    bucket:
      # 默认桶名：upload 未显式指定 bucket 时使用
      default: ${WHALE_FILE_BUCKET_DEFAULT:bluewhale}
    # 单文件最大字节数（全局默认），默认 50MB；未命中上传策略规则的请求按此上限校验
    max-size-bytes: ${WHALE_FILE_MAX_SIZE_BYTES:52428800}
    # 单用户存储配额（全局默认），默认 1GB（1073741824）；0 表示不限
    quota-bytes: ${WHALE_FILE_QUOTA_BYTES:1073741824}
    # 租户级与桶级配额：与上面的个人配额组成三个校验维度，任一维度超限整体拒绝。
    # 默认 0（不限），升级后行为不变；租户/桶维度只在存在租户上下文时生效，
    # 桶维度按租户内的单个桶计量。校验与写入在同一命名锁临界区内完成。
    quota:
      tenant-bytes: ${WHALE_FILE_QUOTA_TENANT_BYTES:0}
      bucket-bytes: ${WHALE_FILE_QUOTA_BUCKET_BYTES:0}
    # CDN 加速：配置后把预签名下载 URL 的 scheme://host[:port] 替换为 CDN 地址，
    # 路径与签名查询串保持不变（S3/OSS 预签名不签 host）；要求 CDN 回源对象存储且不改写 query。
    # 空白表示不启用，行为与未配置时一致。本地存储不支持预签名，配置后也不生效。
    cdn:
      base-url: ${WHALE_FILE_CDN_BASE_URL:}
    # 分片上传分片大小，默认 5MB
    chunk-size-bytes: ${WHALE_FILE_CHUNK_SIZE_BYTES:5242880}
    # 分片上传会话保留时长（小时）：过期会话在下次初始化新会话时清理，避免中途放弃的暂存永久占用磁盘
    chunk-upload-ttl-hours: ${WHALE_FILE_CHUNK_UPLOAD_TTL_HOURS:24}
    # 回收站：逻辑删除后保留 N 天，到期由定时任务物理删除对象与元数据；
    # retention-days <= 0 表示无限期保留（只停用自动清理，不影响列表与恢复）。
    recycle:
      purge-enabled: ${WHALE_FILE_RECYCLE_PURGE_ENABLED:true}
      retention-days: ${WHALE_FILE_RECYCLE_RETENTION_DAYS:30}
      purge-batch-size: ${WHALE_FILE_RECYCLE_PURGE_BATCH_SIZE:200}
      # 清理任务 cron，默认每天 03:30；通过 @Scheduled 占位符读取，不入 FileProperties
      purge-cron: ${WHALE_FILE_RECYCLE_PURGE_CRON:0 30 3 * * ?}
    # 孤儿对象对账：全量列举存储对象与元数据引用，默认关闭，按环境评估后开启。
    # 默认只报告；delete-orphan-objects 才删除「存储有、元数据无」的对象，悬空元数据永不自动删除。
    orphan:
      enabled: ${WHALE_FILE_ORPHAN_ENABLED:false}
      delete-orphan-objects: ${WHALE_FILE_ORPHAN_DELETE_ORPHAN_OBJECTS:false}
      report-samples: ${WHALE_FILE_ORPHAN_REPORT_SAMPLES:20}
      # 对账任务 cron，默认每天 04:00；通过 @Scheduled 占位符读取，不入 FileProperties
      cron: ${WHALE_FILE_ORPHAN_CRON:0 0 4 * * ?}
    # 分享链接：有效期只做上限截断，避免创建近乎永久的公开链接；
    # 下载次数与密码由创建请求决定，访问需登录态（匿名开放需网关白名单，暂不支持）。
    share:
      default-expire-hours: ${WHALE_FILE_SHARE_DEFAULT_EXPIRE_HOURS:168}
      max-expire-hours: ${WHALE_FILE_SHARE_MAX_EXPIRE_HOURS:720}
    # 批量操作：删除与打包共用文件数上限；打包只限制未压缩总字节数，超限整体拒绝以
    # 避免产出残缺压缩包。流式写出不落本地临时文件，响应为分块传输、无 Content-Length。
    batch:
      max-files: ${WHALE_FILE_BATCH_MAX_FILES:100}
      max-zip-bytes: ${WHALE_FILE_BATCH_MAX_ZIP_BYTES:4294967296}
    # 上传内容安全：按文件头魔数识别真实类型（普通上传与分片合并均校验）。
    # 识别为禁止类型直接拒绝；扩展名有映射但内容不符时拒绝；无法识别一律放行（避免误伤自定义格式）。
    # 秒传无内容可查，不参与校验（内容在首次上传时已校验）。
    security:
      magic-enabled: ${WHALE_FILE_SECURITY_MAGIC_ENABLED:true}
      # 禁止上传的内容类型名（FileMagicType 常量名，大小写不敏感），逗号分隔
      blocked-types: ${WHALE_FILE_SECURITY_BLOCKED_TYPES:EXE,ELF,MACHO}
    # G1 大文件上传策略：按网关注入的 X-Permission-Codes 选择生效的单文件上限与配额，
    # 未命中任何规则时回落上面的 max-size-bytes / quota-bytes 默认值（普通业务仍 50MB / 1GB）。
    # 同一请求命中多条规则时取 max-size-bytes 最大的一条；quota-bytes 缺省表示沿用配额默认值，
    # 0 表示不限。大文件请走分片上传（/file/upload/chunk/*），multipart 单请求上限保持不变。
    upload-policy:
      enabled: ${WHALE_FILE_UPLOAD_POLICY_ENABLED:true}
      rules:
        # 视频：2GB / 8GB（AUTH 视频权限 305–322 中的上传权限）
        - permission: sys:video:upload
          max-size-bytes: ${WHALE_FILE_UPLOAD_POLICY_VIDEO_MAX_SIZE_BYTES:2147483648}
          quota-bytes: ${WHALE_FILE_UPLOAD_POLICY_VIDEO_QUOTA_BYTES:8589934592}
        # 电影 / 运营入库：4GB / 不限配额
        - permission: sys:video:movie:manage
          max-size-bytes: ${WHALE_FILE_UPLOAD_POLICY_MOVIE_MAX_SIZE_BYTES:4294967296}
          quota-bytes: ${WHALE_FILE_UPLOAD_POLICY_MOVIE_QUOTA_BYTES:0}
        # 音乐：100MB，配额沿用全局默认
        - permission: sys:music:upload
          max-size-bytes: ${WHALE_FILE_UPLOAD_POLICY_MUSIC_MAX_SIZE_BYTES:104857600}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
