server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8098}
  servlet:
    context-path: /

spring:
  application:
    name: whale-video
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_video?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由部署侧显式配置
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：新服务自 M0 起直接使用 Flyway 版本化建表，不沿用 init.sql 模式
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    # 生产禁止通过 Flyway 清库
    clean-disabled: true
    # 权限 path 等配置可能含 ${} 片段，关闭占位符替换
    placeholder-replacement: false
    # 容器启动时数据库可能尚未就绪
    connect-retries: 10
  data:
    # 播放票据 / 可播状态缓存 / 播放计数 / 首页缓存（M1 起使用）
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# 启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定 sys:video:* 权限。
whale:
  permission:
    header:
      enabled: true
  # 国际化：BizException 文案键按请求 Locale 解析；启动时幂等创建 sys_i18n_message，
  # 属性文件回退源为 classpath:i18n/video/messages*。
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
  video:
    declaration-version: ${WHALE_VIDEO_DECLARATION_VERSION:V1}
    declaration-title: ${WHALE_VIDEO_DECLARATION_TITLE:内容合法与版权无争议声明}
    short-max-duration-seconds: ${WHALE_VIDEO_SHORT_MAX_DURATION_SECONDS:300}
    video-max-duration-seconds: ${WHALE_VIDEO_VIDEO_MAX_DURATION_SECONDS:7200}
    movie-max-duration-seconds: ${WHALE_VIDEO_MOVIE_MAX_DURATION_SECONDS:14400}
    short-max-bytes: ${WHALE_VIDEO_SHORT_MAX_BYTES:314572800}
    video-max-bytes: ${WHALE_VIDEO_VIDEO_MAX_BYTES:2147483648}
    movie-max-bytes: ${WHALE_VIDEO_MOVIE_MAX_BYTES:4294967296}
    video-formats: ${WHALE_VIDEO_VIDEO_FORMATS:video/mp4,video/webm}
    image-formats: ${WHALE_VIDEO_IMAGE_FORMATS:image/jpeg,image/png,image/webp}
    # 长视频一次播放会发起多次 Range 请求，票据需可复用；客户端 240s 主动刷新
    play-ticket-ttl-seconds: ${WHALE_VIDEO_PLAY_TICKET_TTL_SECONDS:300}
    play-ticket-refresh-seconds: ${WHALE_VIDEO_PLAY_TICKET_REFRESH_SECONDS:240}
    playable-cache-seconds: ${WHALE_VIDEO_PLAYABLE_CACHE_SECONDS:30}
    stream-chunk-bytes: ${WHALE_VIDEO_STREAM_CHUNK_BYTES:1048576}
    # 评论默认先发后审 + 审核队列
    comment-pre-audit: ${WHALE_VIDEO_COMMENT_PRE_AUDIT:false}
    history-retention-days: ${WHALE_VIDEO_HISTORY_RETENTION_DAYS:180}
    content-cache-seconds: ${WHALE_VIDEO_CONTENT_CACHE_SECONDS:60}
    file-service-name: ${WHALE_VIDEO_FILE_SERVICE:whale-service-file}
    file-bucket: ${WHALE_VIDEO_FILE_BUCKET:whale-video}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    # 输出 http.server.requests 直方图桶，供首页 / 详情 / 流式 P95 查询（SLO 4.10）
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
