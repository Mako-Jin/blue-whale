server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8093}
  servlet:
    context-path: /

spring:
  application:
    name: whale-archive
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_archive?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令，由部署环境注入 MYSQL_PASSWORD
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化（阶段 4 铺开），脚本位于 classpath:db/migration
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor，按网关注入的 X-Permission-Codes 判定 sys:archive:* 权限
whale:
  permission:
    header:
      enabled: true
  archive:
    # 归档快照与锁定文件所在的对象存储桶
    bucket: ${WHALE_ARCHIVE_BUCKET:whale-archive}
    # 档号格式：BW-{门类编码}-{年度}-{流水号}
    number:
      prefix: ${WHALE_ARCHIVE_NUMBER_PREFIX:BW}
      sequence-width: ${WHALE_ARCHIVE_NUMBER_WIDTH:6}
    # 工作流已通过实例增量同步（M2：调度器 + 手动触发）
    sync:
      enabled: ${WHALE_ARCHIVE_SYNC_ENABLED:false}
      cron: ${WHALE_ARCHIVE_SYNC_CRON:0 */5 * * * *}
      page-size: ${WHALE_ARCHIVE_SYNC_PAGE_SIZE:100}
      max-attempts: ${WHALE_ARCHIVE_SYNC_MAX_ATTEMPTS:3}
      retry-batch-size: ${WHALE_ARCHIVE_SYNC_RETRY_BATCH:50}
      # 定时同步遍历的租户：留空则由租户目录（whale-service-auth）动态查询可用租户
      tenant-ids: ${WHALE_ARCHIVE_SYNC_TENANT_IDS:}
    # F-01 历史归档文件锁定自动补扫（逐租户按游标分批）
    lock-reconcile:
      enabled: ${WHALE_ARCHIVE_LOCK_RECONCILE_ENABLED:false}
      cron: ${WHALE_ARCHIVE_LOCK_RECONCILE_CRON:0 30 3 * * *}
      batch-size: ${WHALE_ARCHIVE_LOCK_RECONCILE_BATCH_SIZE:200}
      max-batches: ${WHALE_ARCHIVE_LOCK_RECONCILE_MAX_BATCHES:10}
      # 留空则复用 sync.tenant-ids，再回退租户目录
      tenant-ids: ${WHALE_ARCHIVE_LOCK_RECONCILE_TENANT_IDS:}
    # 内网服务直连地址（不经网关；生产按部署拓扑覆盖）
    integration:
      workflow-url: ${WHALE_ARCHIVE_WORKFLOW_URL:http://127.0.0.1:8083}
      form-url: ${WHALE_ARCHIVE_FORM_URL:http://127.0.0.1:8084}
      file-url: ${WHALE_ARCHIVE_FILE_URL:http://127.0.0.1:8085}
      auth-url: ${WHALE_ARCHIVE_AUTH_URL:http://127.0.0.1:8081}
      connect-timeout-millis: ${WHALE_ARCHIVE_CONNECT_TIMEOUT:5000}
      read-timeout-millis: ${WHALE_ARCHIVE_READ_TIMEOUT:60000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
