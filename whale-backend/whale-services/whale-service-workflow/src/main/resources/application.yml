server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

spring:
  application:
    name: whale-workflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_workflow?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理（阶段 4 铺开）。仅扫描 classpath:db/migration；
  # db/init.sql 与历史 migration-*.sql 属于手工/追溯脚本，不在扫描路径内。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    # 存量库（无 flyway_schema_history）会以 version=1 登记基线并跳过 V1；若老库缺 tenant_id 等基础列，
    # 后续增量会失败，必须先按 db/migration-*.sql 补齐结构（详见 db/README.md），必要时置 false 手工登记基线
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    # 生产默认 info；本地需要 SQL/流程细节时通过 LOG_LEVEL_BLUEWHALE=debug 覆盖
    com.bluewhale: ${LOG_LEVEL_BLUEWHALE:info}
  pattern:
    # 日志行首输出网关透传的 traceId（RequestContextFilter 写入 MDC，缺失输出 -）
    level: "%5p [%X{traceId:-}]"

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务流程定义接口的 sys:workflow:* 权限。
whale:
  permission:
    header:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # P1-3b：开启 HTTP 请求耗时直方图，供 SLO-3 审批流转 P95 的 histogram_quantile 查询使用
      percentiles-histogram:
        "[http.server.requests]": true

bluewhale:
  workflow:
    # 未发布定义默认禁止发起；存量未发布定义确需继续发起时显式置 true（启动后按定义当前内容发起并打 warn）
    allow-unpublished-start: ${WORKFLOW_ALLOW_UNPUBLISHED_START:false}
    timeout:
      # 超时扫描 cron（也可由调度中心按 job code=workflow.task.overdue 触发）
      scan-cron: '${WORKFLOW_TIMEOUT_SCAN_CRON:0 */10 * * * *}'
      # 单次扫描上限，避免一次拉全表
      scan-limit: ${WORKFLOW_TIMEOUT_SCAN_LIMIT:500}
      # 是否发送站内信提醒：默认关闭，开启前必须保证 auth / message 内网地址可达
      notify-enabled: ${WORKFLOW_TIMEOUT_NOTIFY_ENABLED:false}
      auth-base-url: ${WORKFLOW_AUTH_BASE_URL:http://127.0.0.1:8081}
      message-base-url: ${WORKFLOW_MESSAGE_BASE_URL:http://127.0.0.1:8094}
      connect-timeout-millis: ${WORKFLOW_TIMEOUT_CONNECT_TIMEOUT:800}
      read-timeout-millis: ${WORKFLOW_TIMEOUT_READ_TIMEOUT:1500}
