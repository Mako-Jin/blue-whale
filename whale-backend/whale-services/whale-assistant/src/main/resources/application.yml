server:
  # 网关注入的 X-Permission-Codes 随权限数量增长，Tomcat 默认 8KB 头上限会导致 400（对齐 whale-agent）
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: /

spring:
  application:
    name: whale-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_assistant?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由 starter 的
    # DataSourcePasswordGuard 启动守卫给出明确报错（与 whale-agent 同一口径）
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测（对齐 whale-agent）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理。仅扫描 classpath:db/migration。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# V-02 内网令牌：在 starter 默认模式基础上，把开放 API 路径一并纳入服务侧令牌校验
#（开放 API 供业务后端经 Nacos 直连调用，不经网关；网关侧本就剥离 X-Internal-Token）
bluewhale:
  internal-token:
    path-patterns:
      - /**/internal/**
      - /audit/v1/log/ingest/**
      - /assistant/openapi/**

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务 sys:assistant:* 权限。
whale:
  permission:
    header:
      enabled: true
  # P2 国际化：BizException 文案键按请求 Locale 解析；启动时幂等创建 sys_i18n_message，
  # 属性文件回退源为 classpath:i18n/assistant/messages*。
  i18n:
    enabled: true
    auto-init: true
    module-scan-enabled: true
  assistant:
    # Wave 6.01 M1：委托 ai/whale-ai（内网 8092，不注册网关/Nacos）做 LLM 编排。
    # 本服务只做助手定义/会话/授权/用量，不直连任何模型凭据。
    ai:
      base-url: ${WHALE_AI_BASE_URL:http://127.0.0.1:8092}
      connect-timeout-millis: ${WHALE_AI_CONNECT_TIMEOUT_MILLIS:5000}
      timeout-seconds: ${WHALE_AI_TIMEOUT_SECONDS:120}
    # 单会话消息历史上限（防超长会话拖垮落库与上下文压缩）
    session-max-messages: ${WHALE_ASSISTANT_SESSION_MAX_MESSAGES:200}
    # 单条消息正文上限（字节）
    message-max-bytes: ${WHALE_ASSISTANT_MESSAGE_MAX_BYTES:131072}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
