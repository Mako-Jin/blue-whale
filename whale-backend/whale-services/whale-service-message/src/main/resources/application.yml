server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8094}
  servlet:
    context-path: /

spring:
  application:
    name: whale-message
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_message?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由部署侧显式配置
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化（阶段 4 铺开），脚本位于 classpath:db/migration
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# 启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定 sys:message:* 权限。
whale:
  permission:
    header:
      enabled: true
  message:
    # 无真实供应商阶段的默认口径：外部通道不发起网络请求，只记录 MOCKED/SKIPPED。
    # 生产接入真实渠道时显式设置 WHALE_MESSAGE_MOCK=false。
    mock: ${WHALE_MESSAGE_MOCK:true}
    email:
      enabled: ${WHALE_MESSAGE_EMAIL_ENABLED:false}
      # 发件人；未配置时 EMAIL 渠道记为 SKIPPED
      from: ${WHALE_MESSAGE_EMAIL_FROM:}
    sms:
      enabled: ${WHALE_MESSAGE_SMS_ENABLED:false}
      # 部署侧统一 HTTP 网关，平台不持有短信供应商 AccessKey
      url: ${WHALE_MESSAGE_SMS_URL:}
      token: ${WHALE_MESSAGE_SMS_TOKEN:}
      template-code: ${WHALE_MESSAGE_SMS_TEMPLATE_CODE:BLUEWHALE_MESSAGE}
      sign-name: ${WHALE_MESSAGE_SMS_SIGN_NAME:蓝鲸}
      timeout-millis: ${WHALE_MESSAGE_SMS_TIMEOUT_MILLIS:3000}
    im:
      enabled: ${WHALE_MESSAGE_IM_ENABLED:false}
      # whale-im 内网地址；未配置时 IM 渠道记为 SKIPPED
      base-url: ${WHALE_MESSAGE_IM_BASE_URL:}
      timeout-millis: ${WHALE_MESSAGE_IM_TIMEOUT_MILLIS:3000}
    # 异步投递：默认关闭（保持同步语义），请求 async=true 可逐条开启；
    # 打开 enabled 后所有请求默认异步。超时未投递的消息由补偿任务重新提交。
    send:
      enabled: ${WHALE_MESSAGE_SEND_ENABLED:false}
      pool-size: ${WHALE_MESSAGE_SEND_POOL_SIZE:4}
      queue-capacity: ${WHALE_MESSAGE_SEND_QUEUE_CAPACITY:1000}
      recover-interval-millis: ${WHALE_MESSAGE_SEND_RECOVER_INTERVAL_MS:60000}
      recover-threshold-seconds: ${WHALE_MESSAGE_SEND_RECOVER_THRESHOLD_SECONDS:120}
    # 送达回执（V2）：渠道确认送达/阅读/退信经 /message/v1/internal/receipt 上报，
    # 状态单向推进并异步回调业务方登记的回调地址（outbox + 指数退避重试）。
    receipt:
      enabled: ${WHALE_MESSAGE_RECEIPT_ENABLED:true}
      callback-enabled: ${WHALE_MESSAGE_RECEIPT_CALLBACK_ENABLED:true}
      dispatch-interval-millis: ${WHALE_MESSAGE_RECEIPT_DISPATCH_INTERVAL_MS:15000}
      dispatch-initial-delay-millis: ${WHALE_MESSAGE_RECEIPT_DISPATCH_INITIAL_DELAY_MS:20000}
      dispatch-batch-size: ${WHALE_MESSAGE_RECEIPT_DISPATCH_BATCH_SIZE:50}
      max-attempts: ${WHALE_MESSAGE_RECEIPT_MAX_ATTEMPTS:5}
      # 回调失败退避与 HTTP 超时（属于 receipt 域，误放入 preference 块会让环境变量静默失效）
      retry-backoff-seconds: ${WHALE_MESSAGE_RECEIPT_RETRY_BACKOFF_SECONDS:30}
      connect-timeout-millis: ${WHALE_MESSAGE_RECEIPT_CONNECT_TIMEOUT_MS:1000}
      read-timeout-millis: ${WHALE_MESSAGE_RECEIPT_READ_TIMEOUT_MS:3000}
    # Wave 6.17b：通知偏好解析（偏好数据在 auth sys_user_config，键 notify.<bizType>；
    # 解析失败一律 fail-open 按调用方默认放行）
    preference:
      enabled: ${WHALE_MESSAGE_PREFERENCE_ENABLED:true}
      auth-base-url: ${WHALE_MESSAGE_PREFERENCE_AUTH_BASE_URL:http://127.0.0.1:8081}
      key-prefix: ${WHALE_MESSAGE_PREFERENCE_KEY_PREFIX:notify.}
      max-users: ${WHALE_MESSAGE_PREFERENCE_MAX_USERS:200}
      timeout-millis: ${WHALE_MESSAGE_PREFERENCE_TIMEOUT_MS:3000}
    # 接收人组：按 auth 角色编码展开为接收人（仅 userId，适用于 INAPP / IM 渠道）；
    # 展开失败直接拒绝发送，避免静默发空。
    recipient:
      enabled: ${WHALE_MESSAGE_RECIPIENT_ENABLED:true}
      auth-base-url: ${WHALE_MESSAGE_RECIPIENT_AUTH_BASE_URL:http://127.0.0.1:8081}
      max-members: ${WHALE_MESSAGE_RECIPIENT_MAX_MEMBERS:100}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
