server:
  # 网关注入的 X-Permission-Codes 随权限数量增长，Tomcat 默认 8KB 头上限会导致 400（对齐 whale-agent）
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8089}
  servlet:
    context-path: /

spring:
  application:
    name: whale-twin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_twin?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由 starter 的
    # DataSourcePasswordGuard 启动守卫给出明确报错（与 whale-agent 同一口径）
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测（对齐 whale-agent）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理。仅扫描 classpath:db/migration。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# V-02 内网令牌：M2 起 whale-twin 需读 whale-iot internal 实时态、M3 起供
# whale-assistant/whale-agent 反向读取孪生实体，均走 starter 默认 /**/internal/** 守卫。
bluewhale:
  internal-token:
    path-patterns:
      - /**/internal/**

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务 sys:twin:* 权限。
whale:
  permission:
    header:
      enabled: true
  twin:
    # SSE 心跳间隔（秒）：空闲连接按此发注释帧，避免中间代理掐链（对齐 whale-iot 口径）
    stream-heartbeat-seconds: ${WHALE_TWIN_STREAM_HEARTBEAT_SECONDS:30}
    # M2：绑定实时态来源（whale-iot 内网只读接口，不经网关直连）
    iot:
      base-url: ${WHALE_TWIN_IOT_BASE_URL:http://127.0.0.1:8088}
      timeout-seconds: ${WHALE_TWIN_IOT_TIMEOUT_SECONDS:5}
    runtime:
      # 绑定轮询总开关（关闭后仅保留绑定 CRUD 与快照接口）
      enabled: ${WHALE_TWIN_RUNTIME_ENABLED:true}
      # 调度 tick（毫秒）；绑定实际周期由其 pollIntervalMs 决定
      tick-ms: ${WHALE_TWIN_RUNTIME_TICK_MS:5000}
      # 单场景单 tick 允许触达的最大设备数
      max-devices-per-scene: ${WHALE_TWIN_MAX_DEVICES_PER_SCENE:50}
      # 单场景单 tick 允许触达的最大 internal_api 绑定数
      max-apis-per-scene: ${WHALE_TWIN_MAX_APIS_PER_SCENE:20}
      # 无头评估（Wave 6.08）：无订阅者的场景也周期轮询并落库告警，关闭则回到「有人看才评估」
      headless-enabled: ${WHALE_TWIN_HEADLESS_ENABLED:true}
      # 无头评估轮次间隔（毫秒，独立于 tick；绑定实际周期仍由 pollIntervalMs 决定）
      headless-interval-ms: ${WHALE_TWIN_HEADLESS_INTERVAL_MS:15000}
      # 单轮无头评估覆盖的最大场景数（按场景ID升序截断）
      max-headless-scenes: ${WHALE_TWIN_MAX_HEADLESS_SCENES:20}
    # M2（Wave 6.05）：internal_api 绑定源——按 bindKey 轮询平台内部只读 GET 接口。
    # 白名单前缀约束可调用范围；base-urls 为服务名 → 内网地址路由表（iot 缺省回退 iot.base-url）
    internal-api:
      enabled: ${WHALE_TWIN_INTERNAL_API_ENABLED:true}
      timeout-seconds: ${WHALE_TWIN_INTERNAL_API_TIMEOUT_SECONDS:5}
      allowed-prefixes:
        - /iot/internal/
        - /twin/internal/
        - /assistant/openapi/
      base-urls: {}
    # M1（Wave 6.04）：AI 解读（whale-assistant 开放 API，内网直连；assistant-code 为空则前端入口禁用）
    assistant:
      base-url: ${WHALE_TWIN_ASSISTANT_BASE_URL:http://127.0.0.1:8087}
      assistant-code: ${WHALE_TWIN_ASSISTANT_CODE:}
      timeout-seconds: ${WHALE_TWIN_ASSISTANT_TIMEOUT_SECONDS:60}
    # Wave 6.10 M0：告警外发（webhook）。默认关闭——未配置地址时不产生任何出站请求。
    # 地址属运维配置（不是用户输入）；同场景同状态键同级别受 cooldown-seconds 冷却，防抖动刷屏。
    alert-notify:
      enabled: ${WHALE_TWIN_NOTIFY_ENABLED:false}
      min-level: ${WHALE_TWIN_NOTIFY_MIN_LEVEL:warn}
      timeout-seconds: ${WHALE_TWIN_NOTIFY_TIMEOUT_SECONDS:5}
      webhook-token: ${WHALE_TWIN_NOTIFY_WEBHOOK_TOKEN:}
      cooldown-seconds: ${WHALE_TWIN_NOTIFY_COOLDOWN_SECONDS:300}
      # 逗号分隔的多个地址，如 ${WHALE_TWIN_NOTIFY_WEBHOOK_URLS:}
      webhook-urls: ${WHALE_TWIN_NOTIFY_WEBHOOK_URLS:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
