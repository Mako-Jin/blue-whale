        predicates:
          - name: Path
            args:
              patterns: /brand/**
        filters: []
      - id: whale-service-auth-oauth-client
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /oauth-client/**
        filters: []
      # OAuth2.0 授权服务器（权限中心扩展 M1）：协议端点与发现文档
      - id: whale-service-auth-oauth2
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /oauth2/**
        filters: []
      - id: whale-service-auth-wellknown
