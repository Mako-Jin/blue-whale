# 网关基础路由兜底（冷备）：Nacos 不可用/无动态路由时由 NacosRouteDefinitionRepository 加载。
# 结构与 Nacos whale-gateway-routes.yaml 一致（whale.gateway.dynamic-routes），按 id 合并且 Nacos 优先。
whale:
  gateway:
    dynamic-routes:
      - id: whale-service-auth
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              # /social/v1/** 为三方登录（权限中心扩展 M2）：授权起始/渠道回调走浏览器跳转，
              # 一次性登录码换令牌为短时效凭证交换；安全由 auth 服务白名单 + state 一次性消费保证
              patterns: /auth/v1/**,/auth/**,/user/**,/dept/**,/role/**,/menu/**,/permission/**,/social/v1/**
        filters: []
      - id: whale-service-auth-tenant
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /tenant/**
        filters: []
      - id: whale-service-auth-brand
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /brand/**,/oauth-client/**
        filters: []
      # OAuth2.0 授权服务器（权限中心扩展 M1）：协议端点与发现文档
      - id: whale-service-auth-oauth2
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /oauth2/**,/.well-known/**
        filters: []
