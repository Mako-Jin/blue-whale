# 网关基础路由兜底（冷备）：Nacos 不可用/无动态路由时由 NacosRouteDefinitionRepository 加载。
# 结构与 Nacos whale-gateway-routes.yaml 一致（whale.gateway.dynamic-routes），按 id 合并且 Nacos 优先。
whale:
  gateway:
    dynamic-routes:
      # 【必须一条路由一个 pattern】Gateway 的 Path 断言不会按逗号切分 args.patterns：
      # 写成 `/a/**,/b/**` 会被当作**一整个** pattern 编译，这条路由永远不命中，
      # 请求直接掉到静态资源 handler → 404「服务不可用」。
      # 而 RouteDefinitionValidator 自己按逗号 split 校验，所以这种写法能通过校验、
      # 只在真正转发时失效 —— 是最难查的一类（只有 Nacos 动态路由缺失时才走兜底，
      # 平时被 Nacos 覆盖看不出来）。
      # /social/v1/** 为三方登录（权限中心扩展 M2）：授权起始/渠道回调走浏览器跳转，
      # 一次性登录码换令牌为短时效凭证交换；安全由 auth 服务白名单 + state 一次性消费保证
      - id: whale-service-auth
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /auth/v1/**
        filters: []
      - id: whale-service-auth-root
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /auth/**
        filters: []
      - id: whale-service-auth-user
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /user/**
        filters: []
      - id: whale-service-auth-dept
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /dept/**
        filters: []
      - id: whale-service-auth-role
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /role/**
        filters: []
      - id: whale-service-auth-menu
        uri: lb://whale-service-auth
