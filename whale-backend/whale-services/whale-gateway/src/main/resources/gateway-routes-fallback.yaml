        filters: []
      # 权限中心扩展 M3：用户档案 / 用户组 / 权限策略 / 角色约束 / 会话管理 / 登录历史
      # （一条路由只能挂一个 pattern，Gateway 的 Path 断言不按逗号切分）
      - id: whale-service-auth-user-profile
