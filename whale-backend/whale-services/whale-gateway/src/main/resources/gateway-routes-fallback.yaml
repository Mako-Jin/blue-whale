          - name: Path
            args:
              patterns: /permission/**
        filters: []
      - id: whale-service-auth-social
        uri: lb://whale-service-auth
        predicates:
          - name: Path
            args:
              patterns: /social/v1/**
        filters: []
      - id: whale-service-auth-tenant
