# ============================================================
# 站点根托管（APP_BASE=/）
# 适用：admin 主控台、qiankun 基座(whale-platform)、ops/agent/设计器
# 构建产物直接落在 /usr/share/nginx/html/
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 主应用 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|map|woff|woff2|ttf|eot|otf|jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
