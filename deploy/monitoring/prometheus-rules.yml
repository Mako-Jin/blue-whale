# BlueWhale 平台告警规则（本地 / 生产通用）
# 由 tools/monitoring/prometheus.local.yml 的 rule_files 引用，生产侧可直接挂载本文件。
# 未接入 Alertmanager 时，规则命中会以 FIRING 状态展示在 Prometheus /alerts 与 Grafana 面板中。

groups:
  - name: bluewhale-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"whale-.*|nacos"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: '服务不可用：{{ $labels.job }} / {{ $labels.instance }}'
          description: 'Prometheus 已连续 1 分钟无法抓取 {{ $labels.instance }}（job={{ $labels.job }}），请检查进程与端口。'

      - alert: TargetFlapping
        expr: changes(up{job=~"whale-.*"}[10m]) > 4
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '抓取抖动：{{ $labels.job }} / {{ $labels.instance }}'
          description: '10 分钟内 up 状态变化超过 4 次，服务可能反复重启或网络不稳定。'

  - name: bluewhale-http
    rules:
      - alert: Http5xxRateHigh
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application=~"whale-.*",status=~"5.."}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{application=~"whale-.*"}[5m])), 1e-9)
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: '5xx 错误率过高：{{ $labels.application }}'
          description: '{{ $labels.application }} 近 5 分钟 5xx 占比超过 5%（当前 {{ $value | humanizePercentage }}）。'

      - alert: LoginP95Slow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{application="whale-service-auth",uri="/auth/login"}[5m]))
          ) > 1.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '登录 P95 超过 1500ms'
          description: 'SLO-1 失守：whale-service-auth 登录接口 P95 为 {{ $value }}s，持续 5 分钟。'

  - name: bluewhale-doc
    rules:
      - alert: DocSaveConflictSpike
        expr: sum(rate(doc_page_save_conflict_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '文档保存冲突持续偏高'
          description: '近 5 分钟文档保存冲突速率超过 1 次/秒并持续 10 分钟，可能存在多人编辑同一页面或客户端未刷新 revision。'

      - alert: DocSearchP95Slow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(doc_search_seconds_bucket{application="whale-doc"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '文档搜索 P95 超过 1000ms'
          description: 'SLO-4 失守：whale-doc 搜索 P95 为 {{ $value }}s，持续 10 分钟，请检查 ngram 索引与空间规模。'

      - alert: DocOrphanCleanupFailed
        expr: increase(doc_orphan_attachment_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '文档孤儿附件引用清理失败'
          description: '近 1 小时 whale-doc 孤儿附件引用清理出现 {{ $value }} 次失败批次，请检查数据库连接与表锁。'

  - name: bluewhale-jvm
    rules:
      - alert: JvmHeapHigh
        expr: |
          sum by (application) (jvm_memory_used_bytes{application=~"whale-.*",area="heap"})
          /
          clamp_min(sum by (application) (jvm_memory_max_bytes{application=~"whale-.*",area="heap"}), 1)
          > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'JVM 堆使用率过高：{{ $labels.application }}'
          description: '{{ $labels.application }} 堆使用率 {{ $value | humanizePercentage }}，持续 5 分钟，注意 OOM 风险。'

  # 审计 MQ（AUTH-10）：指标由 infrastructure/docker 的 rabbitmq-exporter 提供，
  # job 名 rabbitmq；未部署 exporter 时本组规则不会命中（无数据），不影响其他告警。
  - name: bluewhale-rabbitmq
    rules:
      - alert: AuditDlqNotEmpty
        expr: sum(rabbitmq_queue_messages{queue="bluewhale.audit.dlq"}) > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '审计死信队列存在未处理消息'
          description: 'bluewhale.audit.dlq 积压 {{ $value }} 条并持续 10 分钟。请通过 RabbitMQ 管理台或 rabbitmqadmin 查看死信原因并重放，避免毒消息静默堆积。'

      - alert: AuditQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready{queue="bluewhale.audit.queue"}) > 1000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '审计队列消费积压'
          description: 'bluewhale.audit.queue 待消费消息 {{ $value }} 条并持续 10 分钟，请检查 whale-audit 消费线程与数据库写入耗时。'

      - alert: RabbitmqExporterDown
        expr: up{job="rabbitmq"} == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'rabbitmq-exporter 不可用'
          description: 'Prometheus 连续 5 分钟无法抓取 rabbitmq-exporter:9419，审计队列积压告警将失效，请检查容器与 RabbitMQ management 插件状态。'

  # 审计服务业务指标（whale-audit 的 /actuator/prometheus）
  - name: bluewhale-audit
    rules:
      - alert: AuditArchiveBacklogHigh
        expr: audit_archive_pending > 100000
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '审计日志归档积压过高'
          description: '过期未归档行数 {{ $value }} 并持续 30 分钟，单轮归档追不上写入速度；请调大 whale.audit.export.max-rows 或缩短归档触发间隔。'

      - alert: AuditExportFailures
        expr: increase(audit_export_duration_seconds_count{result="failure"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '审计日志导出失败次数偏高'
          description: '近 15 分钟导出失败 {{ $value }} 次，请检查 whale-file 可用性与导出任务状态。'

      - alert: AuditMqRejectedSpike
        expr: increase(audit_mq_consume_total{result="rejected"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '审计 MQ 毒消息增多'
          description: '近 15 分钟有 {{ $value }} 条审计消息被拒绝并转入死信队列，请检查生产者版本与消息契约，修复后经 /audit/internal/mq/dlq/replay 重放。'
