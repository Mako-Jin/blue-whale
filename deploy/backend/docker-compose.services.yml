# ============================================================
# 蓝鲸后端业务服务 - 容器编排（本地开发）
#
# 前置：中间件由 infrastructure/docker/docker-compose.yml 提供
#   - Redis    → 容器 bw-redis    （docker 网络 bluewhale-dev_bw-net，无密码）
#   - RabbitMQ → 容器 bw-rabbitmq （同上）
#   - MySQL    → 宿主机原生实例   （0.0.0.0:3306，经 host.docker.internal 访问）
#   - Nacos    → 宿主机原生实例   （0.0.0.0:8848，经 host.docker.internal 访问）
#
# 镜像需先用 deploy/backend/Dockerfile.runtime 构建（context 只放一个 app.jar）。
# 推荐用脚本一次构建 33 个服务（内含 VM 余量校验）：
#   scripts/dev/build-service-images.sh              # 全部
#   scripts/dev/build-service-images.sh crm pm mail  # 指定服务
#
# 启动：docker compose -f deploy/backend/docker-compose.services.yml --env-file .env up -d
#   默认 20 个核心服务（music / party 属 demo profile，需 --profile demo 显式起）。
#   另有 11 个扩展服务按域分组挂在 ops / collab / aiot / biz / ext 下，默认关闭：
#   8G 的 Docker VM 装不下 33 个 Spring 进程，一次只起一组，预算见 README。
#
# 内存：Docker VM 上限 8GB（~/.wslconfig）。20 个核心服务约占 7.2G，余量不足 1G，
#   因此 build 前先看 MemAvailable，低于 1G 要先停非必需容器（否则 buildkit 会把引擎拖死）。
# ============================================================

name: bluewhale-app

x-common: &common
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - bw-net
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  mem_limit: 900m

services:
  # ---------------- 网关 ----------------
  gateway:
    <<: *common
    image: bluewhale/whale-gateway:dev
    container_name: bw-gateway
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8080"
      NACOS_SERVER: ${NACOS_SERVER}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: "6379"
      # 熔断打开/恢复时向 whale-alert 上报告警记录（alert 属 ops profile，未起时调用失败仅记 WARN）
      WHALE_GATEWAY_ALERT_BASE_URL: "${WHALE_GATEWAY_ALERT_BASE_URL:-http://bw-alert:9103}"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 60s

  # ---------------- 认证 ----------------
  auth:
    <<: *common
    image: bluewhale/whale-auth:dev
    container_name: bw-auth
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8081"
      NACOS_SERVER: ${NACOS_SERVER}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: "6379"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # auth 的 application.yml 里数据源 URL 是硬编码 127.0.0.1，必须用 Spring 标准变量覆盖
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bluewhale_auth?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      # 定时任务迁入 whale-job：口令到期提醒（auth.password.expiry-notice）
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - auth-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 支付 ----------------
  pay:
    <<: *common
    image: bluewhale/whale-pay:dev
    container_name: bw-pay
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8086"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8086/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- ERP ----------------
  erp:
    <<: *common
    image: bluewhale/whale-erp:dev
    container_name: bw-erp
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9001"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9001/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- OA ----------------
  oa:
    <<: *common
    image: bluewhale/whale-oa:dev
    container_name: bw-oa
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9004"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 定时任务迁入 whale-job：关闭进程内 cron、开放内网触发端点、向调度中心注册执行器
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - oa-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:9004:9004"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9004/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 工作流 ----------------
  # CRM 商务订单 / 报价 / 退换货 / 开票审批依赖本服务（内网直连 8083，不经网关）
  workflow:
    <<: *common
    image: bluewhale/whale-workflow:dev
    container_name: bw-workflow
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8083"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # 8083 落在 Windows 保留端口段（Hyper-V 动态排除），宿主侧映射到 18083
      - "127.0.0.1:18083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- MES ----------------
  # ERP 生产订单下达 → MES 工单；MES 完工/进度经 outbox 回传 ERP 内网端点
  mes:
    <<: *common
    image: bluewhale/whale-mes:dev
    container_name: bw-mes
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9002"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 完工/进度回传走 outbox（默认关闭，此处显式开启）
      WHALE_MES_OUTBOX_ENABLED: "true"
      WHALE_ERP_URL: "http://bw-erp:9001"
    ports:
      - "127.0.0.1:9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9002/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- Message ----------------
  # 统一消息服务：CRM 营销 / OA 待办 / 合同签署的邮件、短信、站内信投递
  # 首次对既有库（db/init.sql 初始化，缺 msg_announcement）启动时用 SPRING_FLYWAY_BASELINE_VERSION=0
  # 让 V1 基线脚本补建缺表；补完后可去掉该变量
  message:
    <<: *common
    image: bluewhale/whale-message:dev
    container_name: bw-message
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8094"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    ports:
      - "127.0.0.1:8094:8094"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8094/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 定时任务调度中心 ----------------
  job:
    <<: *common
    image: bluewhale/whale-job:dev
    container_name: bw-job
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8082"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # application.yml 里数据源地址硬编码 127.0.0.1，容器内必须整条覆盖
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bluewhale_job?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: "6379"
      # 既有库由 db/init.sql 建、无 flyway 历史，基线从 0 开始补 V1 + V2
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      WHALE_JOB_FILE_SERVICE_URL: "http://bw-file:8085"
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- CRM ----------------
  crm:
    <<: *common
    image: bluewhale/whale-crm:dev
    container_name: bw-crm
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9007"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 内网直连：ERP（订单/退货/应收）与 workflow（订单/退换货/开票审批）
      WHALE_CRM_ERP_ENABLED: "true"
      WHALE_ERP_URL: "http://bw-erp:9001"
      WHALE_WORKFLOW_URL: "http://bw-workflow:8083"
      # 营销触达投递：whale-message 内网地址（application.yml 未声明该段，靠 relaxed binding 注入，
      # 落到 CrmMarketingProperties#messageUrl；默认值 127.0.0.1:8085 已被 bw-file 占用）
      WHALE_CRM_MARKETING_MESSAGE_URL: "http://bw-message:8094"
      # 送达回执回调：消息服务按 providerMessageId 匹配投递记录后回调本端点（容器内走容器名）
      WHALE_CRM_MARKETING_CALLBACK_URL: "http://bw-crm:9007/crm/internal/marketing/delivery-callback"
      WHALE_CRM_AR_ENABLED: "true"
      # 流程定义 ID 由 /workflow/internal/definition/ensure 幂等种子产生（bluewhale_workflow）
      WHALE_CRM_ORDER_DEFINITION_ID: "2119255494021709826"
      WHALE_CRM_RETURN_DEFINITION_ID: "2119328771817082881"
      WHALE_CRM_INVOICE_DEFINITION_ID: "2119328772467200001"
      # 定时任务迁入 whale-job：关闭进程内 cron、开放内网触发端点、向调度中心注册执行器
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - crm-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:9007:9007"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9007/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ============================================================
  # 以下 8 个服务原先只在验证时临时起过，现纳入常态编排。
  # 内存约束：Docker VM 上限约 5.8G，故堆压到 320m / mem_limit 600m，
  # 仅保留必要依赖（Redis / RabbitMQ / MySQL），不使用默认 900m 配额。
  # 定时任务：进程内 cron 全关，只留内网触发端点 + 执行器注册。
  # ============================================================

  # ---------------- 在线文档 / Wiki ----------------
  doc:
    <<: *common
    image: bluewhale/whale-doc:dev
    container_name: bw-doc
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8095"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - doc-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8095/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 视频平台 ----------------
  video:
    <<: *common
    image: bluewhale/whale-video:dev
    container_name: bw-video
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8098"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - video-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:8098:8098"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8098/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 音乐平台 ----------------
  # 演示模块，默认不启动：8G 的 VM 要留出内存给 file / contract / mall（高频依赖）。
  # 需要时显式带 profile：docker compose --profile demo up -d music
  music:
    profiles: ["demo"]
    <<: *common
    image: bluewhale/whale-music:dev
    container_name: bw-music
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8096"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - music-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8096/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 归档 ----------------
  # 跨服务地址必须用容器名：容器内 127.0.0.1 不等于宿主机
  archive:
    <<: *common
    image: bluewhale/whale-archive:dev
    container_name: bw-archive
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8093"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 两个任务的方法级开关默认关闭，关时只返回 skipped 空转，这里显式打开
      WHALE_ARCHIVE_SYNC_ENABLED: "true"
      WHALE_ARCHIVE_LOCK_RECONCILE_ENABLED: "true"
      WHALE_ARCHIVE_WORKFLOW_URL: "http://bw-workflow:8083"
      WHALE_ARCHIVE_AUTH_URL: "http://bw-auth:8081"
      WHALE_ARCHIVE_FILE_URL: "http://bw-file:8085"
      WHALE_ARCHIVE_FORM_URL: "http://bw-form:8084"
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - archive-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:8093:8093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8093/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 审计 ----------------
  # 数据源地址在 yml 里硬编码 127.0.0.1，必须整条覆盖
  audit:
    <<: *common
    image: bluewhale/whale-audit:dev
    container_name: bw-audit
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9101"
      NACOS_SERVER: ${NACOS_SERVER}
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bluewhale_audit?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      WHALE_AUDIT_EXPORT_FILE_SERVICE_URL: "http://bw-file:8085"
      # audit 的 yml 没有显式 redis 配置，Redisson starter 会回落到 localhost:6379，
      # 必须整条覆盖；无密码 Redis 不要设 password 键，否则 Redisson 会发 AUTH 被拒。
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - audit-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9101/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 学习培训 ----------------
  lms:
    <<: *common
    image: bluewhale/whale-lms:dev
    container_name: bw-lms
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9008"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - lms-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:9008:9008"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9008/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 党建 / 工会 ----------------
  # 演示模块，默认不启动，同 music。需要时：docker compose --profile demo up -d party
  party:
    profiles: ["demo"]
    <<: *common
    image: bluewhale/whale-party:dev
    container_name: bw-party
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9009"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - party-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:9009:9009"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9009/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 产品数据管理 ----------------
  pdm:
    <<: *common
    image: bluewhale/whale-pdm:dev
    container_name: bw-pdm
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9003"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_SCHEDULE_LOCAL_ENABLED: "false"
      WHALE_SCHEDULE_TRIGGER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_REGISTER_ENABLED: "true"
      WHALE_SCHEDULE_EXECUTOR_SERVER_URL: "http://bw-job:8082"
      # 执行日志落盘目录：挂命名卷，容器重建不丢（调度中心按流水回捞依赖它）
      WHALE_SCHEDULE_EXECUTOR_LOG_DIR: "/var/log/whale-job"
    volumes:
      - pdm-joblogs:/var/log/whale-job
    ports:
      - "127.0.0.1:9003:9003"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9003/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 表单 ----------------
  # 无定时任务、无 redis/rabbit 依赖；archive 的归档同步依赖它读表单值与字段定义
  form:
    <<: *common
    image: bluewhale/whale-form:dev
    container_name: bw-form
    mem_limit: 480m
    environment:
      JAVA_OPTS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8084"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 120s

  # ---------------- 文件服务 ----------------
  # 跨服务高频依赖：CRM 分析导出 / 客户合并、OA 网盘与公文附件、LMS 课件、PDM 附件、
  # archive 归档、audit 导出、job 附件清理都走它。原先不在常态编排里，
  # 上面几处 WHALE_*_FILE_SERVICE_URL 全部指向一个不存在的容器（功能实际不可用）。
  file:
    <<: *common
    image: bluewhale/whale-file:dev
    container_name: bw-file
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8085"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 该服务用共享 starter 的 Spring 标准属性（yml 无 REDIS_HOST 占位）
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 合同 ----------------
  # CRM 客户合并要重写合同引用，依赖它在线
  contract:
    <<: *common
    image: bluewhale/whale-contract:dev
    container_name: bw-contract
    environment:
      JAVA_OPTS: "-Xms192m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9006"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:9006:9006"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9006/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 商城 ----------------
  mall:
    <<: *common
    image: bluewhale/whale-mall:dev
    container_name: bw-mall
    depends_on:
      file:
        condition: service_started
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9010"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      # 库由 01-init-databases.sql 建成但首启无 flyway 历史，需 baseline（有历史后是空操作）
      WHALE_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # 内网直连容器，跳过服务发现
      WHALE_MALL_PAY_BASE_URL: "http://bw-pay:8086"
      WHALE_FILE_URL: "http://bw-file:8085"
    ports:
      - "127.0.0.1:9010:9010"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9010/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 18
      start_period: 90s

  # ============================================================
  # 扩展服务（Wave 6 及之后交付，默认不启动）
  #
  # 为什么默认不启动：Docker VM 上限 8GB（~/.wslconfig），22 个核心服务已占约 7.2G，
  # 余量不足 1G。10 个扩展服务合计需 5~6G，物理上无法与核心服务同时常驻，
  # 硬塞进默认集会直接把引擎拖死（历史事故：MemAvailable < 1G 时 docker ps 全 500）。
  # 因此全部纳入本编排文件统一管理，但按域分组，一次起一组：
  #
  #   --profile ops      alert(9103) / monitor(9102)                   预算 ~1.0G
  #   --profile collab   im(8091) / mail(8099) / assistant(8087)       预算 ~1.9G
  #   --profile aiot     agent(8090) / iot(8088) / scene(8097)         预算 ~1.7G
  #   --profile biz      pm(9005) / map(8100)                          预算 ~1.1G
  #   --profile ext      以上全部（需先停掉若干核心服务腾出余量）
  #
  # 起组前先看余量，不足先 `docker compose stop <非关键服务>`：
  #   docker exec bw-redis grep MemAvailable /proc/meminfo
  #
  # 组内不写跨 profile 的 depends_on：依赖服务不在同一 profile 时 compose 会拒绝起服，
  # 一律靠容器名直连 + 客户端重试兜底（与 core 服务同一口径）。
  # ============================================================

  # ---------------- 项目管理 ----------------
  # 站内通知走 whale-im，审批走 whale-workflow（均为内网直连）
  pm:
    <<: *common
    image: bluewhale/whale-pm:dev
    container_name: bw-pm
    profiles: ["biz", "ext"]
    mem_limit: 700m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9005"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      PM_NOTIFY_IM_URL: "http://bw-im:8091"
      PM_APPROVAL_WORKFLOW_URL: "http://bw-workflow:8083"
    ports:
      - "127.0.0.1:9005:9005"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9005/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 地图 ----------------
  # 底图/逆地理走腾讯与高德公网 API，密钥缺省时相关能力关闭，服务本身可起
  map:
    <<: *common
    image: bluewhale/whale-map:dev
    container_name: bw-map
    profiles: ["biz", "ext"]
    mem_limit: 600m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8100"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      AMAP_MAP_KEY: ${AMAP_MAP_KEY:-}
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8100/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 告警 ----------------
  # Alertmanager 入站 → 落库去重 → 邮件/Webhook/短信三渠道（渠道默认全关，按需开）
  alert:
    <<: *common
    image: bluewhale/whale-alert:dev
    container_name: bw-alert
    profiles: ["ops", "ext"]
    mem_limit: 700m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9103"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Alertmanager 入站令牌：默认值仅本地可用，非本机部署必须覆盖
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-bluewhale-alert-token}
    ports:
      - "127.0.0.1:9103:9103"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9103/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 监控聚合 ----------------
  # 无库采集型服务：仅聚合 Nacos 服务发现与 actuator 指标，不持有业务库
  monitor:
    <<: *common
    image: bluewhale/whale-monitor:dev
    container_name: bw-monitor
    profiles: ["ops", "ext"]
    mem_limit: 500m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx320m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "9102"
      NACOS_SERVER: ${NACOS_SERVER}
    ports:
      - "127.0.0.1:9102:9102"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9102/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 即时通讯 ----------------
  # WebSocket 长连接 + Redis 在线态；用户名册校验走 whale-service-auth，机器人走 whale-agent
  im:
    <<: *common
    image: bluewhale/whale-im:dev
    container_name: bw-im
    profiles: ["collab", "ext"]
    mem_limit: 800m
    environment:
      JAVA_OPTS: "-Xms192m -Xmx448m -XX:MaxMetaspaceSize=288m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8091"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      WHALE_IM_AUTH_BASE_URL: "http://bw-auth:8081"
      WHALE_IM_AGENT_BASE_URL: "http://bw-agent:8090"
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8091/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 邮件 ----------------
  # IMAP/SMTP 账号由业务侧维护，邮件服务器（Mailcow）不在本编排内；
  # 附件读写走 whale-file，全文索引为进程内 Lucene（落盘目录挂命名卷）
  mail:
    <<: *common
    image: bluewhale/whale-mail:dev
    container_name: bw-mail
    profiles: ["collab", "ext"]
    mem_limit: 800m
    environment:
      JAVA_OPTS: "-Xms192m -Xmx448m -XX:MaxMetaspaceSize=288m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8099"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_MAIL_FILE_BASE_URL: "http://bw-file:8085"
      # 收信同步默认关闭（whale.mail.sync-enabled 默认 false），容器化后由运维按账号启用
      WHALE_MAIL_SYNC_ENABLED: ${WHALE_MAIL_SYNC_ENABLED:-false}
      # Lucene 索引落盘位置（引擎默认 mysql，切 lucene 时才使用；多实例必须共享卷）
      WHALE_MAIL_SEARCH_INDEX_DIR: "/app/data/mail-index"
    volumes:
      - mail-index:/app/data/mail-index
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8099/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 智能助手 ----------------
  # 只做助手定义/会话/授权/用量，LLM 编排委托 whale-ai（内网 8092，不在本仓库/编排内）；
  # 未接 whale-ai 时服务可正常起服，对话类接口返回上游不可用
  assistant:
    <<: *common
    image: bluewhale/whale-assistant:dev
    container_name: bw-assistant
    profiles: ["collab", "ext"]
    mem_limit: 600m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8087"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_AI_BASE_URL: ${WHALE_AI_BASE_URL:-http://bw-ai:8092}
    ports:
      - "127.0.0.1:8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8087/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 智能体 ----------------
  # 知识库采集 whale-file / whale-doc，租户目录查 whale-service-auth；
  # LLM 走外部 OpenAI 兼容端点（WHALE_AGENT_LLM_BASE_URL / WHALE_AGENT_LLM_API_KEY 配了才可用）
  agent:
    <<: *common
    image: bluewhale/whale-agent:dev
    container_name: bw-agent
    profiles: ["aiot", "ext"]
    mem_limit: 800m
    environment:
      JAVA_OPTS: "-Xms192m -Xmx448m -XX:MaxMetaspaceSize=320m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8090"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_AGENT_FILE_URL: "http://bw-file:8085"
      WHALE_AGENT_AUTH_URL: "http://bw-auth:8081"
      WHALE_AGENT_DOC_URL: "http://bw-doc:8095"
      WHALE_AGENT_LLM_BASE_URL: ${WHALE_AGENT_LLM_BASE_URL:-https://api.openai.com/v1}
      WHALE_AGENT_LLM_API_KEY: ${WHALE_AGENT_LLM_API_KEY:-}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 物联网 ----------------
  # 不做常驻 MQTT 客户端：遥测经 EMQX（infrastructure 编排的 bw-emqx）Webhook 转发到
  # /iot/internal/emqx/**，设备超限告警回调 whale-alert
  iot:
    <<: *common
    image: bluewhale/whale-iot:dev
    container_name: bw-iot
    profiles: ["aiot", "ext"]
    mem_limit: 600m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8088"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_IOT_EMQX_API: "http://bw-emqx:18083"
      WHALE_IOT_EMQX_MQTT_HOST: "bw-emqx"
      WHALE_IOT_EMQX_MQTT_PORT: "1883"
      WHALE_IOT_ALERT_BASE_URL: "http://bw-alert:9103"
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 场景编排 ----------------
  # 2D 首屏预算校验；3D（three-d-enabled）默认关闭，M3 解冻评审通过后才开
  scene:
    <<: *common
    image: bluewhale/whale-scene:dev
    container_name: bw-scene
    profiles: ["aiot", "ext"]
    mem_limit: 600m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8097"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:8097:8097"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8097/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------- 数字孪生（Wave 6.03+，aiot 组） ----------------
  # 依赖 whale-iot 内网实时态（绑定轮询）、whale-assistant 开放 API（AI 解读）、
  # whale-message 内网发送（告警站内信）。三者均按容器名直连，不写跨 profile depends_on。
  twin:
    <<: *common
    image: bluewhale/whale-twin:dev
    container_name: bw-twin
    profiles: ["aiot", "ext"]
    mem_limit: 700m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx448m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8089"
      NACOS_SERVER: ${NACOS_SERVER}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WHALE_TWIN_IOT_BASE_URL: "http://bw-iot:8088"
      WHALE_TWIN_ASSISTANT_BASE_URL: "http://bw-assistant:8087"
      WHALE_TWIN_NOTIFY_MESSAGE_BASE_URL: "http://bw-message:8094"
      # 接收人检索走 auth 内网通讯录；可用环境变量覆盖（联调时指向桩服务）
      WHALE_TWIN_NOTIFY_AUTH_BASE_URL: "${WHALE_TWIN_NOTIFY_AUTH_BASE_URL:-http://bw-auth:8081}"
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8089/actuator/health || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s

volumes:
  auth-joblogs:
    name: bw-auth-joblogs
  oa-joblogs:
    name: bw-oa-joblogs
  crm-joblogs:
    name: bw-crm-joblogs
  doc-joblogs:
    name: bw-doc-joblogs
  video-joblogs:
    name: bw-video-joblogs
  music-joblogs:
    name: bw-music-joblogs
  archive-joblogs:
    name: bw-archive-joblogs
  audit-joblogs:
    name: bw-audit-joblogs
  lms-joblogs:
    name: bw-lms-joblogs
  party-joblogs:
    name: bw-party-joblogs
  pdm-joblogs:
    name: bw-pdm-joblogs
  # Lucene 全文索引落盘：容器重建不丢，重建索引需全量重同步邮件
  mail-index:
    name: bw-mail-index

networks:
  bw-net:
    external: true
    name: bluewhale-dev_bw-net
