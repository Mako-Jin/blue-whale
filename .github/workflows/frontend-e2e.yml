# ============================================================
# 蓝鲸 E2E 回归（T-08）：Playwright 全链路实跑
# 中间件复用 infrastructure/docker compose（mysql/redis/nacos），
# 后端起 gateway/auth/workflow/form 4 服务，webServer 拉起 3 个前端应用。
# 触发: push main / PR main（前后端/编排变更）+ 手动
# 首跑引导：本文件首次入库的 push 不触发自身，追加注释行后推送触发（2026-11-02）
# ============================================================

name: E2E (Playwright)

on:
  push:
    branches: [main]
    paths:
      - 'whale-frontend/**'
      - 'whale-backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'whale-frontend/**'
      - 'whale-backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

# CI 专用固定口令（仅 runner 内临时中间件，非敏感；不入库不外发）
env:
  CI_MYSQL_ROOT_PASSWORD: ci_root_pwd_e2e
  CI_MYSQL_USER: whale_user
  CI_MYSQL_PASSWORD: ci_user_pwd_e2e
  CI_REDIS_PASSWORD: ci_redis_pwd_e2e
  CI_ADMIN_INIT_PASSWORD: E2eAdmin#CIPass2026

jobs:
  e2e:
    name: compose 中间件 + 4 后端服务 + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 中间件栈（复用已验证的 compose 编排） ----------
      # 注意：docker compose 会对整个 compose 文件做变量插值，即使只 up 三个服务，
      # 其它服务的 ${VAR:?...} 缺值也会直接报错退出。故 .env 必须覆盖全部必填变量
      # （MYSQL_PASSWORD / NACOS_AUTH_TOKEN / RABBITMQ_* / GRAFANA_* / EMQX_DASHBOARD_PASSWORD）。
      - name: Write compose .env
        working-directory: infrastructure/docker
        run: |
          cat > .env <<'EOF'
          MYSQL_HOST_PORT=3306
          REDIS_HOST_PORT=6379
          NACOS_HOST_PORT=8848
          NACOS_GRPC_HOST_PORT=9848
          MYSQL_ROOT_PASSWORD=${{ env.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_USER=${{ env.CI_MYSQL_USER }}
          MYSQL_PASSWORD=${{ env.CI_MYSQL_PASSWORD }}
          REDIS_PASSWORD=${{ env.CI_REDIS_PASSWORD }}
          NACOS_AUTH_IDENTITY_KEY=serverIdentity
          NACOS_AUTH_IDENTITY_VALUE=ci-identity
          NACOS_AUTH_TOKEN=Y2ktZW9lLXRva2EtYmFzZTY0LTMyLWJ5dGVzLWZvci1uYWNvcy1qd3QtMDEyMzQ1Njc4OQ==
          NACOS_USERNAME=nacos
          NACOS_PASSWORD=nacos
          RABBITMQ_USERNAME=ci_mq
          RABBITMQ_PASSWORD=ci_mq_pwd
          GRAFANA_ADMIN_PASSWORD=ci_grafana_pwd
          EMQX_DASHBOARD_PASSWORD=ci_emqx_pwd
          SW_PROFILES_ACTIVE=dev
          TZ=Asia/Shanghai
          EOF

      - name: Start middleware (mysql/redis/nacos)
        working-directory: infrastructure/docker
        run: docker compose up -d --wait mysql redis nacos

      # Nacos v3 全新实例需先初始化内置管理员（auth_admin_request=true 引导流程）。
      # healthy 判定早于 auth 插件就绪，首跑 run#9 曾偶发 "User not found!" 被静默吞掉，
      # 导致 4 个后端服务 Nacos 登录全部失败——故以 code:0 为准重试，并用 v1 登录兜底校验。
      - name: Init Nacos v3 admin
        run: |
          ok=0
          for i in $(seq 1 30); do
            resp=$(docker exec bw-nacos curl -s -X POST 'http://127.0.0.1:8080/v3/auth/user/admin' \
              --data-raw 'username=nacos' --data-raw 'password=nacos' || true)
            echo "admin init attempt $i: $resp"
            if echo "$resp" | grep -q '"code":0'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo '::error::nacos v3 admin init failed'; exit 1; fi
          login_resp=$(docker exec bw-nacos curl -s -X POST 'http://127.0.0.1:8848/nacos/v1/auth/login' \
            --data-raw 'username=nacos&password=nacos')
          echo "$login_resp" | grep -q accessToken || { echo "::error::nacos v1 login failed: $login_resp"; exit 1; }

      # compose init 只建库不建表：灌 E2E 涉及的 auth/workflow/form 三库表结构 + auth 增量迁移
      - name: Init schemas
        run: |
          M="docker exec -i bw-mysql mysql -uroot -p${{ env.CI_MYSQL_ROOT_PASSWORD }} --default-character-set=utf8mb4"
          $M bluewhale_auth < whale-backend/whale-services/whale-service-auth/whale-service-auth-starter/src/main/resources/db/init.sql
          $M bluewhale_auth < whale-backend/whale-services/whale-service-auth/whale-service-auth-starter/src/main/resources/db/migration-2026-10-30-admin-random-password.sql
          $M bluewhale_workflow < whale-backend/whale-services/whale-workflow/src/main/resources/db/init.sql
          $M bluewhale_workflow < whale-backend/whale-services/whale-workflow/src/main/resources/db/migration-5.63-workflow-task-operator.sql
          $M bluewhale_form < whale-backend/whale-services/whale-form/src/main/resources/db/init.sql
          $M -e "SHOW TABLES FROM bluewhale_auth; SELECT COUNT(*) AS auth_tables FROM information_schema.tables WHERE table_schema='bluewhale_auth';"

      # ---------- 后端 4 服务 ----------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build backend jars
        run: >
          ./mvnw -B -ntp -T 1C -DskipTests package -f whale-backend/pom.xml
          -pl whale-services/whale-service-gateway,whale-services/whale-service-auth/whale-service-auth-starter,whale-services/whale-workflow,whale-services/whale-form
          -am

      - name: Start backend services
        run: |
          mkdir -p logs
          # CI 冷启动首调 /auth/me 需全量加载权限/菜单（run#11 实测 4.5s），
          # 超过网关熔断默认 3s 会误降级 503，CI 环境放宽到 10s（仅作用于 runner 内进程）
          export WHALE_GATEWAY_CIRCUIT_BREAKER_TIMEOUT_MILLIS=10000
          start_svc() {
            local name="$1" jar="$2" port="$3"
            MYSQL_USER="${{ env.CI_MYSQL_USER }}" \
            MYSQL_PASSWORD="${{ env.CI_MYSQL_PASSWORD }}" \
            SPRING_DATA_REDIS_PASSWORD="${{ env.CI_REDIS_PASSWORD }}" \
            SPRING_CLOUD_NACOS_USERNAME=nacos \
            SPRING_CLOUD_NACOS_PASSWORD=nacos \
            WHALE_AUTH_ADMIN_INIT_PASSWORD="${{ env.CI_ADMIN_INIT_PASSWORD }}" \
            nohup java -jar "$jar" > "logs/$name.out.log" 2>&1 &
            echo "started $name (expect :$port)"
          }
          start_svc gateway  whale-backend/whale-services/whale-service-gateway/target/whale-service-gateway.jar 8080
          start_svc auth     whale-backend/whale-services/whale-service-auth/whale-service-auth-starter/target/whale-service-auth.jar 8081
          start_svc workflow whale-backend/whale-services/whale-workflow/target/whale-workflow.jar 8083
          start_svc form     whale-backend/whale-services/whale-form/target/whale-form.jar 8084

      - name: Wait for backend ports
        run: |
          for port in 8080 8081 8083 8084; do
            ok=0
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then ok=1; echo "port $port up after ${i}x2s"; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "::error::backend port $port not ready"; tail -n 80 logs/*.out.log; exit 1
            fi
          done
          # 网关登录链路冒烟（种子 admin 由 WHALE_AUTH_ADMIN_INIT_PASSWORD 轮换为 CI 口令）
          # 端口开放早于 ApplicationRunner 完成口令轮换，首轮登录可能命中旧密文返回 401；
          # 故以 accessToken 出现为准重试，不能按 HTTP 状态码提前 break。
          ok=0
          for i in $(seq 1 30); do
            curl -s -o login.json -X POST http://127.0.0.1:8080/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"${{ env.CI_ADMIN_INIT_PASSWORD }}","tenantCode":"default"}' || true
            if grep -q '"accessToken"' login.json; then ok=1; echo "login smoke ok after ${i} attempts"; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo '::error::login smoke failed'; cat login.json; exit 1; fi

      # ---------- 前端 E2E ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: whale-frontend/pnpm-lock.yaml

      - name: pnpm Install
        working-directory: whale-frontend
        run: pnpm install --frozen-lockfile

      # E2E 仅 install 不产出 workspace 包 dist，vite dev 依赖预扫描会因
      # @bluewhale/* 入口缺失而失败；此处先构建全部包与应用
      - name: Build workspace packages
        working-directory: whale-frontend
        run: pnpm turbo run build

      - name: Playwright Install Chromium
        working-directory: whale-frontend/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: whale-frontend/e2e
        env:
          E2E_ADMIN_PASSWORD: ${{ env.CI_ADMIN_INIT_PASSWORD }}
        run: pnpm exec playwright test --reporter=list,html

      - name: Upload Playwright Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: whale-frontend/e2e/playwright-report/
          retention-days: 7

      - name: Upload Test Results (traces/screenshots on failure)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: whale-frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload backend logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: logs/
          retention-days: 7
