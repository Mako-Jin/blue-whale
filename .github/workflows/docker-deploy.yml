# ============================================================
# Docker 镜像构建与推送（T-CI-7：镜像扩面至全部后端服务 + 前端）
# 触发: push main（paths 过滤，避免 docs 等无关提交触发 21 个镜像 job）
#        push tag v*.*.*（发布版本，tag 推送不评估 paths 过滤）
#        workflow_dispatch（可指定 image_tag）
# 后端统一使用参数化模板 deploy/backend/sample/Dockerfile，
# 按矩阵注入 MODULE_PATH / SERVICE_PORT；前端走 deploy/frontend/Dockerfile。
# ============================================================

name: Docker Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/docker-deploy.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default: short SHA)'
        required: false
        default: ''

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Deploy Contract Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image namespace, nginx routes and prod overlay
        shell: pwsh
        run: ./scripts/ci/bw-deploy-contract-check.ps1

  backend:
    name: Backend · ${{ matrix.service }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: whale-gateway, module: whale-services/whale-gateway, port: 8080 }
          - { service: whale-service-auth, module: whale-services/whale-service-auth/whale-service-auth-starter, port: 8081 }
          - { service: whale-job, module: whale-services/whale-job, port: 8082 }
          - { service: whale-workflow, module: whale-services/whale-workflow, port: 8083 }
          - { service: whale-form, module: whale-services/whale-form, port: 8084 }
          - { service: whale-file, module: whale-services/whale-service-file/whale-service-file-web, port: 8085 }
          - { service: whale-pay, module: whale-services/whale-pay, port: 8086 }
          - { service: whale-agent, module: whale-services/whale-agent, port: 8090, assets: true }
          - { service: whale-im, module: whale-services/whale-im, port: 8091 }
          - { service: whale-archive, module: whale-services/whale-archive, port: 8093 }
          - { service: whale-message, module: whale-services/whale-message, port: 8094 }
          - { service: whale-erp, module: whale-apps/whale-erp, port: 9001 }
          - { service: whale-mes, module: whale-apps/whale-mes, port: 9002 }
          - { service: whale-pdm, module: whale-apps/whale-pdm, port: 9003 }
          - { service: whale-oa, module: whale-apps/whale-oa, port: 9004 }
          - { service: whale-pm, module: whale-apps/whale-pm, port: 9005 }
          - { service: whale-contract, module: whale-apps/whale-contract, port: 9006 }
          - { service: whale-audit, module: whale-ops/whale-audit, port: 9101 }
          - { service: whale-monitor, module: whale-ops/whale-monitor, port: 9102 }
          - { service: whale-alert, module: whale-ops/whale-alert, port: 9103 }
          - { service: whale-config, module: whale-registry/whale-config, port: 9201 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/backend/sample/Dockerfile
          push: true
          build-args: |
            MODULE_PATH=${{ matrix.module }}
            SERVICE_PORT=${{ matrix.port }}
            NEED_FACT_ASSETS=${{ matrix.assets }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=be-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=be-${{ matrix.service }}

  frontend:
    name: Frontend · ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # image：GHCR 镜像名；app：package.json 的 name（turbo --filter）；dir：frontend/ 下的应用目录
        # base：vite base 前缀（无 base 配置的应用为 /），必须与构建产物中的资源绝对路径一致
        # namespace：root=沿用 ghcr.io/<repo>/<image>（保持 admin 等既有部署引用）；
        #            frontend=ghcr.io/<repo>/frontend/<image>，仅用于与同名后端服务冲突的 8 个前端应用。
        # 不冲突的前端保留原名，避免无谓的部署引用变更；冲突项由 preflight 校验强制命名空间。
        include:
          - { image: whale-web, app: whale-admin, dir: admin, base: /, namespace: root }
          - { image: whale-platform, app: '@bluewhale/whale-platform', dir: platform-apps/whale-platform, base: /, namespace: root }
          - { image: whale-portal, app: whale-portal, dir: platform-apps/whale-portal, base: /portal, namespace: root }
          - { image: whale-ops, app: whale-ops, dir: ops, base: /, namespace: root }
          - { image: whale-agent, app: whale-agent, dir: platform-apps/whale-agent, base: /, namespace: frontend }
          - { image: whale-contract, app: whale-contract, dir: platform-apps/whale-contract, base: /contract, namespace: frontend }
          - { image: whale-erp, app: whale-erp, dir: platform-apps/whale-erp, base: /erp, namespace: frontend }
          - { image: whale-oa, app: whale-oa, dir: platform-apps/whale-oa, base: /oa, namespace: frontend }
          - { image: whale-mes, app: whale-mes, dir: platform-apps/whale-mes, base: /mes, namespace: frontend }
          - { image: whale-pdm, app: whale-pdm, dir: platform-apps/whale-pdm, base: /pdm, namespace: frontend }
          - { image: whale-pm, app: whale-pm, dir: platform-apps/whale-pm, base: /pm, namespace: frontend }
          - { image: whale-im, app: whale-im, dir: platform-apps/whale-im, base: /im, namespace: frontend }
          - { image: whale-form-designer, app: whale-form-designer, dir: platform-apps/whale-form-designer, base: /, namespace: root }
          - { image: whale-workflow-designer, app: whale-workflow-designer, dir: platform-apps/whale-workflow-designer, base: /, namespace: root }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.namespace == 'frontend' && 'frontend/' || '' }}${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/frontend/Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_DIR=${{ matrix.dir }}
            APP_BASE=${{ matrix.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fe-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=fe-${{ matrix.image }}
