# ============================================================
# Docker 镜像构建与推送（T-CI-7：镜像扩面至全部后端服务 + 前端）
# 触发: push main（paths 过滤，避免 docs 等无关提交触发镜像 job）
#        push tag v*.*.*（发布版本，全量构建）
#        workflow_dispatch（全量构建，可指定 image_tag）
# 构建范围（R8）：push 时由 changes job 按 git diff 计算，只构建变更服务；
#   tag / 手动触发、共享模块（whale-common/whale-sdk/whale-parent）或
#   deploy 模板变化时回落全量。镜像清单唯一来源 deploy/ci/images.json。
# 后端统一使用参数化模板 deploy/backend/sample/Dockerfile，
# 按矩阵注入 MODULE_PATH / SERVICE_PORT；前端走 deploy/frontend/Dockerfile。
# ============================================================

name: Docker Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'whale-backend/**'
      - 'whale-frontend/**'
      - 'deploy/**'
      - '.github/workflows/docker-deploy.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default: short SHA)'
        required: false
        default: ''

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Deploy Contract Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image namespace, nginx routes and prod overlay
        shell: pwsh
        run: ./scripts/ci/bw-deploy-contract-check.ps1

  # R8：按 git diff 计算本次需要构建的镜像；tag/手动触发或共享模块变化时全量
  changes:
    name: Changed Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      has_backend: ${{ steps.filter.outputs.has_backend }}
      has_frontend: ${{ steps.filter.outputs.has_frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed image matrix
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ALL=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$REF" == refs/tags/* ]]; then
            ALL=1
          fi
          if [ "$ALL" = "0" ] && { [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; }; then
            ALL=1
          fi
          if [ "$ALL" = "1" ]; then
            CHANGED_FILES=""
          else
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          fi
          export ALL CHANGED_FILES
          OUT=$(node scripts/ci/changed-images.mjs)
          BACKEND=$(echo "$OUT" | jq -c '.backend')
          FRONTEND=$(echo "$OUT" | jq -c '.frontend')
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "has_backend=$([ "$(echo "$BACKEND" | jq 'length')" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_frontend=$([ "$(echo "$FRONTEND" | jq 'length')" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_STEP_SUMMARY"
          echo "frontend=$FRONTEND" >> "$GITHUB_STEP_SUMMARY"

  # 镜像构建前置门禁（P1 修复）：后端测试（含覆盖率门禁）不通过则不构建、不推送镜像
  backend-tests:
    name: Backend Tests (gate)
    uses: ./.github/workflows/backend-test.yml

  backend:
    name: Backend · ${{ matrix.service }}
    needs: [preflight, backend-tests, changes]
    if: needs.changes.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.backend) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/backend/sample/Dockerfile
          push: true
          build-args: |
            MODULE_PATH=${{ matrix.module }}
            SERVICE_PORT=${{ matrix.port }}
            NEED_FACT_ASSETS=${{ matrix.assets }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=be-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=be-${{ matrix.service }}

  frontend:
    name: Frontend · ${{ matrix.image }}
    needs: [preflight, backend-tests, changes]
    if: needs.changes.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 清单见 deploy/ci/images.json（唯一来源，由 scripts/ci/changed-images.mjs 按改动过滤）
        # image：GHCR 镜像名；app：package.json 的 name（turbo --filter）；dir：whale-frontend/ 下的应用目录
        # base：vite base 前缀（无 base 配置的应用为 /），必须与构建产物中的资源绝对路径一致
        # namespace：root=沿用 ghcr.io/<repo>/<image>（保持 admin 等既有部署引用）；
        #            frontend=ghcr.io/<repo>/whale-frontend/<image>，仅用于与同名后端服务冲突的前端应用。
        include: ${{ fromJson(needs.changes.outputs.frontend) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.namespace == 'frontend' && 'whale-frontend/' || '' }}${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/frontend/Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_DIR=${{ matrix.dir }}
            APP_BASE=${{ matrix.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fe-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=fe-${{ matrix.image }}
