# ============================================================
# 蓝鲸后端 CI - Maven 构建 + 测试（P1 修复：抽为可复用工作流的调用方）
# 触发: push main / PR main
# ============================================================

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'whale-backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'whale-backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-test.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: JDK 21 · Maven
    uses: ./.github/workflows/backend-test.yml
    with:
      upload_jars: true
