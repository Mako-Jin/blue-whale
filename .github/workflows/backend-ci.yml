# ============================================================
# 蓝鲸后端 CI - Maven 构建 + 测试
# 触发: push main / PR main
# ============================================================

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: JDK 21 · Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # mvnw 已入库（P0-2）；Windows 提交不保留可执行位，Linux runner 需补 chmod
      - name: Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Maven Test
        run: ./mvnw -B -ntp test

      - name: Maven Package
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Upload JAR Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            **/target/*.jar
          retention-days: 7
