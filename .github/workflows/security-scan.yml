# ============================================================
# 蓝鲸安全扫描（P1 修复：CI 安全能力从零到一）
# - gitleaks：secrets 泄漏扫描（全量历史，push main / PR）
# - dependency-review：PR 引入的依赖漏洞/许可审查
# - CodeQL：Java + JS/TS 代码审计（每周一 03:00 UTC + workflow_dispatch）
# - trivy-fs：镜像/依赖/配置漏洞与密钥扫描（V-07，SARIF 入 Security 面板）
# - backend-dependency-check：Maven 依赖传递漏洞（OWASP，周/手动）
# ============================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets Scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4

  frontend-audit:
    name: Dependency Audit (pnpm · official registry)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 本机镜像（registry.npmmirror.com）不支持 audit 端点（B-06），CI 固定切官方 registry。
      # 首批仍仅留档（N-10）：critical 集中在 vitest/vite/esbuild 等开发期依赖，
      # 需先完成基线清理再改为阻断；阻断口径见 docs/plans/pending-issues-2026-10-27.md。
      - name: pnpm audit (json)
        continue-on-error: true
        run: pnpm audit --registry=https://registry.npmjs.org --json > pnpm-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit
          path: frontend/pnpm-audit.json
          retention-days: 30

      # N-10：运行期依赖 critical 阻断。`--prod` 排除 vitest/vite/esbuild 等开发期依赖，
      # 当前运行期基线 0 critical / 0 high，因此可安全启用；开发期告警继续留档在上一作业。
      - name: Block critical runtime vulnerabilities
        run: pnpm audit --prod --audit-level=critical --registry=https://registry.npmjs.org

  trivy-fs:
    name: Vulnerability & Secret Scan (Trivy · fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # V-07：补齐此前缺失的镜像/依赖/配置扫描能力。
      # 首批以 SARIF 上报 + 工件留档为主（exit-code=0），避免存量 CRITICAL
      # （开发期依赖）长期红号；基线清理后再将 exit-code 改为 1 作为门禁。
      - name: Trivy filesystem scan (SARIF)
        # 上游 v0.28.0 内部引用已下线的 setup-trivy@v0.2.1，Set up job 解析失败；升级至 v0.36.0
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif
          path: trivy-results.sarif
          retention-days: 30

  backend-dependency-check:
    name: Maven Dependency Check (OWASP · weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # V-07：Maven 依赖传递漏洞。首批不阻断（存量基线未知），周期留档；
      # 配置 NVD_API_KEY 可显著加速 NVD 数据同步（未配置时仍可运行但较慢）。
      - name: OWASP dependency-check
        continue-on-error: true
        run: >
          mvn -B -DskipTests
          org.owasp:dependency-check-maven:check
          -Daggregate=true
          -DfailBuildOnCVSS=11
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -Dformat=HTML,JSON

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
          retention-days: 30

  codeql:
    name: CodeQL · ${{ matrix.language }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
