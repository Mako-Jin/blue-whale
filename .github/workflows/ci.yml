# CI —— 持续集成（决策与边界见 docs/decisions/0036 / 0038）
#
# 分层原则：**能自动判定的一律自动判定；判不了的不要假装判了。**
#
#   静态层（ESLint / Stylelint / 格式 / 类型）· 单测层（前端各包 / 后端各模块）
#   · 构建层（六个应用 + 产物自检）
#   · 契约层（代码 → 契约 → 生成物，两段各逐字节核对）
#   · 后端层（Maven 构建 + 测试，两种数据源方言）
#   · 仓库自检层（nginx 配置结构 / 文档索引一致性 / 契约清单一致性 —— 都不需要前置服务）
#
# **真机层刻意不进流水线**（浏览器 + 冷启动 dev server：单跑登录、微前端、三维、
# 场景切换）。它依赖 GPU、真实浏览器与端口占用，放进必过项只会变成随机红 ——
# 那比没有 CI 更坏，因为红久了就没人看了。它继续由人跑：`scripts/verify-*.mjs`。
#
# 四个 job 各自独立：互不阻塞、失败定位清楚（哪个 job 红 = 哪一层的问题）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需要读代码。
permissions:
  contents: read

# 同一分支上新的推送会取消还在跑的旧任务（省额度，也让结果只对应最新一次）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 钩子只在开发机上提交时起作用，runner 上不装（装它会去改 core.hooksPath）。
  HUSKY: '0'
  # 不向 turbo 官方上报遥测。
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: 前端 · 静态 / 单测 / 构建 / 产物自检 / 契约生成物
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本**不在这里写**：取自 web/package.json 的 packageManager，
      # 与开发机、与 `catalog:` 同一个事实源。两处都写会漂，漂了 CI 就悄悄
      # 变成在测另一个版本。
      # 注意：仓库根**没有** package.json（前端工作区在 web/），所以必须把它指过去。
      - name: 装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: 装 Node
        uses: actions/setup-node@v7
        with:
          # 与开发机一致的 Node 22（LTS）。**不从 engines.node 推导** ——
          # `engines` 写的是下限（`>=20`），拿它当 pin 会让 runner 上悄悄换成
          # 某个未来的主版本；升 Node 应当是一次显式改动。
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile：lockfile 与 package.json / catalog 不一致时**直接失败**，
      # 而不是在 runner 上重新解析出一份没人提交过的依赖树。
      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 生成物必须与契约同步（docs/decisions/0041）。`0006` 把 schema.d.ts 入库是为了让
      # "契约改了、类型没跟"在 review 里**显形**，但"入库"本身拦不住它悄悄落后 ——
      # 契约重新导出、`gen:api` 忘跑，生成物就停在旧形状，而那正是**编译得过、用例也绿**
      # 的状态（前端消费的就是那份旧类型，前后自洽）。这里重跑一遍生成器：
      # 产物必须与入库的版本**逐字节相同**。敢比字节，是因为 `gen:api` 的确定性实测过
      # （连跑三次哈希一致），而它末尾的 `prettier --write` 正是"逐字节可达"的前提。
      #
      # `gen:api` 只吃 `docs/api/openapi.json`，不起后端、不连网；但它需要 node_modules
      # ⇒ 不属于零前置的 `guards` job，故留在这里。紧跟装依赖，契约漂了应在十几秒内报出。
      - name: 契约生成物与契约同步
        run: |
          set -e
          pnpm --filter common-api gen:api
          # 用 `git status --porcelain` 而不是 `git diff --quiet`：后者看不见"入库的文件被删、
          # 生成器又把它造回来"—— 重建出来的是**未跟踪**文件，git diff 不报它。
          # 范围取整个生成目录，因为那才是生成器声明的输出面。有输出即失败（生成器失败时
          # `set -e` 已经在上一行把它拦住了，不会走到这里）。
          changed=$(git status --porcelain -- packages/common-api/src/generated)
          if [ -n "$changed" ]; then
            echo "::error::生成物与 docs/api/openapi.json 不同步（忘了跑 gen:api？）"
            echo "$changed"
            echo "在仓库根执行：cd web && pnpm --filter common-api gen:api ，并把产物一起提交。"
            git --no-pager diff --stat -- packages/common-api/src/generated
            exit 1
          fi

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm stylelint

      # 全树格式检查。它补的是 lint-staged 的两个**结构性**盲区（写在钩子里的检查
      # 看不见整棵树）：① 钩子只处理**本次 `git add` 的文件** —— 没被碰过的文件会
      # 一直保持旧格式；② 钩子的 glob 里原本没有 `*.html` ⇒ 三个 index.html 已经
      # 静默漂移了很久（本次开闸前才发现）。详情见 docs/decisions/0037。
      - name: 格式检查
        run: pnpm format:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      # 口令进包是一类**静默**缺陷（代码读起来完全正确），只有扫产物能判。
      # 脚本自己算仓库根，与 cwd 无关；只输出计数、不打印口令本身。
      - name: 产物自检 —— 种子口令不得进包
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-bundle-secrets.mjs

  server:
    name: 后端 · 构建 / 测试 / 契约同步
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 用 `verify` 而不是 `test`：它同样跑测试，但还走完 package 与各插件的
      # 校验阶段（enforcer 的 JDK 门禁就在其中）。
      #
      # **不需要数据库服务**：默认 profile 是 h2 内存库（`application.yml` 里写着
      # "新人 / CI 不该被迫先装一个数据库"），Flyway 迁移在启动时对着空库跑一遍
      # —— 顺带验证了迁移脚本本身是可执行的。
      - name: 构建并跑测试
        run: mvn -B -ntp verify

      # 契约是不是跟上了代码（见 docs/decisions/0042）。
      #
      # 上一步的 `verify` 已经产出可执行的 jar —— 这里把它启一次（默认 h2 内存库，
      # 不需要任何服务、不需要数据库），重新导出契约，再要求与入库版本逐字节相同。
      #
      # 没有这半步，`web` job 里守的那段（生成物 ↔ 契约）会守在一个**可能已经过期的
      # 上游**上：契约旧了 → `gen:api` 照着旧契约生成 → 生成物与旧契约一致 → 照样绿。
      # 而"契约落后于代码"本身很安静：前端照着旧类型写完、编译也过，直到接线时才发现
      # 接口对不上。契约层因此是两段（代码 → 契约 → 生成物），缺一段就断在半途。
      #
      # 为什么敢比字节：导出实测稳定 —— 同一 jar 连跑两次，以及 `mvn clean` 重建后的
      # jar 再跑一次，三次所得与入库版本同为 d7dc9f0f…（2026-10-13 本机实测，见 0042）。
      - name: 契约与代码是否同步
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          if ! bash scripts/export-openapi.sh > /tmp/openapi-export.log 2>&1; then
            echo "::error::契约导出失败（应用没起来 / 产物缺失 / JDK 不对）。日志："
            cat /tmp/openapi-export.log
            exit 1
          fi
          head -n 6 /tmp/openapi-export.log
          if [ -n "$(git status --porcelain -- docs/api/openapi.json)" ]; then
            echo "::error::docs/api/openapi.json 与后端代码不同步 —— 接口改了，但没重新导出契约。"
            echo "在仓库根依次执行，并把产物与代码同一次提交："
            echo "  bash scripts/export-openapi.sh"
            echo "  cd web && pnpm --filter common-api gen:api"
            git --no-pager diff --stat -- docs/api/openapi.json
            git --no-pager diff -- docs/api/openapi.json > /tmp/openapi.diff || true
            head -60 /tmp/openapi.diff
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 真实 MySQL：h2 是"clone 下来就能跑"的默认，但它**不是**交付形态。
  #
  # 这个 job 之前不存在，代价是：MySQL 那套迁移脚本只有人记得在本机手动跑过，
  # 全套用例也从没在 h2 以外的库上执行过。第一次真跑就暴露出 5 处
  # （4 失败 + 1 错误），根因是 `REPEATABLE_READ` 快照与"审计走独立事务"撞车
  # —— 详见 docs/decisions/0038。**这类问题人不会主动想起来去测。**
  #
  # 与 `server` job 刻意分成两个而不是合成一个：合成后前一步失败会掩盖后一步，
  # 而这两个 job 想回答的是两个不同的问题（"默认路径还好吗" / "真实库上还好吗"）。
  # ---------------------------------------------------------------------------
  server-mysql:
    name: 后端 · 真实 MySQL（迁移 + 全量测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        # 与开发机同主版本（本机是 8.0.26），避免"换了个大版本"混进变量。
        image: mysql:8.0
        env:
          # 与应用默认值对齐：`application-mysql.yml` 的用户名/口令默认就是
          # root / 空（`${BW_DB_USERNAME:root}` / `${BW_DB_PASSWORD:}`），
          # 所以这里**不需要注入任何凭据**，job 里也就没有 secrets 要配。
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          # **必须有它**：容器把 3306 发布到宿主机，runner 上的连接进来时源 IP 是
          # docker 网关（如 172.17.0.1），匹配不上镜像默认建的 `root@localhost`，
          # 症状是 `Access denied for user 'root'@'172.17.0.1'`。
          MYSQL_ROOT_HOST: '%'
          # 建库（Flyway 只建表、不建库）。MySQL 8 服务端默认字符集就是
          # utf8mb4 / utf8mb4_0900_ai_ci，与 README 要求的建库语句一致。
          MYSQL_DATABASE: bluewhale
        ports:
          # 发布到 3306 = `application-mysql.yml` 里写死的地址 ⇒ 命令与本机跑的
          # 那条**逐字相同**，不需要额外覆盖数据源 URL。
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 两个 `-D...seed-*` 是**必须**给的：种子口令没有默认值（docs/decisions/0029），
      # 开了开关却不给口令，应用会**拒绝启动**。mysql profile 默认不开种子，而下面
      # 这批用例要靠一个能登录的账号（h2 下由种子提供），所以在这里显式打开。
      #
      # ⚠️ 这两个口令与 `application-h2.yml` 里的**是同一对**（那是本仓唯一的真值
      #    来源）。它们是开发/演示口令、不是秘密 —— 真正的判据是"不得让生产包带上
      #    固定口令"（0029），而这里是 CI 的一次性库。若日后要当密钥管，改成
      #    secrets 即可，命令本身不用动。
      - name: 构建并跑测试（真实 MySQL）
        run: |
          # 显式写 pipefail：`| tee` 会把管道的退出码变成 tee 的。GitHub 的 bash 默认带
          # `-eo pipefail`，但那是在 workflow 顶层 shell 没被改动的前提下 —— 少了它，
          # mvn 失败会**静默变成成功**（tee 是成功的），是典型的假绿。
          set -o pipefail
          mvn -B -ntp verify \
            -Dspring.profiles.active=mysql \
            -Dbluewhale.auth.seed-admin.enabled=true \
            -Dbluewhale.auth.seed-admin.password=Admin@12345 \
            -Dbluewhale.auth.seed-auditor.enabled=true \
            -Dbluewhale.auth.seed-auditor.password=Auditor@12345 \
            | tee /tmp/mvn-mysql.log

      # 防的是这个 job **自己退化成假绿**：少了 `--spring.profiles.active=mysql`
      # 时，默认 profile 是 h2 ⇒ 所有用例照样全绿，而这个 job 一个字节的 MySQL
      # 都没验证到。会误报的检查最终一定会被关掉，所以这里查的是**日志里的实证**，
      # 而不是"配置看起来对不对"。
      - name: 自检 —— 确认这次运行真的连了 MySQL 且种子生效
        run: |
          set -e
          fail=0
          grep -q "Database: jdbc:mysql" /tmp/mvn-mysql.log || { echo "::error::这次运行没有连 MySQL（profile 退化成 h2 了？）"; fail=1; }
          grep -q "已启用默认管理员种子数据" /tmp/mvn-mysql.log || { echo "::error::种子没有生效（-Dbluewhale.auth.seed-* 没传到位？）"; fail=1; }
          grep -q "Successfully applied" /tmp/mvn-mysql.log || { echo "::error::Flyway 没有对空库执行迁移"; fail=1; }
          exit $fail

  guards:
    name: 仓库自检 · 无前置条件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 这几条**不需要任何服务**：不起后端、不起 dev server、不装浏览器。
      # 它们查的都是"配置或文档与实际不一致"，而这类错在本地几乎不会主动去查。
      - name: 网关配置结构自检
        run: node scripts/verify-nginx-config.mjs

      - name: 文档索引一致性
        run: node scripts/verify-docs-index.mjs

      # 契约清单（docs/api/README.md §一）与 docs/api/openapi.json 逐条比对。
      # 它读的是**入库的文件**，所以能跑在零前置的 job 里 —— 但也因此，
      # 后端接口改了却忘了重新导出契约时它不会红（那要跑一遍后端才能发现，
      # 属于 scripts/export-openapi.sh 那条流程的责任）。它守的是"契约与文档不一致"。
      - name: 契约清单一致性
        run: node scripts/verify-api-contract.mjs

      # 错误码的"有没有落点"：两个枚举里的每个码，要么有代码会抛它，
      # 要么在脚本的 UNUSED 里写明理由（有意不用 / 登记了但功能没做）。
      # 同样零前置：只读 src/main 的源码文本，不编译、不连网、不写文件。
      - name: 错误码落点自检
        run: node scripts/verify-result-codes.mjs

      # 判重与唯一索引对账（docs/decisions/0063）：服务层挡重名的每一列，
      # 要么库上有 UNIQUE 索引兜底，要么在脚本白名单里写明"业务规则级唯一"的理由。
      # 同时守三方言唯一索引集合的同构（0038 此前没人守）。同样零前置。
      - name: 判重与唯一索引对账
        run: node scripts/verify-unique-columns.mjs

      # 搜索关键词的转义（docs/decisions/0067）：`server/` 里每一处 `LIKE` 都必须经过
      # `KeywordLike`（`%` / `_` / 转义符各加一个 `ESCAPE '!'` 前缀），不许再有裸的
      # `like(...)` —— 那种写法读起来正常、测试也不会红，只有"输 % 列出全表"会露出来。
      # 顺带守"写了 LIKE 却忘了 ESCAPE"。同样零前置（只读源码文本）。
      - name: 搜索关键词转义自检
        run: node scripts/verify-like-escaping.mjs

      # 过滤值的规范化（docs/decisions/0069）：精确匹配（`eq`）的过滤值必须经过
      # `FilterValue.text()`，不许再写 `.eq(hasText(...), ...)` 或内联的 `query.getX().isBlank()`
      # —— 那种写法读起来正常，只有"从别处粘贴过来带了个空格"会露出来。
      # 顺带守"手写聚合 SQL 收到的是原始值"：那会让它与同请求的列表对同一个参数
      # 给出不同判定（症状是同一个响应里"总数 3、各级别之和 0"）。同样零前置。
      - name: 过滤值规范化自检
        run: node scripts/verify-filter-values.mjs
