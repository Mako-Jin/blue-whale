# ============================================================
# 蓝鲸前端 CI - pnpm install + turbo build + lint
# 触发: push main / PR main
# ============================================================

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'whale-frontend/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'whale-frontend/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Node 24 · pnpm
    runs-on: ubuntu-latest

    # 前端工作区根目录为 whale-frontend/（根目录无 package.json / pnpm-workspace.yaml）
    defaults:
      run:
        working-directory: whale-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: whale-frontend/pnpm-lock.yaml

      - name: pnpm Install
        run: pnpm install --frozen-lockfile

      - name: pnpm Lint
        run: pnpm -r lint
        continue-on-error: false

      - name: pnpm Build (turbo)
        run: pnpm turbo run build

      # 单元测试（P0-3 修复）：vitest 用例进 CI 门禁；
      # e2e（Playwright）依赖后端就绪，暂维持本地 `pnpm e2e` 手动触发
      - name: pnpm Test (turbo)
        run: pnpm turbo run test

      - name: Upload Build Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            **/dist/
          retention-days: 7
