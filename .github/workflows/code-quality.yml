# ============================================================
# 蓝鲸代码质量门禁 - Checkstyle（后端）+ ESLint / Prettier（前端）
# 对应需求 REQ-QA-001 / REQ-QA-002 / REQ-CICD-001
# 规则集: config/checkstyle/whale-checkstyle.xml
# 策略: 阻断门禁——error 级违规（结构/命名/复杂度/Javadoc）直接失败；
#       MagicNumber 仍为 info 级，仅提示不阻断。
# 运行: GitHub Actions（Mako-Jin/blue-whale-platform），push/PR 到 main 且命中 paths 时触发。
# ============================================================

name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'config/checkstyle/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'config/checkstyle/**'
      - '.github/workflows/code-quality.yml'

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checkstyle:
    name: Backend · Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Wrapper Setup
        run: |
          if [ ! -f mvnw ]; then
            mvn -N wrapper:wrapper -Dmaven=3.9.9
          fi
          chmod +x mvnw

      # checkstyle:check 已绑定到 validate 阶段（whale-parent），不解析模块依赖，
      # 因此在未构建过模块的干净仓库上也能直接执行；报告输出到各模块 target/checkstyle-result.xml
      - name: Checkstyle Gate
        run: ./mvnw -B -ntp validate

      - name: Upload Checkstyle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: '**/target/checkstyle-result.xml'
          retention-days: 7

  frontend-lint:
    name: Frontend · ESLint + Prettier
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: pnpm Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier Check
        run: pnpm format:check
