# ============================================================
# 蓝鲸代码质量门禁 - Checkstyle（后端）+ ESLint / Prettier（前端）
# 对应需求 REQ-QA-001 / REQ-QA-002 / REQ-CICD-001
# 规则集: config/checkstyle/whale-checkstyle.xml
# 策略: 阻断门禁——error 级违规（结构/命名/复杂度/Javadoc）直接失败；
#       MagicNumber 仍为 info 级，仅提示不阻断。
# 运行: GitHub Actions（Mako-Jin/blue-whale-platform），push/PR 到 main 且命中 paths 时触发。
# ============================================================

name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - 'whale-backend/**'
      - 'whale-frontend/**'
      - 'ai/**'
      - 'scripts/**'
      - 'config/checkstyle/**'
      - '.github/workflows/**'
      - '.workflow/**'
  pull_request:
    branches: [main]
    paths:
      - 'whale-backend/**'
      - 'whale-frontend/**'
      - 'ai/**'
      - 'scripts/**'
      - 'config/checkstyle/**'
      - '.github/workflows/**'
      - '.workflow/**'

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checkstyle:
    name: Backend · Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # mvnw 已入库（P0-2）；Windows 提交不保留可执行位，Linux runner 需补 chmod
      - name: Maven Wrapper Executable
        run: chmod +x mvnw

      # checkstyle:check 已绑定到 validate 阶段（whale-parent），不解析模块依赖，
      # 因此在未构建过模块的干净仓库上也能直接执行；报告输出到各模块 target/checkstyle-result.xml
      # 根聚合 POM 已移除（2026-11-10，ec20f819），必须 -f whale-backend/pom.xml。
      - name: Checkstyle Gate
        run: ./mvnw -B -ntp -f whale-backend/pom.xml validate

      - name: Upload Checkstyle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: '**/target/checkstyle-result.xml'
          retention-days: 7

  frontend-lint:
    name: Frontend · ESLint + Prettier
    runs-on: ubuntu-latest

    defaults:
      run:
        # 2026-11-10 目录重命名：frontend/ → whale-frontend/（旧路径 checkout 后不存在，作业直接失败）
        working-directory: whale-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: pnpm Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier Check
        run: pnpm format:check

  permission-id-ranges:
    name: Backend · 权限/菜单号段
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 权限号段是手写 ID + 幂等 INSERT，撞号不会报错：后执行的那份被
      # `WHERE id = ? OR perm_code = ?` 整条跳过，权限点静默缺失（接口一路 403），
      # 建表与单测全绿。此步把「撞号」变成阻断门禁。
      # 只有 ERROR（同 ID 被不同编码争用）会失败；WARN 仅打印（历史脚本的存量编号）。
      - name: Permission & Menu ID Range Scan
        run: python3 scripts/security/scan-id-ranges.py

  role-coverage:
    name: Backend · 角色码覆盖
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 角色码是纯字符串判定，没有任何编译期约束。2026-11-11 实测库里 55 个角色中
      # tenant_admin **一条都没有**，而 20+ 份迁移脚本的授权段都写成
      # `role_code IN ('tenant_admin')`、5 个服务的 Actor 又用它判定全量数据范围 ——
      # 授权整段静默不生效、运营动作对非超管永久不可用，而建表/单测/其余门禁全绿。
      # 此步核对「代码判定的角色码」是否都有迁移脚本 INSERT INTO sys_role 播种过。
      - name: Role Code Coverage Scan
        run: python3 scripts/security/check-role-coverage.py

  internal-boundary:
    name: Backend · 内网端点边界
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 内网端点靠三层叠加：网关 /*/internal/**、服务侧 X-Internal-Token、
      # auth 的 Spring Security 白名单。任一层漏配都不会编译报错、单测也全绿，
      # 只在真实联调时表现为「401/空数据」——2026-11-10 的 /dept/internal/** 漏配
      # 就静默存在了数月。此步把三层的口径对齐，顺带校验 CI 里的 working-directory
      # 指向的目录仍然存在（目录重命名后残留旧路径会让作业在 checkout 后直接失败）。
      - name: Internal Boundary & CI Workdir Scan
        run: python3 scripts/check-internal-boundary.py

  frontend-perm-mapping:
    name: Frontend · 菜单/权限码映射
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 前端菜单与按钮级权限由后端数据驱动，但没有编译期约束：
      # sys_menu.component 配错只渲染「页面未配置」占位、权限码写错按钮永不渲染，
      # 两者都是静默失败。此步核对「菜单种子 ↔ admin 契约键/基座子应用前缀」与
      # 「前端引用的权限码 ↔ 后端种子（sys_permission/sys_menu/@RequirePermission）」。
      - name: Frontend Permission Mapping Scan
        run: python3 scripts/check-frontend-perm-mapping.py

  qiankun-lifecycle:
    name: Frontend · 子应用 qiankun 接入
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 子应用用 vite-plugin-qiankun 插件，产物 index.html 由插件注入的脚本从
      # window.moudleQiankunAppLifeCycles[name] 取生命周期。只导出 mount/unmount 而漏调
      # renderWithQiankun 时该表为空，基座 mount 的 Promise 永不 resolve —— 白屏且无报错，
      # 20 个子应用里曾有 14 个如此。此步校验生命周期注册 + vite base 与 activeRule 对齐。
      - name: Qiankun Lifecycle & Base Scan
        run: python3 scripts/check-qiankun-lifecycle.py

  reauth-wiring:
    name: Frontend · 二次认证接线
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 危险端点（删用户/重置口令/改状态/分配角色）标了 @RequireReauth，缺 step-up 凭证
      # 时后端返回 HTTP 428 + 42801。共享 http 只有在创建客户端时传了 onReauthRequired
      # 才会弹窗验密并带 X-Reauth-Token 重放一次；没传就把 42801 原样抛给业务层——
      # 用户只看到「需要二次认证」，重试多少次都不可能成功，现场没有任何线索。
      - name: Reauth Wiring Scan
        run: python3 scripts/check-reauth-wiring.py

  api-path-drift:
    name: Full-stack · 接口路径漂移
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 网关只转发、不剥离前缀（REQ-ARCH-003），前端写的路径必须与后端
      # @RequestMapping + @XxxMapping 拼出来的完整路径一致。两边任何一侧改了路径，
      # 编译和启动都不报错，只在用户点下去那一刻 404/405。
      # 已因此踩过三次：/auth/refresh 漂移、/auth/v1/user-config 恒 404、
      # /party/union/welfare/welfare/... 重复段。同时覆盖「路径存在但方法不对」（405）。
      - name: API Path Drift Scan
        run: python3 scripts/check-api-path-drift.py

  long-id-typing:
    name: Full-stack · 雪花 ID 前端类型
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 后端雪花 ID 是 Long，前端 number 只有 53 位安全整数：超过 2^53 静默丢精度，
      # 不报错、不告警，只是查不到/改错对象。全站口径是 Long 一律 string。
      # 本门禁拿各应用已生成的 openapi 契约反向校准手写 api 层：契约里是 string 的
      # 复合 ID 字段（userId/tenantId/entityId…）不得被改回 number（含 number | string）。
      - name: Long ID Typing Scan
        run: python3 scripts/check-long-id-typing.py

  ai-pytest:
    name: AI · Python 3.12 + pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai/whale-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 固化 3.12，避免 runner 默认解释器漂移（本机曾出现 3.15 误用）
      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync Dependencies (locked)
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run --python 3.12 pytest

      # 静态检查门禁（T-17）：ruff 仅启用语法/未定义名类规则（E4/E7/E9/F）；
      # mypy 已由基线验证转为阻断（本机 mypy 2.4.1 全量 0 错误），版本固定避免
      # `uvx mypy` 漂移引入新的类型错误。
      - name: ruff
        run: uvx ruff check .

      - name: mypy
        run: uvx --from mypy==2.4.1 mypy whale_ai --ignore-missing-imports --no-error-summary
