# ============================================================
# 蓝鲸后端测试（可复用工作流）
# 被 backend-ci.yml（日常门禁）与 docker-deploy.yml（镜像构建前置门禁）调用，
# 保证"测试不通过不推镜像"（P1 修复）。
# ============================================================

name: Backend Test

on:
  workflow_call:
    inputs:
      upload_jars:
        description: 'Upload backend JARs as artifact (main push only)'
        required: false
        type: boolean
        default: false

jobs:
  test-and-build:
    name: JDK 21 · Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # mvnw 已入库（P0-2）；Windows 提交不保留可执行位，Linux runner 需补 chmod
      - name: Maven Wrapper Executable
        run: chmod +x mvnw

      # .mvn/jvm.config 用相对路径 -Djava.io.tmpdir=tmp（Windows 绝对路径在 Linux 上会被
      # 按转义拆词，导致 "Could not find or load main class mp"）。runner 上该目录不入库，须先建。
      - name: Prepare JVM Temp Directory
        run: mkdir -p tmp

      # verify 完成单测、覆盖率报告（jacoco:report 绑 test 阶段）与打包。
      # 覆盖率门禁不再用 -Pcoverage-gate 的 BUNDLE 规则（对 69 模块逐模块卡 40%/30%，
      # 第 2 个模块 whale-common-core 就不可达，反而挡住后续全部模块的测试信号），
      # 改由 scripts/ci/check-coverage.py 按【项目聚合 + 单模块基线棘轮】判定。
      # 根聚合 POM 已于 2026-11-10 移除（ec20f819），构建入口统一为 whale-backend/pom.xml，
      # 故必须显式 -f；直接在根跑 ./mvnw 会报「no POM in this directory」。
      - name: Maven Verify
        run: ./mvnw -B -ntp -f whale-backend/pom.xml verify

      - name: Coverage Gate
        run: python scripts/ci/check-coverage.py

      # 诊断产物不是质量门禁：artifact 存储配额耗尽（"Artifact storage quota has been hit"）
      # 不应把整条流水线判红，否则真失败会被噪音淹没。
      - name: Upload JaCoCo Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          retention-days: 7

      - name: Upload JAR Artifact
        if: inputs.upload_jars && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            **/target/*.jar
          retention-days: 7
