# ============================================================
# 蓝鲸后端测试（可复用工作流）
# 被 backend-ci.yml（日常门禁）与 docker-deploy.yml（镜像构建前置门禁）调用，
# 保证"测试不通过不推镜像"（P1 修复）。
# ============================================================

name: Backend Test

on:
  workflow_call:
    inputs:
      upload_jars:
        description: 'Upload backend JARs as artifact (main push only)'
        required: false
        type: boolean
        default: false

jobs:
  test-and-build:
    name: JDK 21 · Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # mvnw 已入库（P0-2）；Windows 提交不保留可执行位，Linux runner 需补 chmod
      - name: Maven Wrapper Executable
        run: chmod +x mvnw

      # coverage-gate profile：行 ≥ 40% / 分支 ≥ 30%（whale-parent），
      # verify 同时完成单测、覆盖率报告与打包，未达阈值直接失败（REQ-CICD-001）。
      - name: Maven Verify + Coverage Gate
        run: ./mvnw -B -ntp -Pcoverage-gate verify

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          retention-days: 7

      - name: Upload JAR Artifact
        if: inputs.upload_jars && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            **/target/*.jar
          retention-days: 7
