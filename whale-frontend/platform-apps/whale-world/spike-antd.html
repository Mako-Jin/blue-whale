<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T0.5 · antd 页面挂入 CSS3D</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1016; }
      body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; z-index: 0; }
      #stage canvas { display: block; }
      #css3d-root { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }

      .sheet {
        width: 940px;
        background: #ffffff;
        border: 1px solid #c9b98f;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
        color: #1f1a12;
      }

      /* 自动化截图时虚拟时间会让 rc-motion 动画卡在起始帧（opacity 0），
         弹层看起来"不存在"。验证场景一律关掉动画，真实运行时不必这样。 */
      .ant-select-dropdown,
      .ant-select-dropdown * ,
      [class*="ant-zoom"],
      [class*="ant-slide"] {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        transition: none !important;
      }
      /* rc-motion 卡在 appear-start 时 class 里写死 opacity:0，光禁动画不够 */
      .ant-select-dropdown { opacity: 1 !important; }

      #hud {
        position: fixed; left: 20px; top: 20px; z-index: 20;
        padding: 14px 18px;
        background: rgba(8, 14, 20, 0.85);
        border: 1px solid rgba(120, 190, 230, 0.35);
        color: #cfe6f5; font-size: 13px; line-height: 1.9;
        backdrop-filter: blur(6px);
      }
      #hud h1 { font-size: 14px; letter-spacing: 1px; color: #9dc8e0; margin-bottom: 8px; font-weight: 600; }
      #hud .k { color: #7fa8c4; display: inline-block; width: 104px; }
      #hud .v { color: #eaf6ff; }
      #hud .ok { color: #6ee7a8; }
      #hud .bad { color: #ff8d8d; }
      #hud .tip { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(120,190,230,0.2); color: #6f8fa6; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="css3d-root"></div>

    <div id="hud">
      <h1>T0.5 · antd 挂入 CSS3D</h1>
      <div><span class="k">弹层容器</span><span class="v" id="hud-popup">--</span></div>
      <div><span class="k">下拉位置</span><span class="v" id="hud-pos">--</span></div>
      <div><span class="k">判定</span><span class="v" id="hud-verdict">--</span></div>
      <div class="tip">?fix=1 启用 getPopupContainer（弹层留在面板内）</div>
    </div>

    <script type="module" src="/src/spike/antd-in-css3d.tsx"></script>
  </body>
</html>
