# ============================================================
# 蓝鲸系统 - 开发环境 Docker Compose
# 使用方式: docker compose up -d
# ============================================================

name: bluewhale-dev

services:
  # ----------------------------------------------------------
  # MySQL 8.4
  # ----------------------------------------------------------
  mysql:
    build:
      context: ./mysql
    container_name: bw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: whale_auth
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Redis 7 (Alpine)
  # ----------------------------------------------------------
  redis:
    build:
      context: ./redis
    container_name: bw-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Nacos 2.3.2 (单机模式)
  # ----------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: bw-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - bw-net

  # ----------------------------------------------------------
  # RabbitMQ 3 (Management, 可选)
  # ----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bw-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Nginx 网关 (反向代理 + 静态资源)
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./nginx
    container_name: bw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - bw_frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - mysql
      - redis
    networks:
      - bw-net

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  rabbitmq_data:
  bw_frontend_dist:

networks:
  bw-net:
    driver: bridge
