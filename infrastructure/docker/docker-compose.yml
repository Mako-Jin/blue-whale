# ============================================================
# 蓝鲸系统 - 开发环境 Docker Compose
# 使用方式:
#   cp .env.example .env && 按需修改
#   docker compose up -d
# 宿主机端口被本地实例占用时, 可在 .env 中改 *_HOST_PORT
# ============================================================

name: bluewhale-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------
  # MySQL 8.4
  # ----------------------------------------------------------
  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_BASE_IMAGE: ${MYSQL_BASE_IMAGE:-mysql:8.4}
    container_name: bw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bluewhale_auth
      MYSQL_USER: ${MYSQL_USER:-whale_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Redis 7 (Alpine)
  # ----------------------------------------------------------
  redis:
    build:
      context: ./redis
      args:
        REDIS_BASE_IMAGE: ${REDIS_BASE_IMAGE:-redis:7-alpine}
    container_name: bw-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # requirepass 由环境变量注入, 不落仓
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Nacos 2.4.0 (单机模式, 内置存储)
  # ----------------------------------------------------------
  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v2.4.0}
    container_name: bw-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      JVM_XMS: 512m
      JVM_XMX: 1024m
      JVM_XMN: 256m
    ports:
      - "${NACOS_HOST_PORT:-8848}:8848"
      - "${NACOS_GRPC_HOST_PORT:-9848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      # Nacos 2.4 未暴露 liveness 子路径，使用标准 health 端点
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # RabbitMQ 4 (Management, 审计 MQ 汇聚)
  # ----------------------------------------------------------
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    container_name: bw-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Prometheus 指标抓取（REQ-ARCH-007）
  # 后端服务跑在宿主机，抓取 targets 统一使用 host.docker.internal
  # ----------------------------------------------------------
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: bw-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Alertmanager 告警路由（webhook → 宿主机 whale-alert 9103）
  # ----------------------------------------------------------
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}
    container_name: bw-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ../prometheus/alertmanager-docker.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Grafana 可视化（数据源经 provisioning 指向 prometheus）
  # ----------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: bw-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../prometheus/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Nginx 网关 (反向代理 + 静态资源 + HTTPS)
  # 注意: 后端服务默认运行在宿主机, upstream 指向 host.docker.internal
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      args:
        # 国内网络可将 .env 中 NGINX_BASE_IMAGE 指向镜像站
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:alpine}
    container_name: bw-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - bw_frontend_dist:/usr/share/nginx/html:ro
    extra_hosts:
      # Linux 下访问宿主机网关需要显式映射
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *default-logging
    networks:
      - bw-net

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  rabbitmq_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  bw_frontend_dist:

networks:
  bw-net:
    driver: bridge
