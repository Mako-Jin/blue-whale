# ============================================================
# 蓝鲸系统 - 开发环境 Docker Compose
# 使用方式:
#   cp .env.example .env && 按需修改
#   docker compose up -d
# 宿主机端口被本地实例占用时, 可在 .env 中改 *_HOST_PORT
# ============================================================

name: bluewhale-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------
  # MySQL 8.4
  # ----------------------------------------------------------
  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_BASE_IMAGE: ${MYSQL_BASE_IMAGE:-mysql:8.4}
    container_name: bw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bluewhale_auth
      MYSQL_USER: ${MYSQL_USER:-whale_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Redis 7 (Alpine)
  # ----------------------------------------------------------
  redis:
    build:
      context: ./redis
      args:
        REDIS_BASE_IMAGE: ${REDIS_BASE_IMAGE:-redis:7-alpine}
    container_name: bw-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # 本机开发：gateway/auth 的 application.yml 仅配了 REDIS_HOST/PORT，未支持密码，
    # 因此容器不启用 requirepass。若后续服务端补上 REDIS_PASSWORD 支持，再改回带密码启动。
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Nacos 3.2.4 (单机模式, 内置存储; 控制台独立 8080 未映射)
  # ----------------------------------------------------------
  # Nacos 3.x（服务发现 + 配置中心）
  #
  # 存储用宿主机 MySQL 的 bluewhale_nacos 库 —— 与「宿主机 tools/nacos」是同一份数据，
  # 两种起法可互换但**不能同时占 8848**：
  #   - 容器：docker compose up -d nacos（推荐，随 Docker 自启，无需手工跑 startup.cmd）
  #   - 宿主机：tools/nacos/bin/startup.cmd -m standalone（preflight 起不来时的退路）
  # tools/nacos/conf/application.properties 里 spring.sql.init.platform=mysql 且
  # db.url.0 指向 bluewhale_nacos，证明数据本就在 MySQL，容器版只是换了进程载体。
  # ----------------------------------------------------------
  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v3.2.4}
    container_name: bw-nacos
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
      # 认证：宿主机 Nacos 的 conf 里 nacos.core.auth.enabled=false，服务侧只传 NACOS_SERVER
      # 不带用户名口令。此处必须保持一致，否则服务注册 403 → 重启死循环。
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      # 外置 MySQL（bluewhale_nacos）
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${NACOS_DB_HOST:-host.docker.internal}
      MYSQL_SERVICE_PORT: ${MYSQL_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-bluewhale_nacos}
      MYSQL_SERVICE_USER: ${NACOS_DB_USER:-root}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:-}
      # allowPublicKeyRetrieval 必需：MySQL 8 的 caching_sha2_password 走非 SSL 连接
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=3000&socketTimeout=5000&autoReconnect=true&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      # 堆压到 256/512：8G VM 里要和 22 个 Spring 服务共存，1G 堆会把余量吃到红线以下
      # （实测 1G 堆 RSS 约 700MB，等效于多塞一个核心服务）。本机只做注册中心 + 配置中心，
      # 512 上限足够；Nacos 服务端不做业务计算。
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:${NACOS_HOST_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_HOST_PORT:-9848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      # Nacos 3.x：服务面 8848 / gRPC 9848 不变，控制台独立 8080（compose 不映射，实机部署时使用）；
      # v3 服务端口不暴露 actuator（/nacos/actuator/health 404），改为探测任意 HTTP 响应即视为存活
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8848/nacos || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # RabbitMQ 4 (Management, 审计 MQ 汇聚)
  # ----------------------------------------------------------
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    container_name: bw-rabbitmq
    restart: unless-stopped
    environment:
      # 弱口令回退已移除（安全加固）：未在 .env 配置时直接启动失败，而非以 guest/guest 上线
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?请在 .env 中配置 RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中配置 RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Prometheus 指标抓取（REQ-ARCH-007）
  # 后端服务跑在宿主机，抓取 targets 统一使用 host.docker.internal
  # ----------------------------------------------------------
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: bw-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Alertmanager 告警路由（webhook → 宿主机 whale-alert 9103）
  # ----------------------------------------------------------
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}
    container_name: bw-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ../prometheus/alertmanager-docker.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Grafana 可视化（数据源经 provisioning 指向 prometheus）
  # ----------------------------------------------------------
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: bw-grafana
    restart: unless-stopped
    environment:
      # 弱口令回退已移除（安全加固）：未在 .env 配置时直接启动失败，而非以 admin/admin 上线
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中配置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../prometheus/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../prometheus/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # EMQX 5 (MQTT Broker, IoT 设备接入；Wave 6.02)
  # 端口避让：MQTT-over-WS 宿主机映射 1884（容器内 8083/8085 号段已被后端服务占用）
  # ----------------------------------------------------------
  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.8}
    container_name: bw-emqx
    restart: unless-stopped
    environment:
      # 弱口令回退已移除（安全加固）：未在 .env 配置时直接启动失败，而非以 public/public 上线
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?请在 .env 中配置 EMQX_DASHBOARD_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${EMQX_MQTT_HOST_PORT:-1883}:1883"
      - "127.0.0.1:${EMQX_WS_HOST_PORT:-1884}:8083"
      - "127.0.0.1:${EMQX_DASHBOARD_HOST_PORT:-18083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    logging: *default-logging
    networks:
      - bw-net

  # ----------------------------------------------------------
  # Nginx 网关 (反向代理 + 静态资源 + HTTPS)
  # 注意: 后端服务默认运行在宿主机, upstream 指向 host.docker.internal
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      args:
        # 国内网络可将 .env 中 NGINX_BASE_IMAGE 指向镜像站
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:alpine}
    container_name: bw-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - bw_frontend_dist:/usr/share/nginx/html:ro
    extra_hosts:
      # Linux 下访问宿主机网关需要显式映射
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *default-logging
    networks:
      - bw-net

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  rabbitmq_data:
  emqx_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  bw_frontend_dist:

networks:
  bw-net:
    driver: bridge
