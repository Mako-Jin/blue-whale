# ============================================================
# 蓝鲸系统 - Redis 配置
# 生产环境请务必修改 requirepass
# ============================================================

# ---- 网络 ----
bind 0.0.0.0
port 6379
# requirepass 由 compose 通过 `--requirepass "$REDIS_PASSWORD"` 注入（不落仓）
# 如需直接运行本文件调试，请自行追加一行 requirepass <密码>
# 本机开发：gateway/auth 的 application.yml 只支持 REDIS_HOST/PORT，不支持密码，
# 因此容器不启 requirepass。无密码 + bind 0.0.0.0 时 protected-mode 会拒绝跨容器连接，
# 故关闭之。宿主机仅映射 127.0.0.1:6379，外部网络不可达，风险可控。
protected-mode no

# ---- 持久化 ----
# 关闭 RDB (生产可按需开启): save 900 1 ...
save ""

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 混合持久化 (Redis 4.0+)
aof-use-rdb-preamble yes

# ---- 内存 ----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- 常规 ----
daemonize no
databases 16
timeout 0
tcp-keepalive 300
loglevel notice
dir /data
pidfile /var/run/redis_6379.pid
