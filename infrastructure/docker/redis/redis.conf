# ============================================================
# 蓝鲸系统 - Redis 配置
# 生产环境请务必修改 requirepass
# ============================================================

# ---- 网络 ----
bind 0.0.0.0
port 6379
# requirepass 由 compose 通过 `--requirepass "$REDIS_PASSWORD"` 注入（不落仓）
# 如需直接运行本文件调试，请自行追加一行 requirepass <密码>
protected-mode yes

# ---- 持久化 ----
# 关闭 RDB (生产可按需开启): save 900 1 ...
save ""

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 混合持久化 (Redis 4.0+)
aof-use-rdb-preamble yes

# ---- 内存 ----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- 常规 ----
daemonize no
databases 16
timeout 0
tcp-keepalive 300
loglevel notice
dir /data
pidfile /var/run/redis_6379.pid
