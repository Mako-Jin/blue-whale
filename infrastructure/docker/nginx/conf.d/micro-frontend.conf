# ============================================================
# qiankun 微前端静态资源托管
# 主应用 + 子应用共用 SPA 路由回退
# HTTP 301 → HTTPS，HTTPS 提供静态资源与长缓存
# ============================================================

# ---- HTTP: 仅健康检查, 其余跳转 HTTPS ----
server {
    listen       80;
    listen       [::]:80;
    server_name  app.localhost app.bluewhale.local;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: 微前端 ----
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  app.localhost app.bluewhale.local;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 主应用 SPA 路由 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- qiankun 子应用前缀反代 ----
    # 约定同 bw-net 网络内的前端容器别名为 whale-fe-<app>：
    #   whale-fe-portal / whale-fe-contract / whale-fe-erp / whale-fe-oa
    #   whale-fe-mes / whale-fe-pdm / whale-fe-pm / whale-fe-im / whale-fe-doc / whale-fe-music
    # 子应用镜像自身已按 base 前缀托管产物，因此这里保留原始 URI 直传，不做 rewrite。
    # 使用变量 + Docker 内置 DNS 延迟解析：前端容器未启动时 nginx 仍可启动，
    # 对应前缀返回 502，而不是整个站点启动失败。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(?<fe_app>portal|contract|erp|oa|mes|pdm|pm|im|doc|music)(?=/|$) {
        set $fe_upstream http://whale-fe-$fe_app:80;
        proxy_pass $fe_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /$fe_app;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- 静态资源长缓存 ----
    location ~* \.(?:js|css|map|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- 图片 (较长缓存) ----
    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ---- 禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
