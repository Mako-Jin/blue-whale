# ============================================================
# qiankun 微前端静态资源托管
# 主应用 + 子应用共用 SPA 路由回退
# HTTP 301 → HTTPS，HTTPS 提供静态资源与长缓存
# ============================================================

# ---- HTTP: 仅健康检查, 其余跳转 HTTPS ----
server {
    listen       80;
    listen       [::]:80;
    server_name  app.localhost app.bluewhale.local;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: 微前端 ----
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  app.localhost app.bluewhale.local;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 主应用 SPA 路由 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- qiankun 子应用 1 (示例: 权限中心) ----
    location /sub-app/auth {
        alias /usr/share/nginx/html/sub-app/auth;
        try_files $uri $uri/ /sub-app/auth/index.html;
    }

    # ---- qiankun 子应用 2 (示例: 工作流) ----
    location /sub-app/workflow {
        alias /usr/share/nginx/html/sub-app/workflow;
        try_files $uri $uri/ /sub-app/workflow/index.html;
    }

    # ---- 静态资源长缓存 ----
    location ~* \.(?:js|css|map|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- 图片 (较长缓存) ----
    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ---- 禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
