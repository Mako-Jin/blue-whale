# ============================================================
# API 网关反向代理
# 将 /api/** 转发到后端 Gateway
# ============================================================

# 后端 Gateway 上游
upstream whale_gateway {
    server host.docker.internal:8080;
    keepalive 32;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  api.localhost api.bluewhale.local;

    client_max_body_size 100m;

    # ---- /api/** -> Gateway ----
    location /api/ {
        proxy_pass http://whale_gateway/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size       16k;
        proxy_buffers          4 64k;
        proxy_busy_buffers_size 128k;
    }

    # ---- 网关健康检查 ----
    location /actuator/health {
        proxy_pass http://whale_gateway/actuator/health;
        access_log off;
    }

    # ---- WebSocket (如聊天/实时监控) ----
    location /ws/ {
        proxy_pass http://whale_gateway/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout  3600s;
    }

    # ---- 错误透传 ----
    error_page 502 503 504 @upstream_error;

    location @upstream_error {
        default_type application/json;
        return 503 '{"code":503,"msg":"服务暂时不可用, 请稍后重试"}';
    }
}
