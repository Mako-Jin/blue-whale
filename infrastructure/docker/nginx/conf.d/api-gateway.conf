# ============================================================
# API 网关反向代理（HTTP → HTTPS 跳转 + HTTPS 上游转发）
# 将 /api/** 转发到后端 Gateway
# ============================================================

# 后端 Gateway 上游（宿主机）
upstream whale_gateway {
    server host.docker.internal:8080;
    keepalive 32;
}

# 证书路径固定为 /etc/nginx/ssl/fullchain.pem 与 privkey.pem
# 未放置证书时 443 server 将启动失败，请先执行
#   infrastructure/scripts/gen-dev-cert.ps1

# ---- HTTP: 仅保留健康检查, 其余 301 跳转 HTTPS ----
server {
    listen       80;
    listen       [::]:80;
    server_name  api.localhost api.bluewhale.local;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: 反向代理 ----
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  api.localhost api.bluewhale.local;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 100m;

    # ---- /api/** -> Gateway ----
    location /api/ {
        proxy_pass http://whale_gateway/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 超时
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size       16k;
        proxy_buffers          4 64k;
        proxy_busy_buffers_size 128k;
    }

    # ---- 网关健康检查 ----
    location = /actuator/health {
        proxy_pass http://whale_gateway/actuator/health;
        access_log off;
    }

    # ---- WebSocket (如聊天/实时监控) ----
    location /ws/ {
        proxy_pass http://whale_gateway/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout  3600s;
    }

    # ---- 错误透传 ----
    error_page 502 503 504 @upstream_error;

    location @upstream_error {
        default_type application/json;
        return 503 '{"code":503,"msg":"服务暂时不可用, 请稍后重试"}';
    }
}
