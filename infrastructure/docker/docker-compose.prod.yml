# ============================================================
# 蓝鲸系统 - 生产环境覆盖层
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 说明: 端口/密码等仍由 .env 提供, 本文件只做生产加固
# ============================================================

services:
  mysql:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nacos:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 128m

  nginx:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    volumes:
      # 生产环境挂载由宿主机证书管理器（Let's Encrypt / cert-manager）签发的真实证书
      # 覆盖开发自签证书目录; 路径按实际域名调整
      - /etc/letsencrypt/live/${TLS_SERVER_NAME}/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/${TLS_SERVER_NAME}/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  bw-net:
    driver: bridge
    internal: false
