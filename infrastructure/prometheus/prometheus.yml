# ============================================================
# 蓝鲸系统 - Prometheus 抓取配置（裸机/宿主机运行版）
# Docker 版见 prometheus-docker.yml（compose 挂载使用）
# 目标: Spring Boot Actuator /actuator/prometheus
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: bluewhale
    environment: dev

# 审计修复：启用告警通道与规则加载（原配置全部注释导致告警规则永不生效）。
# alertmanager / 规则文件按宿主机运行布局解析：
#   - Alertmanager 本机 9093（docker 版由 compose 网络内部解析 alertmanager:9093）
#   - 规则文件复用 deploy/monitoring/prometheus-rules.yml（相对本文件两上级）
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - ../../deploy/monitoring/prometheus-rules.yml

scrape_configs:
  # ---- Nacos ----
  # 注：Nacos 版本双轨（compose v2.4.0 / 本地 tools 3.2.4）指标路径可能不同，
  # 统一收敛前保持 2.x actuator 路径（devlog 2026-10-19 已列待办）
  - job_name: 'nacos'
    metrics_path: '/nacos/actuator/prometheus'
    static_configs:
      - targets: ['nacos:8848']
        labels:
          service: nacos
          namespace: infrastructure

  # ---- 蓝鲸 API Gateway ----
  - job_name: 'whale-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: whale-gateway
          namespace: bluewhale

  # ---- 蓝鲸后端服务 (示例, 按需扩展) ----
  - job_name: 'whale-services'
    metrics_path: '/actuator/prometheus'
    file_sd_configs:
      - files:
          - 'targets/*.json'
        refresh_interval: 30s

  # ---- Nginx (nginx-prometheus-exporter 需额外部署) ----
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: nginx

  # ---- RabbitMQ (rabbitmq-exporter: 队列/死信积压) ----
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
        labels:
          service: rabbitmq
          namespace: infrastructure
