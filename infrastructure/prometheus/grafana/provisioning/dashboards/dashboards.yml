# Grafana 看板自动装配（T-15）：从挂载目录加载 BlueWhale 看板
# 看板 JSON 位于 infrastructure/prometheus/grafana/dashboards/，
# 由 docker-compose 将其挂载到容器内 /var/lib/grafana/dashboards（只读）。
apiVersion: 1

providers:
  - name: BlueWhale Dashboards
    orgId: 1
    folder: BlueWhale
    folderUid: bluewhale
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
