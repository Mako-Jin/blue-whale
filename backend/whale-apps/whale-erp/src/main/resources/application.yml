server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9001}
  servlet:
    context-path: /

spring:
  application:
    name: whale-erp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_erp?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化（阶段 4 铺开），脚本位于 classpath:db/migration
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# 启用 starter 的 RequirePermissionInterceptor，按网关注入的
# X-Permission-Codes 判定 ERP 物料接口的 sys:erp:item:* 权限。
whale:
  permission:
    header:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ERP 自动记账科目映射（D5 确认后改配置即可）
erp:
  finance:
    account:
      inventory: ${ERP_ACCOUNT_INVENTORY:1405}
      payable: ${ERP_ACCOUNT_PAYABLE:2202}
      receivable: ${ERP_ACCOUNT_RECEIVABLE:1122}
      revenue: ${ERP_ACCOUNT_REVENUE:6001}
      cost: ${ERP_ACCOUNT_COST:6401}
      stock-variance: ${ERP_ACCOUNT_STOCK_VARIANCE:1901}
      production-cost: ${ERP_ACCOUNT_PRODUCTION_COST:5001}
      salary-expense: ${ERP_ACCOUNT_SALARY_EXPENSE:6602}
      salary-payable: ${ERP_ACCOUNT_SALARY_PAYABLE:2211}
      bank-deposit: ${ERP_ACCOUNT_BANK_DEPOSIT:1002}
      tax-payable: ${ERP_ACCOUNT_TAX_PAYABLE:2221}
      other-payable: ${ERP_ACCOUNT_OTHER_PAYABLE:2241}
  hr:
    payroll:
      social-insurance-rate: ${ERP_HR_SOCIAL_INSURANCE_RATE:0.105}
      housing-fund-rate: ${ERP_HR_HOUSING_FUND_RATE:0.07}
      tax-threshold: ${ERP_HR_TAX_THRESHOLD:5000}
      overtime-multiplier: ${ERP_HR_OVERTIME_MULTIPLIER:1.5}
      monthly-work-days: ${ERP_HR_MONTHLY_WORK_DAYS:21.75}
      daily-hours: ${ERP_HR_DAILY_HOURS:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
