server:
  # 网关注入的 X-Permission-Codes 随权限数量增长，Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9010}
  servlet:
    context-path: /

spring:
  application:
    name: whale-mall
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_mall?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

whale:
  permission:
    header:
      enabled: true
  mall:
    # 下单幂等键缺失时是否拒绝（生产必须开启，关闭只用于本地压测）
    idempotency-required: ${WHALE_MALL_IDEMPOTENCY_REQUIRED:true}
    # 购物车单 SKU 最大数量
    cart-max-quantity: ${WHALE_MALL_CART_MAX_QUANTITY:999}
    # 单笔订单最大 SKU 行数
    order-max-lines: ${WHALE_MALL_ORDER_MAX_LINES:50}
    # 待支付订单自动关闭时长（分钟，0 表示不自动关闭；自动关闭在 M1 由 whale-job 触发）
    order-expire-minutes: ${WHALE_MALL_ORDER_EXPIRE_MINUTES:30}
    # 列表分页上限
    page-limit: ${WHALE_MALL_PAGE_LIMIT:100}
    # 支付/退款成功回调地址（<服务名>/<路径>，创建支付单时传给 whale-pay）
    pay-notify-url: ${WHALE_MALL_PAY_NOTIFY_URL:whale-mall/mall/internal/order/paid}
    # whale-pay 内网客户端（服务间直连，不经网关）
    pay:
      service-name: ${WHALE_MALL_PAY_SERVICE_NAME:whale-pay}
      # 配置了 base-url 则跳过服务发现直连（本机联调用）
      # base-url: http://127.0.0.1:8086
      timeout-seconds: ${WHALE_MALL_PAY_TIMEOUT_SECONDS:3}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
