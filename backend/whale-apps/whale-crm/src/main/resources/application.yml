server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9007}
  servlet:
    context-path: /

spring:
  application:
    name: whale-crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_crm?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 版本化建表（门禁通过后直接追加 V2 业务索引，不重建库）
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

whale:
  permission:
    header:
      enabled: true
  crm:
    # 需求门禁（D2）已通过（Wave 5.83）；置为 false 可一键回退到仅 /crm/meta 的维护态
    demand-gate-passed: ${WHALE_CRM_DEMAND_GATE_PASSED:true}
    customer-code-prefix: ${WHALE_CRM_CUSTOMER_CODE_PREFIX:CUS}
    follow-up-page-limit: ${WHALE_CRM_FOLLOW_UP_PAGE_LIMIT:100}
    contract-reference-enabled: ${WHALE_CRM_CONTRACT_REFERENCE_ENABLED:false}
    default-customer-level: ${WHALE_CRM_DEFAULT_CUSTOMER_LEVEL:C}
    # 公海自动回收：默认关闭，由运维确认规则后开启
    pool-recycle-enabled: ${WHALE_CRM_POOL_RECYCLE_ENABLED:false}
    pool-recycle-cron: ${WHALE_CRM_POOL_RECYCLE_CRON:0 0 2 * * ?}
    pool-recycle-batch-size: ${WHALE_CRM_POOL_RECYCLE_BATCH_SIZE:200}
    # 报价折扣审批（whale-workflow）：关闭或缺少 definition-id 时提交审批失败关闭
    quote-approval:
      enabled: ${WHALE_CRM_QUOTE_APPROVAL_ENABLED:true}
      definition-id: ${WHALE_CRM_QUOTE_DEFINITION_ID:}
      workflow-url: ${WHALE_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: ${WHALE_CRM_QUOTE_APPROVAL_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_QUOTE_APPROVAL_READ_TIMEOUT:3000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
