server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:9007}
  servlet:
    context-path: /

spring:
  application:
    name: whale-crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_crm?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 版本化建表（门禁通过后直接追加 V2 业务索引，不重建库）
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

whale:
  permission:
    header:
      enabled: true
  crm:
    # 需求门禁（D2）已通过（Wave 5.83）；置为 false 可一键回退到仅 /crm/meta 的维护态
    demand-gate-passed: ${WHALE_CRM_DEMAND_GATE_PASSED:true}
    customer-code-prefix: ${WHALE_CRM_CUSTOMER_CODE_PREFIX:CUS}
    follow-up-page-limit: ${WHALE_CRM_FOLLOW_UP_PAGE_LIMIT:100}
    contract-reference-enabled: ${WHALE_CRM_CONTRACT_REFERENCE_ENABLED:false}
    default-customer-level: ${WHALE_CRM_DEFAULT_CUSTOMER_LEVEL:C}
    # 售后服务（M4 工单 / SLA）：D7 默认口径 P1 2h/8h、P2 4h/24h、P3 8h/72h，7×8 工作时段
    # （时间值必须加引号：YAML 1.1 把裸 `09:00` 当六十进制数解析成 540）
    service:
      enabled: ${WHALE_CRM_SERVICE_ENABLED:true}
      default-calendar-code: ${WHALE_CRM_SERVICE_CALENDAR:DEFAULT}
      workday-start: '${WHALE_CRM_SERVICE_WORKDAY_START:09:00}'
      workday-end: '${WHALE_CRM_SERVICE_WORKDAY_END:18:00}'
      break-minutes: ${WHALE_CRM_SERVICE_BREAK_MINUTES:60}
      weekdays: ${WHALE_CRM_SERVICE_WEEKDAYS:1,2,3,4,5,6,7}
      p1-response-hours: ${WHALE_CRM_SERVICE_P1_RESPONSE_HOURS:2}
      p1-resolve-hours: ${WHALE_CRM_SERVICE_P1_RESOLVE_HOURS:8}
      p2-response-hours: ${WHALE_CRM_SERVICE_P2_RESPONSE_HOURS:4}
      p2-resolve-hours: ${WHALE_CRM_SERVICE_P2_RESOLVE_HOURS:24}
      p3-response-hours: ${WHALE_CRM_SERVICE_P3_RESPONSE_HOURS:8}
      p3-resolve-hours: ${WHALE_CRM_SERVICE_P3_RESOLVE_HOURS:72}
    # 知识库正文引用（whale-doc 内网）：正文归文档服务，CRM 只存 docId/版本；
    # 关闭或文档服务不可用时降级为 doc_available=false
    docs:
      enabled: ${WHALE_CRM_DOCS_ENABLED:false}
      doc-url: ${WHALE_DOC_URL:http://127.0.0.1:8095}
      connect-timeout-millis: ${WHALE_CRM_DOCS_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_DOCS_READ_TIMEOUT:2000}
    # 满意度问卷：默认关闭避免误发；secret 留空则进程内随机生成（重启后历史令牌失效），
    # 生产必须显式配置 WHALE_CRM_SURVEY_SECRET
    survey:
      enabled: ${WHALE_CRM_SURVEY_ENABLED:false}
      expire-days: ${WHALE_CRM_SURVEY_EXPIRE_DAYS:7}
      secret: ${WHALE_CRM_SURVEY_SECRET:}
      rate-limit-minutes: ${WHALE_CRM_SURVEY_RATE_LIMIT_MINUTES:10}
      rate-limit-count: ${WHALE_CRM_SURVEY_RATE_LIMIT_COUNT:5}
    # 公海自动回收：默认关闭，由运维确认规则后开启；调度已迁移 whale-job（job_info 1009）
    pool-recycle-enabled: ${WHALE_CRM_POOL_RECYCLE_ENABLED:false}
    pool-recycle-batch-size: ${WHALE_CRM_POOL_RECYCLE_BATCH_SIZE:200}
    customer-import-max-rows: ${WHALE_CRM_CUSTOMER_IMPORT_MAX_ROWS:1000}
    customer-export-max-rows: ${WHALE_CRM_CUSTOMER_EXPORT_MAX_ROWS:5000}
    # 报价折扣审批（whale-workflow）：关闭或缺少 definition-id 时提交审批失败关闭
    quote-approval:
      enabled: ${WHALE_CRM_QUOTE_APPROVAL_ENABLED:true}
      definition-id: ${WHALE_CRM_QUOTE_DEFINITION_ID:}
      workflow-url: ${WHALE_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: ${WHALE_CRM_QUOTE_APPROVAL_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_QUOTE_APPROVAL_READ_TIMEOUT:3000}
    # 合同台账投影（whale-contract 内网）：默认关闭，联调时开启
    contract:
      enabled: ${WHALE_CRM_CONTRACT_SYNC_ENABLED:false}
      base-url: ${WHALE_CONTRACT_URL:http://127.0.0.1:9006}
      connect-timeout-millis: ${WHALE_CRM_CONTRACT_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_CONTRACT_READ_TIMEOUT:3000}
      expiring-days: ${WHALE_CRM_CONTRACT_EXPIRING_DAYS:30}
      sync-batch-size: ${WHALE_CRM_CONTRACT_SYNC_BATCH_SIZE:200}
    # 商务订单审批（whale-workflow）：缺少 definition-id 时提交审批失败关闭
    order-approval:
      enabled: ${WHALE_CRM_ORDER_APPROVAL_ENABLED:true}
      definition-id: ${WHALE_CRM_ORDER_DEFINITION_ID:}
      workflow-url: ${WHALE_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: ${WHALE_CRM_ORDER_APPROVAL_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_ORDER_APPROVAL_READ_TIMEOUT:3000}
    # 商务订单下发 ERP（whale-erp 内网）：默认关闭，联调时开启；调度已迁移 whale-job（job_info 1005/1006）
    erp:
      enabled: ${WHALE_CRM_ERP_ENABLED:false}
      base-url: ${WHALE_ERP_URL:http://127.0.0.1:9001}
      connect-timeout-millis: ${WHALE_CRM_ERP_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_ERP_READ_TIMEOUT:3000}
      batch-size: ${WHALE_CRM_ERP_BATCH_SIZE:100}
      max-attempts: ${WHALE_CRM_ERP_MAX_ATTEMPTS:8}
      backoff-base-minutes: ${WHALE_CRM_ERP_BACKOFF_BASE_MINUTES:1}
      backoff-max-minutes: ${WHALE_CRM_ERP_BACKOFF_MAX_MINUTES:60}
    # 退换货审批（whale-workflow）：缺少 definition-id 时提交审批失败关闭
    return-approval:
      enabled: ${WHALE_CRM_RETURN_APPROVAL_ENABLED:true}
      definition-id: ${WHALE_CRM_RETURN_DEFINITION_ID:}
      workflow-url: ${WHALE_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: ${WHALE_CRM_RETURN_APPROVAL_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_RETURN_APPROVAL_READ_TIMEOUT:3000}
    # 开票审批（whale-workflow）：缺少 definition-id 时提交审批失败关闭
    invoice-approval:
      enabled: ${WHALE_CRM_INVOICE_APPROVAL_ENABLED:true}
      definition-id: ${WHALE_CRM_INVOICE_DEFINITION_ID:}
      workflow-url: ${WHALE_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: ${WHALE_CRM_INVOICE_APPROVAL_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_INVOICE_APPROVAL_READ_TIMEOUT:3000}
    # 应收快照对账（whale-erp 内网只读）：默认关闭，联调时开启；调度已迁移 whale-job（job_info 1007）
    ar:
      enabled: ${WHALE_CRM_AR_ENABLED:false}
      base-url: ${WHALE_ERP_URL:http://127.0.0.1:9001}
      connect-timeout-millis: ${WHALE_CRM_AR_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_AR_READ_TIMEOUT:3000}
      batch-size: ${WHALE_CRM_AR_BATCH_SIZE:200}
    # 营销管理（M5）：触达走 whale-message，同一活动同一联系人同一渠道只发一次
    marketing:
      enabled: ${WHALE_CRM_MARKETING_ENABLED:true}
      send-batch-size: ${WHALE_CRM_MARKETING_SEND_BATCH_SIZE:200}
      daily-frequency-limit: ${WHALE_CRM_MARKETING_DAILY_LIMIT:1}
      default-channel: ${WHALE_CRM_MARKETING_DEFAULT_CHANNEL:EMAIL}
      message-url: ${WHALE_MESSAGE_URL:http://127.0.0.1:8094}
      # 送达回执回调：消息服务按 providerMessageId 匹配投递记录后回调本端点（内网直连）
      callback-url: ${WHALE_CRM_MARKETING_CALLBACK_URL:http://127.0.0.1:9007/crm/internal/marketing/delivery-callback}
      connect-timeout-millis: ${WHALE_CRM_MESSAGE_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_MESSAGE_READ_TIMEOUT:3000}
      auto-approve-report: ${WHALE_CRM_PARTNER_AUTO_APPROVE:false}
    # 数据分析（M6）：快照/行动计划经 whale-job 调度（job_info 1001/1002）触发本服务
    # /crm/internal/analytics/**，保留 5 年，规则化行动计划
    analytics:
      enabled: ${WHALE_CRM_ANALYTICS_ENABLED:true}
      retention-years: ${WHALE_CRM_METRIC_RETENTION_YEARS:5}
      export-max-rows: ${WHALE_CRM_EXPORT_MAX_ROWS:5000}
      dashboard-lookback-days: ${WHALE_CRM_DASHBOARD_LOOKBACK_DAYS:90}
      key-customer-idle-days: ${WHALE_CRM_KEY_CUSTOMER_IDLE_DAYS:30}
      opportunity-overdue-days: ${WHALE_CRM_OPPORTUNITY_OVERDUE_DAYS:0}
      contract-expire-days: ${WHALE_CRM_CONTRACT_EXPIRE_DAYS:90}
      overdue-amount-threshold: ${WHALE_CRM_OVERDUE_AMOUNT_THRESHOLD:0}
    # whale-file 文件服务（分析导出产物上传与代理下载）
    file:
      base-url: ${WHALE_FILE_URL:http://127.0.0.1:8085}
      bucket: ${WHALE_CRM_EXPORT_BUCKET:bluewhale-crm-export}
      connect-timeout-millis: ${WHALE_CRM_FILE_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${WHALE_CRM_FILE_READ_TIMEOUT:5000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
