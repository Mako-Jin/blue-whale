server:
  port: ${SERVER_PORT:9005}
  servlet:
    context-path: /

spring:
  application:
    name: whale-pm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_pm?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # M2 工作项编号序列依赖 Redis（whale:pm:itemseq:<projectId>）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor，按网关注入的
# X-Permission-Codes 判定 PM 接口的 sys:pm:* 权限。
whale:
  permission:
    header:
      enabled: true
  pm:
    # 工作项 key 序列（M2 使用）；首版仅登记配置口径，不启用 Redis
    item-seq:
      key-prefix: whale:pm:itemseq
    # M5 可选集成：站内通知（默认关闭，开启后指派/评论/流转经 whale-im 内网接口投递）
    notify:
      enabled: ${PM_NOTIFY_ENABLED:false}
      im-url: ${PM_NOTIFY_IM_URL:http://127.0.0.1:8091}
      connect-timeout-millis: 1000
      read-timeout-millis: 2000
    # M5 可选集成：工作流审批（默认关闭，开启后需配置流程定义ID）
    approval:
      enabled: ${PM_APPROVAL_ENABLED:false}
      definition-id: ${PM_APPROVAL_DEFINITION_ID:}
      workflow-url: ${PM_APPROVAL_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: 1000
      read-timeout-millis: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
