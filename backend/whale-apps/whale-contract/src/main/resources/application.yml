server:
  port: ${SERVER_PORT:9006}
  servlet:
    context-path: /

spring:
  application:
    name: whale-contract
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_contract?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor，按网关注入的
# X-Permission-Codes 判定合同接口的 sys:contract:* 权限。
whale:
  permission:
    header:
      enabled: true
  contract:
    # 工作流审批集成：submit 提交审批时按 definition-id 发起流程实例
    approval:
      enabled: ${CONTRACT_APPROVAL_ENABLED:true}
      definition-id: ${CONTRACT_APPROVAL_DEFINITION_ID:}
      workflow-url: ${CONTRACT_APPROVAL_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: 1000
      read-timeout-millis: 3000
    # Wave 5.61 M2：whale-file 内网通道（下载正文 / 上传签章件，接口不带权限码）
    file:
      base-url: ${CONTRACT_FILE_URL:http://127.0.0.1:8085}
      connect-timeout-millis: 1000
      read-timeout-millis: 5000
    # Wave 5.61 M2/M3：签章与第三方电子签渠道
    # provider 默认 local；切换 esignbao/fadada/ssq 只改此处或 CONTRACT_ESIGN_PROVIDER，无需改代码
    esign:
      p12-path: ${CONTRACT_ESIGN_P12_PATH:}
      p12-password: ${CONTRACT_ESIGN_P12_PASSWORD:}
      tsa-url: ${CONTRACT_ESIGN_TSA_URL:}
      provider: ${CONTRACT_ESIGN_PROVIDER:local}
      callback-window-seconds: ${CONTRACT_ESIGN_CALLBACK_WINDOW_SECONDS:300}
      # 回调 HMAC 密钥：默认值仅本地联调，生产必须通过环境变量覆盖
      callback-secret: ${CONTRACT_ESIGN_CALLBACK_SECRET:bluewhale-esign-dev-callback-secret}
      providers:
        esignbao:
          base-url: ${CONTRACT_ESIGN_ESIGNBAO_BASE_URL:}
          app-id: ${CONTRACT_ESIGN_ESIGNBAO_APP_ID:}
          app-secret: ${CONTRACT_ESIGN_ESIGNBAO_APP_SECRET:}
          sign-url-template: ${CONTRACT_ESIGN_ESIGNBAO_SIGN_URL:}
        fadada:
          base-url: ${CONTRACT_ESIGN_FADADA_BASE_URL:}
          app-id: ${CONTRACT_ESIGN_FADADA_APP_ID:}
          app-secret: ${CONTRACT_ESIGN_FADADA_APP_SECRET:}
          sign-url-template: ${CONTRACT_ESIGN_FADADA_SIGN_URL:}
        ssq:
          base-url: ${CONTRACT_ESIGN_SSQ_BASE_URL:}
          app-id: ${CONTRACT_ESIGN_SSQ_APP_ID:}
          app-secret: ${CONTRACT_ESIGN_SSQ_APP_SECRET:}
          sign-url-template: ${CONTRACT_ESIGN_SSQ_SIGN_URL:}
      # 回调补偿：对停留超时的非 local SIGNING 任务轮询三方状态，发现终态时走内部签名回调
      reconcile:
        enabled: ${CONTRACT_ESIGN_RECONCILE_ENABLED:true}
        interval-ms: ${CONTRACT_ESIGN_RECONCILE_INTERVAL_MS:60000}
        initial-delay-ms: ${CONTRACT_ESIGN_RECONCILE_INITIAL_DELAY_MS:30000}
        stale-seconds: ${CONTRACT_ESIGN_RECONCILE_STALE_SECONDS:120}
        batch-size: ${CONTRACT_ESIGN_RECONCILE_BATCH_SIZE:50}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
