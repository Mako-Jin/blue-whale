server:
  port: ${SERVER_PORT:9006}
  servlet:
    context-path: /

spring:
  application:
    name: whale-contract
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_contract?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测；容量按实例数换算（默认 5 × 20 服务 ≈ 100 连接）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor，按网关注入的
# X-Permission-Codes 判定合同接口的 sys:contract:* 权限。
whale:
  permission:
    header:
      enabled: true
  contract:
    # 工作流审批集成：submit 提交审批时按 definition-id 发起流程实例
    approval:
      enabled: ${CONTRACT_APPROVAL_ENABLED:true}
      definition-id: ${CONTRACT_APPROVAL_DEFINITION_ID:}
      workflow-url: ${CONTRACT_APPROVAL_WORKFLOW_URL:http://127.0.0.1:8083}
      connect-timeout-millis: 1000
      read-timeout-millis: 3000
    # Wave 5.61 M2：whale-file 内网通道（下载正文 / 上传签章件，接口不带权限码）
    file:
      base-url: ${CONTRACT_FILE_URL:http://127.0.0.1:8085}
      connect-timeout-millis: 1000
      read-timeout-millis: 5000
    # Wave 5.61 M2/M3：签章与第三方电子签渠道
    # provider 默认 local；切换 esignbao/fadada/ssq 只改此处或 CONTRACT_ESIGN_PROVIDER，无需改代码
    # 三方默认按 BlueWhale 电子签开放平台协议 v1 调用；供应商直连/适配网关按真实文档覆盖
    # create/query/download 路径与请求签名实现
    esign:
      p12-path: ${CONTRACT_ESIGN_P12_PATH:}
      p12-password: ${CONTRACT_ESIGN_P12_PASSWORD:}
      tsa-url: ${CONTRACT_ESIGN_TSA_URL:}
      # RFC 3161 时间戳：配置 tsa-url 后签署会写入时间戳，TSA 失败直接签署失败（不降级）
      # 生产合规建议 CONTRACT_ESIGN_TSA_REQUIRED=true：此时无 tsa-url 拒绝启动、验签缺时间戳判不通过
      tsa-username: ${CONTRACT_ESIGN_TSA_USERNAME:}
      tsa-password: ${CONTRACT_ESIGN_TSA_PASSWORD:}
      tsa-required: ${CONTRACT_ESIGN_TSA_REQUIRED:false}
      tsa-timeout-millis: ${CONTRACT_ESIGN_TSA_TIMEOUT:5000}
      # 持牌 CA 信任根：PEM 证书链；配置后 P12/CMS 证书必须链到信任根，并随 CMS 下发完整证书链
      ca-cert-path: ${CONTRACT_ESIGN_CA_CERT_PATH:}
      # 可选 CRL（PEM 或 DER）：配置后签署/验签检查签名证书是否被吊销
      ca-crl-path: ${CONTRACT_ESIGN_CA_CRL_PATH:}
      provider: ${CONTRACT_ESIGN_PROVIDER:local}
      callback-window-seconds: ${CONTRACT_ESIGN_CALLBACK_WINDOW_SECONDS:300}
      # 回调 HMAC 密钥：默认值仅本地联调，生产必须通过环境变量覆盖
      callback-secret: ${CONTRACT_ESIGN_CALLBACK_SECRET:bluewhale-esign-dev-callback-secret}
      providers:
        esignbao:
          base-url: ${CONTRACT_ESIGN_ESIGNBAO_BASE_URL:}
          app-id: ${CONTRACT_ESIGN_ESIGNBAO_APP_ID:}
          app-secret: ${CONTRACT_ESIGN_ESIGNBAO_APP_SECRET:}
          create-path: /v1/sign-tasks
          query-path: /v1/sign-tasks/{providerTaskId}
          download-path: /v1/sign-tasks/{providerTaskId}/file
          notify-url: ${CONTRACT_ESIGN_ESIGNBAO_NOTIFY_URL:}
          connect-timeout-millis: ${CONTRACT_ESIGN_ESIGNBAO_CONNECT_TIMEOUT:3000}
          read-timeout-millis: ${CONTRACT_ESIGN_ESIGNBAO_READ_TIMEOUT:10000}
          sign-url-template: ${CONTRACT_ESIGN_ESIGNBAO_SIGN_URL:}
        fadada:
          base-url: ${CONTRACT_ESIGN_FADADA_BASE_URL:}
          app-id: ${CONTRACT_ESIGN_FADADA_APP_ID:}
          app-secret: ${CONTRACT_ESIGN_FADADA_APP_SECRET:}
          create-path: /v1/sign-tasks
          query-path: /v1/sign-tasks/{providerTaskId}
          download-path: /v1/sign-tasks/{providerTaskId}/file
          notify-url: ${CONTRACT_ESIGN_FADADA_NOTIFY_URL:}
          connect-timeout-millis: ${CONTRACT_ESIGN_FADADA_CONNECT_TIMEOUT:3000}
          read-timeout-millis: ${CONTRACT_ESIGN_FADADA_READ_TIMEOUT:10000}
          sign-url-template: ${CONTRACT_ESIGN_FADADA_SIGN_URL:}
        ssq:
          base-url: ${CONTRACT_ESIGN_SSQ_BASE_URL:}
          app-id: ${CONTRACT_ESIGN_SSQ_APP_ID:}
          app-secret: ${CONTRACT_ESIGN_SSQ_APP_SECRET:}
          create-path: /v1/sign-tasks
          query-path: /v1/sign-tasks/{providerTaskId}
          download-path: /v1/sign-tasks/{providerTaskId}/file
          notify-url: ${CONTRACT_ESIGN_SSQ_NOTIFY_URL:}
          connect-timeout-millis: ${CONTRACT_ESIGN_SSQ_CONNECT_TIMEOUT:3000}
          read-timeout-millis: ${CONTRACT_ESIGN_SSQ_READ_TIMEOUT:10000}
          sign-url-template: ${CONTRACT_ESIGN_SSQ_SIGN_URL:}
      # 回调补偿：对停留超时的非 local SIGNING 任务轮询三方状态，发现终态时走内部签名回调
      reconcile:
        enabled: ${CONTRACT_ESIGN_RECONCILE_ENABLED:true}
        interval-ms: ${CONTRACT_ESIGN_RECONCILE_INTERVAL_MS:60000}
        initial-delay-ms: ${CONTRACT_ESIGN_RECONCILE_INITIAL_DELAY_MS:30000}
        stale-seconds: ${CONTRACT_ESIGN_RECONCILE_STALE_SECONDS:120}
        batch-size: ${CONTRACT_ESIGN_RECONCILE_BATCH_SIZE:50}
    # 合同归档快照推送：单据终态生效后归档时，推不可变快照到 whale-archive 内网接口
    archive:
      enabled: ${CONTRACT_ARCHIVE_ENABLED:true}
      base-url: ${CONTRACT_ARCHIVE_URL:http://127.0.0.1:8093}
      connect-timeout-millis: ${CONTRACT_ARCHIVE_CONNECT_TIMEOUT:1000}
      read-timeout-millis: ${CONTRACT_ARCHIVE_READ_TIMEOUT:5000}
      security-level: ${CONTRACT_ARCHIVE_SECURITY_LEVEL:2}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
