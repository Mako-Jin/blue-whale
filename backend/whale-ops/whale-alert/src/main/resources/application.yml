server:
  port: ${SERVER_PORT:9103}
  servlet:
    context-path: /

spring:
  application:
    name: whale-alert
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_alert?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务告警接口的 sys:alert:* 权限。
whale:
  permission:
    header:
      enabled: true
  # REQ-ARCH-007：告警通知渠道与 Alertmanager 入站
  alert:
    notify:
      # Alertmanager 入站校验令牌；生产环境必须通过 ALERT_WEBHOOK_TOKEN 覆盖
      webhook-token: ${ALERT_WEBHOOK_TOKEN:bluewhale-alert-token}
      # F-03 同一 fingerprint 在窗口内重复触发时只落库/通知一次
      dedup:
        enabled: ${ALERT_DEDUP_ENABLED:true}
        window-seconds: ${ALERT_DEDUP_WINDOW_SECONDS:300}
      email:
        enabled: ${ALERT_EMAIL_ENABLED:false}
        from: ${ALERT_EMAIL_FROM:}
        to: ${ALERT_EMAIL_TO:}
      webhook:
        enabled: ${ALERT_WEBHOOK_ENABLED:false}
        url: ${ALERT_WEBHOOK_URL:}
        timeout-millis: ${ALERT_WEBHOOK_TIMEOUT:3000}
      # F-03b：统一 HTTP 短信网关；供应商签名算法由网关完成
      sms:
        enabled: ${ALERT_SMS_ENABLED:false}
        url: ${ALERT_SMS_URL:}
        token: ${ALERT_SMS_TOKEN:}
        to: ${ALERT_SMS_TO:}
        template-code: ${ALERT_SMS_TEMPLATE_CODE:BLUEWHALE_ALERT}
        sign-name: ${ALERT_SMS_SIGN_NAME:}
        timeout-millis: ${ALERT_SMS_TIMEOUT:3000}

# 邮件通道依赖 Spring Mail 自动装配：设置 SPRING_MAIL_HOST / SPRING_MAIL_USERNAME /
# SPRING_MAIL_PASSWORD 后 JavaMailSender 才会创建；未配置时邮件通知自动跳过。

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
