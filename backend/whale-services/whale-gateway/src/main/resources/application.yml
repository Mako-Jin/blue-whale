server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: whale-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # T5 Nacos 动态路由：从 Nacos 导入网关动态路由配置（dataId/group 见 NacosRouteDefinitionRepository）；
  # optional: 前缀保证 Nacos 不可用时网关仍能启动，refreshEnabled=true 支持配置变更后刷新路由。
  config:
    import: "optional:nacos:whale-gateway-routes.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
    gateway:
      server:
        webflux:
          # 路由约定（REQ-ARCH-003）：服务自持对外一级路径前缀，网关只转发、不剥离前缀；禁止 StripPrefix
          # 服务发现路由定位器（Gateway 5.x 官方前缀：spring.cloud.gateway.server.webflux）
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            # V-02：剥离外部请求自带的内网令牌头，防止伪造直通下游服务侧校验
            - RemoveRequestHeader=X-Internal-Token
          routes:
            # whale-service-auth 自持全部一级前缀（REQ-ARCH-003）：认证 + 用户/部门/角色/菜单/权限管理（AUTH-38）
            - id: whale-service-auth
              uri: lb://whale-service-auth
              predicates:
                - Path=/auth/**,/user/**,/dept/**,/role/**,/menu/**,/permission/**
            # Wave 5.54 Phase 1/5.3 租户管理与成员：/tenant/** 同属 whale-service-auth；
            # /tenant/internal/** 由 internal-deny 统一 403，对外仅暴露运营接口
            - id: whale-service-auth-tenant
              uri: lb://whale-service-auth
              predicates:
                - Path=/tenant/**
            - id: whale-job
              uri: lb://whale-job
              predicates:
                - Path=/job/**
            - id: whale-workflow
              uri: lb://whale-workflow
              predicates:
                - Path=/workflow/**
            - id: whale-form
              uri: lb://whale-form
              predicates:
                - Path=/form/**
            - id: whale-file
              uri: lb://whale-file
              predicates:
                - Path=/file/**
            - id: whale-pay
              uri: lb://whale-pay
              predicates:
                - Path=/pay/**
            - id: whale-alert
              uri: lb://whale-alert
              predicates:
                - Path=/alert/**
            - id: whale-monitor
              uri: lb://whale-monitor
              predicates:
                - Path=/monitor/**
            - id: whale-audit
              uri: lb://whale-audit
              predicates:
                - Path=/audit/**
            # Wave 5.47 平台与项目知识 Agent（自持 /agent 一级前缀，不含 StripPrefix）
            - id: whale-agent
              uri: lb://whale-agent
              predicates:
                - Path=/agent/**
            # Wave 5.52 自研 WebIM：WS 升级路由 order=-1 先于 REST 路由匹配（同前缀 /im/ws）；
            # 两条路由均不含 StripPrefix，服务自持 /im 一级前缀（REQ-ARCH-003）
            - id: whale-im-ws
              uri: lb:ws://whale-im
              order: -1
              predicates:
                - Path=/im/ws
            - id: whale-im
              uri: lb://whale-im
              predicates:
                - Path=/im/**
            # Wave 5.53 档案服务：自持 /archive 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /archive/internal/** 由 internal-deny 统一 403
            - id: whale-archive
              uri: lb://whale-archive
              predicates:
                - Path=/archive/**
            # Wave 5.68 统一消息服务：自持 /message 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /message/internal/** 由 internal-deny 统一 403
            - id: whale-message
              uri: lb://whale-message
              predicates:
                - Path=/message/**
            # Wave 5.89 邮箱服务：自持 /mail 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 与 whale-message 严格分工：本路由承载邮箱域（账号/文件夹/邮件/草稿），
            # 消息管控仍走 /message/**；内网 /mail/internal/** 由 internal-deny 统一 403
            - id: whale-mail
              uri: lb://whale-mail
              predicates:
                - Path=/mail/**
            # Wave 5.91 地图服务：自持 /map 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # Key 与坐标系收敛在服务端，前端只调本服务的 /map/**，不直连供应商
            - id: whale-map
              uri: lb://whale-map
              predicates:
                - Path=/map/**
            # Wave 5.74 在线文档 / Wiki：自持 /doc 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # M2 实时协作 WS 升级路由 order=-1 先于 REST 路由匹配（同前缀 /doc/ws）；
            # 内网 /doc/internal/** 由 internal-deny 统一 403
            - id: whale-doc-ws
              uri: lb:ws://whale-doc
              order: -1
              predicates:
                - Path=/doc/ws
            - id: whale-doc
              uri: lb://whale-doc
              predicates:
                - Path=/doc/**
            # Wave 5.75 音乐平台：自持 /music 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /music/internal/** 由 internal-deny 统一 403；
            # /music/stream/** 在下方 rate-limit.path-rules 使用独立阈值
            - id: whale-music
              uri: lb://whale-music
              predicates:
                - Path=/music/**
            # Wave 5.77 视频平台：自持 /video 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /video/internal/** 由 internal-deny 统一 403；
            # /video/stream/** 使用独立限流，且不加入 circuit-breaker.apply-to-routes
            # （长视频一次播放会跨多个 Range 请求，不能被 3s 超时误熔断）
            - id: whale-video
              uri: lb://whale-video
              predicates:
                - Path=/video/**
            # Wave 5.77 城池场景导航：自持 /scene 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # M1/M2 只提供 2D 导航与管理接口，3D 为前端可选增强层（M3）；
            # 内网 /scene/internal/** 由 internal-deny 统一 403
            - id: whale-scene
              uri: lb://whale-scene
              predicates:
                - Path=/scene/**
            # Wave 5.54 P2 偏差 C-03 收口：业务应用补路由（自持一级前缀，不含 StripPrefix）
            - id: whale-erp
              uri: lb://whale-erp
              predicates:
                - Path=/erp/**
            - id: whale-mes
              uri: lb://whale-mes
              predicates:
                - Path=/mes/**
            - id: whale-pdm
              uri: lb://whale-pdm
              predicates:
                - Path=/pdm/**
            - id: whale-oa
              uri: lb://whale-oa
              predicates:
                - Path=/oa/**
            # Wave 5.55 项目管理服务：自持 /pm 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /pm/internal/** 由 internal-deny 统一 403
            - id: whale-pm
              uri: lb://whale-pm
              predicates:
                - Path=/pm/**
            # Wave 5.61 合同管理与电子签章：自持 /contract 一级前缀（不含 StripPrefix）；
            # 内网 /contract/internal/** 由 internal-deny 统一 403
            - id: whale-contract
              uri: lb://whale-contract
              predicates:
                - Path=/contract/**
            # Wave 5.77 客户关系（规划态模块骨架）：自持 /crm 一级前缀（不含 StripPrefix）；
            # 需求门禁（ADR-003）通过前不开放业务 CRUD，仅暴露 /crm/meta；
            # 内网 /crm/internal/** 由 internal-deny 统一 403
            - id: whale-crm
              uri: lb://whale-crm
              predicates:
                - Path=/crm/**
            # Wave 5.87 学习培训考试（M0 底座 + M1 课程与学习）：
            # 自持 /lms 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /lms/internal/** 由 internal-deny 统一 403
            - id: whale-lms
              uri: lb://whale-lms
              predicates:
                - Path=/lms/**
            # Wave 5.88 党政工会（独立服务；原计划并入 OA，2026-11-06 决策变更）：
            # 自持 /party 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /party/internal/** 由 internal-deny 统一 403
            - id: whale-party
              uri: lb://whale-party
              predicates:
                - Path=/party/**
            # Wave 5.94 商城（一套内核兼容零售 / 经销订货 / 员工福利）：
            # 自持 /mall 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /mall/internal/** 由 internal-deny 统一 403（支付回调走内网直连）
            - id: whale-mall
              uri: lb://whale-mall
              predicates:
                - Path=/mall/**
            # Wave 5.73 F-05 解冻：whale-config 业务配置管理服务（配置项 CRUD / 版本历史 / 回滚），
            # 自持 /config 一级前缀（不含 StripPrefix，REQ-ARCH-003）
            - id: whale-config
              uri: lb://whale-config
              predicates:
                - Path=/config/**

whale:
  # S-02 Redis 降级口径：false=可用性优先（Redis 不可读时放行并告警），
  # true=安全优先（按已撤销/已停用/已命中黑名单拒绝请求）。
  security:
    degradation:
      fail-closed: ${SECURITY_DEGRADATION_FAIL_CLOSED:false}
  gateway:
    jwt:
      # HS256 签名密钥，必须与 whale-service-auth 保持一致
      secret: ${WHALE_GATEWAY_JWT_SECRET:bluewhale-jwt-secret-2026-please-change-in-production}
    # P1-2 跨域配置：dev 默认放行本机任意端口（Vite 8001/8002/8003 直连网关联调）；
    # 生产通过环境变量 WHALE_GATEWAY_CORS_ALLOWED_ORIGINS 覆盖为具体域名白名单（逗号分隔），
    # 未命中来源的预检请求返回 403，由 Nginx 同源转发兜底。
    cors:
      allowed-origins: ${WHALE_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    # 不需要 JWT 认证的白名单路径（支持 Ant 通配符）
    white-list:
      - /auth/login
      - /auth/refresh
      - /actuator/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /favicon.ico
      # 前端/行为上报接口（REQ-SEC-006）：未登录期也需上报，免 JWT；路径须与 whale-audit 对外路径逐字一致（网关不剥离前缀）
      # 仅放行上报写入端点 /batch；同前缀下的 /page 查询端点须走 JWT + 权限码头（否则漏注入 X-Permission-Codes 导致下游 403）
      - /audit/log/frontend/batch
      - /audit/log/behavior/batch
      # Wave 5.52 WebIM WebSocket 升级：浏览器 WS 无法携带 Authorization 头，
      # 鉴权改由 60s 一次性 ticket（POST /im/ws-ticket 已走标准 JWT）；URL 中严禁出现 JWT。
      - /im/ws
      # Wave 5.74 M2 文档实时协作 WS 升级：同上，ticket 由 POST /doc/ws-ticket 签发
      - /doc/ws
      # Wave 5.75 / 5.77 音视频流：<audio>/<video> 标签无法携带 Authorization 头，
      # 鉴权改由 POST /music/play/ticket、POST /video/play/ticket 签发的一次性票据，
      # 票据在 whale-music / whale-video 侧校验并消费，网关层不再要求 JWT。
      - /music/stream/**
      - /video/stream/**
      # Wave 5.61 M3 第三方电子签章回调：三方平台匿名回调，安全依赖渠道 HMAC/RSA 验签
      # + 时间戳窗口 + provider_event_id 幂等；仅放行该前缀，其余 /contract/** 仍须 JWT。
      - /contract/sign/callback/**
    # P1-13 路由治理端点鉴权：/actuator/routeGovernance 不受 JWT 保护（actuator 端点不经过网关路由链），
    # 且含写操作（回滚路由），必须携带 X-Governance-Token；令牌未配置时一律 403（fail-closed），
    # 生产通过环境变量 WHALE_GATEWAY_GOVERNANCE_TOKEN 显式启用。health/info/prometheus 仍匿名可用。
    governance:
      token: ${WHALE_GATEWAY_GOVERNANCE_TOKEN:}
    # AUTH-06 权限码头注入：JwtAuthGlobalFilter 注入 X-User-Id 后，PermissionHeaderGlobalFilter(order=-50)
    # 读 Redis 权限码缓存（命中即注入）；未命中/哨兵/异常回落 lb://whale-service-auth/auth/me，两级均失败注入空串并告警
    permission-header:
      enabled: ${WHALE_GATEWAY_PERMISSION_HEADER_ENABLED:true}
    # T5.4 网关入口限流（Redis 计数器 + 固定窗口，REQ-DIST-003）：
    # window-seconds 为固定窗口长度（秒），limit 为单窗口允许的最大请求数，超阈值返回 HTTP 429 + Result 体；
    # Redis 不可用时降级放行（可用性优先），由 RateLimitGlobalFilter 执行。
    # path-rules 为按路径特化的更严规则（最长匹配优先）：前端/行为上报接口为 permitAll 公开写库，
    # 单独收紧阈值防刷量（REQ-SEC-006）；未命中规则的路径沿用上方全局阈值。
    rate-limit:
      enabled: ${WHALE_GATEWAY_RATE_LIMIT_ENABLED:true}
      limit: ${WHALE_GATEWAY_RATE_LIMIT:200}
      window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:1}
      path-rules:
        - path-pattern: /audit/log/frontend/batch
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REPORT:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REPORT_WINDOW_SECONDS:1}
        - path-pattern: /audit/log/behavior/batch
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REPORT:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REPORT_WINDOW_SECONDS:1}
        # Wave 5.75 音频流：一次播放会发起多次 Range 请求，按路径独立阈值防止直连刷流
        - path-pattern: /music/stream/**
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_STREAM:120}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_STREAM_WINDOW_SECONDS:60}
        # Wave 5.75 评论与收藏按用户写操作，单独收紧阈值
        - path-pattern: /music/song/*/comment
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_COMMENT:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_COMMENT_WINDOW_SECONDS:60}
        # Wave 5.75 M5-4 播放票据签发：防止刷票与歌曲探测（正常播放一次播放仅签发一次）
        - path-pattern: /music/play/ticket
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_TICKET:60}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_TICKET_WINDOW_SECONDS:60}
        # Wave 5.75 M5-4 收藏 / 取消收藏：写操作防刷（幂等但会触发计数回写）
        - path-pattern: /music/song/*/like
          limit: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_LIKE:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_MUSIC_LIKE_WINDOW_SECONDS:60}
        # Wave 5.77 视频流：一次播放会发起多次 Range 请求，按路径独立阈值防止直连刷流
        - path-pattern: /video/stream/**
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_STREAM:120}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_STREAM_WINDOW_SECONDS:60}
        # Wave 5.77 播放票据签发（单个 / 批量）：防止刷票与内容探测
        - path-pattern: /video/play/ticket
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_TICKET:60}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_TICKET_WINDOW_SECONDS:60}
        # Wave 5.77 评论发表：按用户写操作，单独收紧阈值
        - path-pattern: /video/content/*/comment
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_COMMENT:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_COMMENT_WINDOW_SECONDS:60}
        # Wave 5.77 点赞 / 收藏：写操作防刷（幂等但会触发计数回写）
        - path-pattern: /video/content/*/like
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE_WINDOW_SECONDS:60}
        - path-pattern: /video/content/*/favorite
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_LIKE_WINDOW_SECONDS:60}
        # Wave 5.77 上传代理（若前端经网关调用文件上传）：收紧阈值
        - path-pattern: /video/upload/**
          limit: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_UPLOAD:20}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_VIDEO_UPLOAD_WINDOW_SECONDS:60}
    # T4 熔断降级（轻量实现，由 CircuitBreakerGlobalFilter 执行）：
    # timeout-millis 为单次下游调用超时；failure-rate-threshold 为触发阈值（百分比）；
    # sliding-window-size 为失败率统计窗口；wait-duration-in-open-state-millis 为打开后等待时长；
    # apply-to-routes 为启用熔断的路由 id，命中后超时/失败按失败率熔断并降级返回 503。
    circuit-breaker:
      enabled: ${WHALE_GATEWAY_CIRCUIT_BREAKER_ENABLED:true}
      timeout-millis: ${WHALE_GATEWAY_CIRCUIT_BREAKER_TIMEOUT_MILLIS:3000}
      failure-rate-threshold: ${WHALE_GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE:50}
      sliding-window-size: ${WHALE_GATEWAY_CIRCUIT_BREAKER_WINDOW_SIZE:20}
      wait-duration-in-open-state-millis: ${WHALE_GATEWAY_CIRCUIT_BREAKER_WAIT_MILLIS:10000}
      apply-to-routes:
        - whale-service-auth
        - whale-job
        - whale-file
        - whale-audit
        - whale-archive
        - whale-message
        - whale-mail
        - whale-doc
        - whale-music
        - whale-map
    # T6 内网接口屏蔽（由 InternalApiDenyGlobalFilter 执行）：命中 patterns 的外部请求直接返回 403
    # 2026-11-09 第九批收口（上线必检 network-boundary）：原为逐 Wave 累积的 20+ 条显式清单，
    # 新服务易漏配；现收敛为单段星号通配（星号不跨段）覆盖全部 /<service>/internal/** 形态，
    # 新服务内网端点按该命名约定自动纳管；discovery.locator 服务名前缀形态由过滤器剥前缀兜底（V-01）。
    # 服务侧 InternalTokenFilter 校验 X-Internal-Token 为第二道防线（default-filters 已剥外部伪造头）。
    internal-deny:
      enabled: ${WHALE_GATEWAY_INTERNAL_DENY_ENABLED:true}
      patterns:
        # 单段通配：覆盖 erp/mes/crm/oa/pm/contract/pdm/lms/party/mall/pay/im/music/video/
        # scene/map/doc/mail/message/file/user/dept/tenant/workflow/form/archive/alert 等全部前缀
        - /*/internal/**
        # P1-3 审计汇聚摄入端点：非 /internal 命名，单独收口
        - /audit/log/ingest/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,routeGovernance
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: debug
