server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: whale-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # T5 Nacos 动态路由：从 Nacos 导入网关动态路由配置（dataId/group 见 NacosRouteDefinitionRepository）；
  # optional: 前缀保证 Nacos 不可用时网关仍能启动，refreshEnabled=true 支持配置变更后刷新路由。
  config:
    import: "optional:nacos:whale-gateway-routes.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:${NACOS_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
    gateway:
      server:
        webflux:
          # 路由约定（REQ-ARCH-003）：服务自持对外一级路径前缀，网关只转发、不剥离前缀；禁止 StripPrefix
          # 服务发现路由定位器（Gateway 5.x 官方前缀：spring.cloud.gateway.server.webflux）
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # whale-service-auth 自持全部一级前缀（REQ-ARCH-003）：认证 + 用户/部门/角色/菜单/权限管理（AUTH-38）
            - id: whale-service-auth
              uri: lb://whale-service-auth
              predicates:
                - Path=/auth/**,/user/**,/dept/**,/role/**,/menu/**,/permission/**
            # Wave 5.54 Phase 1/5.3 租户管理与成员：/tenant/** 同属 whale-service-auth；
            # /tenant/internal/** 由 internal-deny 统一 403，对外仅暴露运营接口
            - id: whale-service-auth-tenant
              uri: lb://whale-service-auth
              predicates:
                - Path=/tenant/**
            - id: whale-job
              uri: lb://whale-job
              predicates:
                - Path=/job/**
            - id: whale-workflow
              uri: lb://whale-workflow
              predicates:
                - Path=/workflow/**
            - id: whale-form
              uri: lb://whale-form
              predicates:
                - Path=/form/**
            - id: whale-file
              uri: lb://whale-file
              predicates:
                - Path=/file/**
            - id: whale-pay
              uri: lb://whale-pay
              predicates:
                - Path=/pay/**
            - id: whale-alert
              uri: lb://whale-alert
              predicates:
                - Path=/alert/**
            - id: whale-monitor
              uri: lb://whale-monitor
              predicates:
                - Path=/monitor/**
            - id: whale-audit
              uri: lb://whale-audit
              predicates:
                - Path=/audit/**
            # Wave 5.47 平台与项目知识 Agent（自持 /agent 一级前缀，不含 StripPrefix）
            - id: whale-agent
              uri: lb://whale-agent
              predicates:
                - Path=/agent/**
            # Wave 5.52 自研 WebIM：WS 升级路由 order=-1 先于 REST 路由匹配（同前缀 /im/ws）；
            # 两条路由均不含 StripPrefix，服务自持 /im 一级前缀（REQ-ARCH-003）
            - id: whale-im-ws
              uri: lb:ws://whale-im
              order: -1
              predicates:
                - Path=/im/ws
            - id: whale-im
              uri: lb://whale-im
              predicates:
                - Path=/im/**
            # Wave 5.53 档案服务：自持 /archive 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /archive/internal/** 由 internal-deny 统一 403
            - id: whale-archive
              uri: lb://whale-archive
              predicates:
                - Path=/archive/**
            # Wave 5.54 P2 偏差 C-03 收口：业务应用与配置中心补路由（自持一级前缀，不含 StripPrefix）
            - id: whale-erp
              uri: lb://whale-erp
              predicates:
                - Path=/erp/**
            - id: whale-mes
              uri: lb://whale-mes
              predicates:
                - Path=/mes/**
            - id: whale-pdm
              uri: lb://whale-pdm
              predicates:
                - Path=/pdm/**
            - id: whale-oa
              uri: lb://whale-oa
              predicates:
                - Path=/oa/**
            # Wave 5.55 项目管理服务：自持 /pm 一级前缀（不含 StripPrefix，REQ-ARCH-003）；
            # 内网 /pm/internal/** 由 internal-deny 统一 403
            - id: whale-pm
              uri: lb://whale-pm
              predicates:
                - Path=/pm/**
            # Wave 5.61 合同管理与电子签章：自持 /contract 一级前缀（不含 StripPrefix）；
            # 内网 /contract/internal/** 由 internal-deny 统一 403
            - id: whale-contract
              uri: lb://whale-contract
              predicates:
                - Path=/contract/**
            - id: whale-config
              uri: lb://whale-config
              predicates:
                - Path=/config/**

whale:
  gateway:
    jwt:
      # HS256 签名密钥，必须与 whale-service-auth 保持一致
      secret: ${WHALE_GATEWAY_JWT_SECRET:bluewhale-jwt-secret-2026-please-change-in-production}
    # P1-2 跨域配置：dev 默认放行本机任意端口（Vite 8001/8002/8003 直连网关联调）；
    # 生产通过环境变量 WHALE_GATEWAY_CORS_ALLOWED_ORIGINS 覆盖为具体域名白名单（逗号分隔），
    # 未命中来源的预检请求返回 403，由 Nginx 同源转发兜底。
    cors:
      allowed-origins: ${WHALE_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    # 不需要 JWT 认证的白名单路径（支持 Ant 通配符）
    white-list:
      - /auth/login
      - /auth/refresh
      - /actuator/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /favicon.ico
      # 前端/行为上报接口（REQ-SEC-006）：未登录期也需上报，免 JWT；路径须与 whale-audit 对外路径逐字一致（网关不剥离前缀）
      # 仅放行上报写入端点 /batch；同前缀下的 /page 查询端点须走 JWT + 权限码头（否则漏注入 X-Permission-Codes 导致下游 403）
      - /audit/log/frontend/batch
      - /audit/log/behavior/batch
      # Wave 5.52 WebIM WebSocket 升级：浏览器 WS 无法携带 Authorization 头，
      # 鉴权改由 60s 一次性 ticket（POST /im/ws-ticket 已走标准 JWT）；URL 中严禁出现 JWT。
      - /im/ws
      # Wave 5.61 M3 第三方电子签章回调：三方平台匿名回调，安全依赖渠道 HMAC/RSA 验签
      # + 时间戳窗口 + provider_event_id 幂等；仅放行该前缀，其余 /contract/** 仍须 JWT。
      - /contract/sign/callback/**
    # P1-13 路由治理端点鉴权：/actuator/routeGovernance 不受 JWT 保护（actuator 端点不经过网关路由链），
    # 且含写操作（回滚路由），必须携带 X-Governance-Token；令牌未配置时一律 403（fail-closed），
    # 生产通过环境变量 WHALE_GATEWAY_GOVERNANCE_TOKEN 显式启用。health/info/prometheus 仍匿名可用。
    governance:
      token: ${WHALE_GATEWAY_GOVERNANCE_TOKEN:}
    # AUTH-06 权限码头注入：JwtAuthGlobalFilter 注入 X-User-Id 后，PermissionHeaderGlobalFilter(order=-50)
    # 读 Redis 权限码缓存（命中即注入）；未命中/哨兵/异常回落 lb://whale-service-auth/auth/me，两级均失败注入空串并告警
    permission-header:
      enabled: ${WHALE_GATEWAY_PERMISSION_HEADER_ENABLED:true}
    # T5.4 网关入口限流（Redis 计数器 + 固定窗口，REQ-DIST-003）：
    # window-seconds 为固定窗口长度（秒），limit 为单窗口允许的最大请求数，超阈值返回 HTTP 429 + Result 体；
    # Redis 不可用时降级放行（可用性优先），由 RateLimitGlobalFilter 执行。
    # path-rules 为按路径特化的更严规则（最长匹配优先）：前端/行为上报接口为 permitAll 公开写库，
    # 单独收紧阈值防刷量（REQ-SEC-006）；未命中规则的路径沿用上方全局阈值。
    rate-limit:
      enabled: ${WHALE_GATEWAY_RATE_LIMIT_ENABLED:true}
      limit: ${WHALE_GATEWAY_RATE_LIMIT:200}
      window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:1}
      path-rules:
        - path-pattern: /audit/log/frontend/batch
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REPORT:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REPORT_WINDOW_SECONDS:1}
        - path-pattern: /audit/log/behavior/batch
          limit: ${WHALE_GATEWAY_RATE_LIMIT_REPORT:30}
          window-seconds: ${WHALE_GATEWAY_RATE_LIMIT_REPORT_WINDOW_SECONDS:1}
    # T4 熔断降级（轻量实现，由 CircuitBreakerGlobalFilter 执行）：
    # timeout-millis 为单次下游调用超时；failure-rate-threshold 为触发阈值（百分比）；
    # sliding-window-size 为失败率统计窗口；wait-duration-in-open-state-millis 为打开后等待时长；
    # apply-to-routes 为启用熔断的路由 id，命中后超时/失败按失败率熔断并降级返回 503。
    circuit-breaker:
      enabled: ${WHALE_GATEWAY_CIRCUIT_BREAKER_ENABLED:true}
      timeout-millis: ${WHALE_GATEWAY_CIRCUIT_BREAKER_TIMEOUT_MILLIS:3000}
      failure-rate-threshold: ${WHALE_GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE:50}
      sliding-window-size: ${WHALE_GATEWAY_CIRCUIT_BREAKER_WINDOW_SIZE:20}
      wait-duration-in-open-state-millis: ${WHALE_GATEWAY_CIRCUIT_BREAKER_WAIT_MILLIS:10000}
      apply-to-routes:
        - whale-service-auth
        - whale-job
        - whale-file
        - whale-audit
        - whale-archive
    # T6 内网接口屏蔽（由 InternalApiDenyGlobalFilter 执行）：命中 patterns 的外部请求直接返回 403
    internal-deny:
      enabled: ${WHALE_GATEWAY_INTERNAL_DENY_ENABLED:true}
      patterns:
        - /file/internal/**
        # Wave 5.53 档案同步只读通道：workflow / form / file / archive 的 /internal/** 仅限 Nacos 内网直连
        - /workflow/internal/**
        - /form/internal/**
        - /archive/internal/**
        # P1-3 审计汇聚摄入端点：仅服务间内网调用，经网关访问一律 403
        - /audit/log/ingest/**
        # Wave 5.52 IM 群成员合法性校验：仅 whale-im 经内网直连 whale-service-auth 调用
        - /user/internal/**
        # Wave 5.55 IM 站内通知通道：仅业务服务（如 whale-pm）经内网直连 whale-im 投递
        - /im/internal/**
        # Wave 5.54 租户目录：仅档案/知识库等后台任务经内网直连 whale-service-auth 查询可用租户
        - /tenant/internal/**
        # REQ-ARCH-007：Prometheus Alertmanager 入站告警仅限内网直连 whale-alert
        - /alert/internal/**
        # Wave 5.55 项目管理内网通道：仅服务间内网直连 whale-pm
        - /pm/internal/**
        # Wave 5.61 合同内网通道：仅服务间内网直连 whale-contract（到期提醒等）
        - /contract/internal/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,routeGovernance
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: debug
