server:
  # 网关注入的 X-Permission-Codes 随权限数量增长（超管可达 500+ 条），Tomcat 默认 8KB 头上限会导致 400
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8099}
  servlet:
    context-path: /

spring:
  application:
    name: whale-mail
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_mail?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由部署侧显式配置
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

whale:
  permission:
    header:
      enabled: true
  mail:
    # 默认邮箱域名与协议端点：单套 Mailcow 部署时前端无需逐项填写
    default-domain: ${WHALE_MAIL_DOMAIN:}
    default-imap-host: ${WHALE_MAIL_IMAP_HOST:}
    default-imap-port: ${WHALE_MAIL_IMAP_PORT:993}
    default-imap-ssl: ${WHALE_MAIL_IMAP_SSL:true}
    default-smtp-host: ${WHALE_MAIL_SMTP_HOST:}
    default-smtp-port: ${WHALE_MAIL_SMTP_PORT:587}
    default-smtp-ssl: ${WHALE_MAIL_SMTP_SSL:false}
    # 定时增量同步默认关闭：首次接入建议手动触发，确认索引无误后再开
    sync-enabled: ${WHALE_MAIL_SYNC_ENABLED:false}
    max-messages-per-sync: ${WHALE_MAIL_MAX_MESSAGES_PER_SYNC:200}
    max-send-size-bytes: ${WHALE_MAIL_MAX_SEND_SIZE_BYTES:26214400}
    sync:
      batch-size: ${WHALE_MAIL_SYNC_BATCH_SIZE:50}
      fixed-delay-millis: ${WHALE_MAIL_SYNC_INTERVAL_MS:300000}
      # 正文按需回源：同步阶段只拉 header，避免首同步流量与存储翻倍
      fetch-body: ${WHALE_MAIL_SYNC_FETCH_BODY:false}
      # 自定义文件夹同步额度：归档目录多、历史深的账号靠这两个上限控制单轮耗时
      max-custom-folders: ${WHALE_MAIL_SYNC_MAX_CUSTOM_FOLDERS:20}
      custom-max-messages: ${WHALE_MAIL_SYNC_CUSTOM_MAX_MESSAGES:50}
    search:
      # 检索引擎：mysql 走 ngram 全文索引（零运维、与库强一致）；lucene 走本地倒排索引（相关度更好）
      engine: ${WHALE_MAIL_SEARCH_ENGINE:mysql}
      # 单次检索命中上限：超出即截断，避免把整库 ID 拉进内存
      max-hits: ${WHALE_MAIL_SEARCH_MAX_HITS:2000}
      # 索引无命中/单字查询时回退 LIKE：宁可慢一点，也不能让用户以为邮件丢了
      like-fallback: ${WHALE_MAIL_SEARCH_LIKE_FALLBACK:true}
      # lucene 引擎专用：多实例必须指向共享卷，否则各实例只看得到自己写入的部分
      index-dir: ${WHALE_MAIL_SEARCH_INDEX_DIR:./data/mail-index}
      commit-interval-millis: ${WHALE_MAIL_SEARCH_COMMIT_INTERVAL_MS:30000}
    rule:
      # 单次回填扫描的收件箱邮件上限（按收信时间倒序，未处理的下次再跑）
      backfill-limit: ${WHALE_MAIL_RULE_BACKFILL_LIMIT:500}
      # 单账号规则上限：规则是逐封线性匹配，条数直接乘在同步耗时上
      max-rules-per-account: ${WHALE_MAIL_RULE_MAX_PER_ACCOUNT:50}
    file:
      # 附件字节归 whale-file，本服务只存 fileId；内网直连，不经网关
      base-url: ${WHALE_MAIL_FILE_BASE_URL:http://whale-file:8085}
      connect-timeout-millis: ${WHALE_MAIL_FILE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-millis: ${WHALE_MAIL_FILE_READ_TIMEOUT_MS:60000}
      # 单附件 25MB / 单封合计 50MB：超过的不入库但仍登记元信息并标注未缓存
      max-attachment-bytes: ${WHALE_MAIL_MAX_ATTACHMENT_BYTES:26214400}
      max-total-attachment-bytes: ${WHALE_MAIL_MAX_TOTAL_ATTACHMENT_BYTES:52428800}
    # 平台代开邮箱：whale-auth 建用户后回调 /mail/internal/provision，由本服务调 Mailcow 建真实邮箱
    # 默认关闭。关闭时手工绑定流程完全不受影响，代开是增量能力
    mailcow:
      enabled: ${WHALE_MAIL_MAILCOW_ENABLED:false}
      base-url: ${WHALE_MAIL_MAILCOW_BASE_URL:}
      # 全权限凭据：只能由环境变量注入，禁入配置中心明文、禁用默认值
      api-key: ${WHALE_MAIL_MAILCOW_API_KEY:}
      # 配额单位 MiB（0 表示不限）
      quota-mb: ${WHALE_MAIL_MAILCOW_QUOTA_MB:2048}
      connect-timeout-millis: ${WHALE_MAIL_MAILCOW_CONNECT_TIMEOUT_MS:3000}
      read-timeout-millis: ${WHALE_MAIL_MAILCOW_READ_TIMEOUT_MS:10000}
