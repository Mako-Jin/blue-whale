server:
  port: 8081

spring:
  application:
    name: whale-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bluewhale_auth?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

whale:
  auth:
    jwt:
      # HS256 签名密钥，与 whale-gateway 保持完全一致；生产环境务必覆盖
      secret: ${JWT_SECRET:bluewhale-jwt-secret-2026-please-change-in-production}
      expire-minutes: 120
      refresh-expire-minutes: 1440
  # P1-3 审计跨库汇聚：auth 为试点服务，审计记录优先转发 whale-audit:9101，
  # 转发失败自动回退本地 bluewhale_auth.audit_log，不丢记录。
  audit:
    forward:
      enabled: ${WHALE_AUDIT_FORWARD_ENABLED:true}
      url: ${WHALE_AUDIT_FORWARD_URL:http://127.0.0.1:9101}
      timeout-millis: ${WHALE_AUDIT_FORWARD_TIMEOUT_MILLIS:800}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.bluewhale: debug
    org.springframework: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # P1-3b：开启 HTTP 请求耗时直方图，供 SLO-1 登录 P95 的 histogram_quantile 查询使用
      percentiles-histogram:
        "[http.server.requests]": true
