server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /

spring:
  application:
    name: whale-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_agent?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务 sys:agent:* 权限。
whale:
  permission:
    header:
      enabled: true
  agent:
    # 仓库根目录；留空时按启动目录向上探测（含 backend/pom.xml 与 docs/ 的目录）。
    repo-root: ${WHALE_AGENT_REPO_ROOT:}
    # Lucene 索引目录；留空时回落 ${repo-root}/data/agent-index。
    index-dir: ${WHALE_AGENT_INDEX_DIR:}
    ingest:
      # 单文件上限（字节），超出跳过；防止误纳入大二进制/产物
      max-file-size: ${WHALE_AGENT_MAX_FILE_SIZE:2097152}
      # 增量扫描周期（秒），0 表示关闭定时扫描，仅手动重建
      scan-interval-seconds: ${WHALE_AGENT_SCAN_INTERVAL_SECONDS:1800}
      # 启动后是否立即构建一次索引
      build-on-startup: ${WHALE_AGENT_BUILD_ON_STARTUP:true}
    search:
      default-top-k: ${WHALE_AGENT_DEFAULT_TOP_K:8}
      max-top-k: ${WHALE_AGENT_MAX_TOP_K:50}
      # 混合检索：BM25 + 向量（RRF 融合）；任一通道不可用时自动退化
      vector-enabled: ${WHALE_AGENT_SEARCH_VECTOR_ENABLED:true}
      candidate-top-k: ${WHALE_AGENT_SEARCH_CANDIDATE_TOP_K:50}
      rrf-k: ${WHALE_AGENT_SEARCH_RRF_K:60}
      bm25-weight: ${WHALE_AGENT_SEARCH_BM25_WEIGHT:1.0}
      vector-weight: ${WHALE_AGENT_SEARCH_VECTOR_WEIGHT:1.0}
    # 文本向量：auto = 有 API Key 走 OpenAI 兼容 /embeddings，否则本地哈希向量（无出网）
    embedding:
      enabled: ${WHALE_AGENT_EMBEDDING_ENABLED:true}
      provider: ${WHALE_AGENT_EMBEDDING_PROVIDER:auto}
      base-url: ${WHALE_AGENT_EMBEDDING_BASE_URL:}
      api-key: ${WHALE_AGENT_EMBEDDING_API_KEY:}
      model: ${WHALE_AGENT_EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${WHALE_AGENT_EMBEDDING_DIMENSION:0}
      timeout-millis: ${WHALE_AGENT_EMBEDDING_TIMEOUT_MILLIS:20000}
      batch-size: ${WHALE_AGENT_EMBEDDING_BATCH_SIZE:16}
    # OpenAI 兼容模型；未配置 api-key 时自动降级为检索摘要（不报错、不出网）
    llm:
      enabled: ${WHALE_AGENT_LLM_ENABLED:true}
      base-url: ${WHALE_AGENT_LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${WHALE_AGENT_LLM_API_KEY:}
      model: ${WHALE_AGENT_LLM_MODEL:gpt-4o-mini}
      timeout-millis: ${WHALE_AGENT_LLM_TIMEOUT_MILLIS:60000}
      max-tokens: ${WHALE_AGENT_LLM_MAX_TOKENS:1024}
      temperature: ${WHALE_AGENT_LLM_TEMPERATURE:0.2}
    # 问答编排参数
    qa:
      # 问答引擎：legacy = Java 内置（默认）；langchain = 委托 ai/whale-ai（内网 8092）
      engine: ${WHALE_AGENT_QA_ENGINE:legacy}
      langchain:
        base-url: ${WHALE_AI_BASE_URL:http://127.0.0.1:8092}
        timeout-seconds: ${WHALE_AI_TIMEOUT_SECONDS:120}
      evidence-top-k: ${WHALE_AGENT_QA_EVIDENCE_TOP_K:8}
      max-chunk-chars: ${WHALE_AGENT_QA_MAX_CHUNK_CHARS:1200}
      max-facts: ${WHALE_AGENT_QA_MAX_FACTS:12}
      history-messages: ${WHALE_AGENT_QA_HISTORY_MESSAGES:6}
      # 自主工具编排（配置模型后生效）：开启后由模型自行决定检索步骤，关闭则退回单轮 RAG
      agentic-enabled: ${WHALE_AGENT_QA_AGENTIC_ENABLED:true}
      max-tool-steps: ${WHALE_AGENT_QA_MAX_TOOL_STEPS:4}
    # T14 只读数据通道：默认关闭；配置独立只读账号后启用（仅授权白名单视图）
    data:
      enabled: ${WHALE_AGENT_DATA_ENABLED:false}
      url: ${WHALE_AGENT_DATA_URL:}
      username: ${WHALE_AGENT_DATA_USERNAME:whale_ai_ro}
      password: ${WHALE_AGENT_DATA_PASSWORD:}
      allowed-views: ${WHALE_AGENT_DATA_ALLOWED_VIEWS:v_ai_agent_fact_summary,v_ai_agent_usage_summary,v_ai_agent_feedback_summary,v_ai_agent_ops_summary}
      max-rows: ${WHALE_AGENT_DATA_MAX_ROWS:200}
      timeout-seconds: ${WHALE_AGENT_DATA_TIMEOUT_SECONDS:5}
    # T15 平台写操作：默认关闭；开启后模型仅创建确认令牌，用户确认后才转发下游写请求
    ops:
      enabled: ${WHALE_AGENT_OPS_ENABLED:false}
      ttl-seconds: ${WHALE_AGENT_OPS_TTL_SECONDS:300}
      timeout-seconds: ${WHALE_AGENT_OPS_TIMEOUT_SECONDS:10}
      targets:
        form: ${WHALE_AGENT_OPS_TARGET_FORM:http://127.0.0.1:8084}
    # Wave 5.53 M4：文件知识库采集（whale-file 业务文件自动解析入库）
    knowledge:
      enabled: ${WHALE_AGENT_KNOWLEDGE_ENABLED:true}
      sync-on-startup: ${WHALE_AGENT_KNOWLEDGE_SYNC_ON_STARTUP:false}
      sync-interval-seconds: ${WHALE_AGENT_KNOWLEDGE_SYNC_INTERVAL_SECONDS:600}
      page-size: ${WHALE_AGENT_KNOWLEDGE_PAGE_SIZE:200}
      max-file-size: ${WHALE_AGENT_KNOWLEDGE_MAX_FILE_SIZE:20971520}
      max-chars: ${WHALE_AGENT_KNOWLEDGE_MAX_CHARS:1000000}
      timeout-seconds: ${WHALE_AGENT_KNOWLEDGE_TIMEOUT_SECONDS:30}
      max-attempts: ${WHALE_AGENT_KNOWLEDGE_MAX_ATTEMPTS:3}
      retry-base-seconds: ${WHALE_AGENT_KNOWLEDGE_RETRY_BASE_SECONDS:60}
      file-url: ${WHALE_AGENT_FILE_URL:http://127.0.0.1:8085}
      # 定时同步租户：留空则由租户目录（whale-service-auth）动态查询可用租户
      sync-tenant-ids: ${WHALE_AGENT_KNOWLEDGE_SYNC_TENANT_IDS:}
      auth-url: ${WHALE_AGENT_AUTH_URL:http://127.0.0.1:8081}
      connect-timeout-millis: ${WHALE_AGENT_KNOWLEDGE_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${WHALE_AGENT_KNOWLEDGE_READ_TIMEOUT_MILLIS:60000}
      excluded-buckets: ${WHALE_AGENT_KNOWLEDGE_EXCLUDED_BUCKETS:}
    # 轨 F：MCP / IDE 接入（默认关闭；配置 token 后才对外提供只读工具）
    mcp:
      enabled: ${WHALE_AGENT_MCP_ENABLED:false}
      token: ${WHALE_AGENT_MCP_TOKEN:}
      max-search-results: ${WHALE_AGENT_MCP_MAX_SEARCH_RESULTS:20}
      max-read-lines: ${WHALE_AGENT_MCP_MAX_READ_LINES:400}
      max-read-chars: ${WHALE_AGENT_MCP_MAX_READ_CHARS:20000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
