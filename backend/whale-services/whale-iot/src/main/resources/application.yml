server:
  # 网关注入的 X-Permission-Codes 随权限数量增长，Tomcat 默认 8KB 头上限会导致 400（对齐 whale-agent）
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: whale-iot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/bluewhale_iot?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不提供 root 默认口令；未设置 MYSQL_PASSWORD 时由 starter 的
    # DataSourcePasswordGuard 启动守卫给出明确报错（与 whale-agent 同一口径）
    password: ${MYSQL_PASSWORD:}
    # T-13 连接池基线：显式池名/上限/超时/泄漏检测（对齐 whale-agent）
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  # REQ-SEC-022：Flyway 数据库版本化管理。仅扫描 classpath:db/migration。
  flyway:
    enabled: ${WHALE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: ${WHALE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# V-02 内网令牌：EMQX 认证/鉴权 Webhook 回调挂在 /iot/internal/emqx/** 下，
# starter 默认模式 /**/internal/** 已覆盖；设备侧只连 1883 端口 MQTT，不经本服务。
bluewhale:
  internal-token:
    path-patterns:
      - /**/internal/**

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务 sys:iot:* 权限。
whale:
  permission:
    header:
      enabled: true
  iot:
    # Wave 6.02 M1：EMQX（compose bw-emqx）连接信息。whale-iot 不做常驻 MQTT 客户端，
    # M2 遥测上行走 EMQX Webhook（message.publish）转发到 /iot/internal/emqx/webhook。
    # 下行（指令 down/command、影子 down/shadow）经 EMQX REST API /api/v5/publish 发布。
    emqx:
      api-base-url: ${WHALE_IOT_EMQX_API:http://127.0.0.1:18083}
      # Dashboard → API Keys 生成的 Key/Secret（Basic 认证）；未配置时下发链路降级为只落库不投递
      api-key: ${WHALE_IOT_EMQX_API_KEY:}
      api-secret: ${WHALE_IOT_EMQX_API_SECRET:}
      mqtt-host: ${WHALE_IOT_EMQX_MQTT_HOST:127.0.0.1}
      mqtt-port: ${WHALE_IOT_EMQX_MQTT_PORT:1883}
    # 单设备遥测单次上报条目上限（防超大批次拖垮落库）
    telemetry-max-batch: ${WHALE_IOT_TELEMETRY_MAX_BATCH:100}
    # 遥测查询单次返回条数上限
    telemetry-query-max: ${WHALE_IOT_TELEMETRY_QUERY_MAX:500}
    # SSE 心跳间隔（秒）：空闲连接按此发注释帧，避免中间代理掐链
    stream-heartbeat-seconds: ${WHALE_IOT_STREAM_HEARTBEAT_SECONDS:30}
    # 指令默认超时（秒），用于展示与 M3 超时扫描
    command-timeout-seconds: ${WHALE_IOT_COMMAND_TIMEOUT_SECONDS:30}
    # 规则引擎总开关（关闭后遥测链路不再评估规则，仅落库/推送）
    rule-enabled: ${WHALE_IOT_RULE_ENABLED:true}
    # 规则默认静默期（秒）：规则动作配置未指定时按此去重
    rule-silence-seconds: ${WHALE_IOT_RULE_SILENCE_SECONDS:300}
    # 告警动作：调 whale-alert 内网 /alert/internal/record 落告警记录
    alert:
      base-url: ${WHALE_IOT_ALERT_BASE_URL:http://127.0.0.1:9103}
      timeout-seconds: ${WHALE_IOT_ALERT_TIMEOUT_SECONDS:3}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
