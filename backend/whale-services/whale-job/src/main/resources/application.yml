server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: whale-job
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bluewhale_job?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # P1-2 安全默认值：不再提供 root 默认口令；未设置 MYSQL_PASSWORD 时由启动守卫给出明确报错
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

logging:
  level:
    com.bluewhale: debug

# AUTH-06：启用 starter 的 RequirePermissionInterceptor（默认 false，须显式开启），
# 按网关注入的 X-Permission-Codes 判定本服务任务管理接口的 sys:job:* 权限。
whale:
  permission:
    header:
      enabled: true
  job:
    # job_log 保留天数：每日清理任务逻辑删除超过该天数的执行流水
    log-retention-days: ${JOB_LOG_RETENTION_DAYS:30}
    # whale-file 服务内网地址：归档任务经此直连上传导出文件（不经网关）
    file-service-url: ${WHALE_JOB_FILE_SERVICE_URL:http://127.0.0.1:8085}
    # 单次归档导出的 job_log 上限条数
    archive-batch-size: ${WHALE_JOB_ARCHIVE_BATCH_SIZE:2000}
    # 失败告警：webhook-url 为空时仅写本地告警日志并落库 job_alert
    alert:
      enabled: ${WHALE_JOB_ALERT_ENABLED:true}
      webhook-url: ${WHALE_JOB_ALERT_WEBHOOK_URL:}
      cooldown-seconds: ${WHALE_JOB_ALERT_COOLDOWN_SECONDS:300}
      connect-timeout-millis: ${WHALE_JOB_ALERT_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${WHALE_JOB_ALERT_READ_TIMEOUT_MILLIS:3000}
      max-error-length: ${WHALE_JOB_ALERT_MAX_ERROR_LENGTH:500}
    # F-02 多实例广播断连后的本地调度全量重对齐
    schedule-reconcile:
      enabled: ${WHALE_JOB_SCHEDULE_RECONCILE_ENABLED:true}
      interval-ms: ${WHALE_JOB_SCHEDULE_RECONCILE_INTERVAL_MS:300000}
      initial-delay-ms: ${WHALE_JOB_SCHEDULE_RECONCILE_INITIAL_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
