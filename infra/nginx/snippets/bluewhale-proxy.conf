# 转发到后端。四个头各自有明确用途，缺一个都会在别处表现为疑难杂症。
proxy_pass            http://bluewhale_backend;
proxy_http_version    1.1;

# 让后端生成的绝对链接（OpenAPI 文档地址、重定向）指向对外域名，而不是 upstream 名
proxy_set_header      Host              $host;

# 单跳的真实 IP，便于后端日志排查
proxy_set_header      X-Real-IP         $remote_addr;

# **追加**而不是覆盖：覆盖会丢掉中间跳的痕迹。
# 但后端**不得**拿它做鉴权或风控 —— 它可被伪造，且后端无法判断前面有几跳。
# 见 ClientLogController / ClientEventController / AuthController 等 5 处注释。
proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;

# 后端据此判断原始协议（生成链接、判断是否 Secure Cookie）
proxy_set_header      X-Forwarded-Proto $scheme;

# 清掉客户端的 Connection 头，让 upstream keepalive 生效（否则每个请求都新建连接）
proxy_set_header      Connection        "";
