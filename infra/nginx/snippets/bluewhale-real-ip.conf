# 真实客户端 IP —— 默认**全部注释**，只为让模板里的 include 恒成功。
#
# ## 什么时候必须打开
# nginx 前方还有一层代理（云 LB / CDN / 另一台 nginx）。
# 不打开的后果：$binary_remote_addr 是**最后一跳代理的地址** ——
# 所有客户端共用一个 IP，上报限流退化成"全局一个桶"，
# 表现为"人数一多就整片 429"，而真正的攻击者混在里面毫发无损。
#
# ## 什么时候绝不能打开
# nginx 就是边缘（直接对外）。此时 $binary_remote_addr 本来就是真实客户端 IP，
# 打开反而会用**可伪造的** X-Forwarded-For 去覆盖它 ——
# 等于把限流的钥匙交到攻击者手里（伪造一个头即绕过）。
# 这正是后端那 5 处「X-Forwarded-For 不可作为鉴权或风控依据」注释
# 在**应用层**成立、而在**这一层**可以不成立的分界线。
#
# ## 启用前逐条确认
# 只写你自己那台代理的地址，**不要图省事写 0.0.0.0/0**（那等于信任所有人）。
#
# set_real_ip_from  10.0.0.0/8;          # ← 换成你的 LB / CDN 回源网段
# real_ip_header    X-Forwarded-For;
# real_ip_recursive on;                  # 从右往左跳过可信段，取第一个不可信的地址
