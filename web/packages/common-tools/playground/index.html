<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>common-tools · Logger Playground</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Logger Playground</h1>
        <p class="hint">
          左侧点击触发日志，右侧是<b>真实控制台输出</b>的镜像 —— 页面上看到的颜色、对齐、层级与控制台完全一致。
        </p>
      </div>
      <code class="usage">import { createLogger } from 'common-tools/logger';</code>
    </header>

    <main>
      <aside id="toolbar"></aside>
      <section class="panel">
        <div class="panel-head">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="panel-title">Console</span>
        </div>
        <div id="console-output"></div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
