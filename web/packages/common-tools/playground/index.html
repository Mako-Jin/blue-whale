<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>common-tools · Logger Playground</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Logger Playground</h1>
        <p class="hint">
          左侧点击触发日志：中栏是<b>真实控制台输出</b>的镜像；右栏是 <code>onRecord</code> 收到的<b
            >结构化记录</b
          >
          —— 上报链路真正拿到的就是它。
        </p>
      </div>
      <code class="usage">import { createLogger } from 'common-tools/logger';</code>
    </header>

    <main>
      <aside id="toolbar"></aside>

      <section class="panel">
        <div class="panel-head">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="panel-title">Console · sink</span>
        </div>
        <div id="console-output"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="panel-title">Structured records · onRecord</span>
        </div>
        <p id="record-counter" class="panel-note">尚未收到记录</p>
        <div id="record-output"></div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
