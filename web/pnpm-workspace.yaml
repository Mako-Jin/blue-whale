packages:
  - 'packages/*'
  - 'platform/*'
  - 'elemental/*'

# ============================================================
# 公共依赖版本统一在此维护，各 package.json 一律写 "catalog:"
# ============================================================
# 为什么不用"再建一个包放依赖"：那会产生幽灵依赖（包能被引用到、
# 却没在自己的 package.json 里声明），运行时找不到、IDE 也提示不出来。
# catalog 只统一版本号，依赖归属关系仍然留在各自的 package.json 里。
#
# 约定：新增第三方依赖时先加到这里，不要在子项目里散写版本号。
catalog:
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^10.0.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.6.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-v8': ^5.0.3
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.13.0
  husky: ^9.1.7
  jsdom: ^30.1.2
  less: ^4.9.1
  lint-staged: ^17.6.0
  openapi-typescript: ^7.13.0
  postcss-less: ^6.0.0
  prettier: ^3.9.9
  qiankun: ^2.10.16
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router-dom: ^7.18.4
  stylelint: ^17.16.0
  stylelint-config-standard: ^40.0.0
  turbo: ^2.11.7
  typescript: ^6.0.3
  typescript-eslint: ^8.71.1
  vite: ^8.3.3
  vitest: ^5.0.3
