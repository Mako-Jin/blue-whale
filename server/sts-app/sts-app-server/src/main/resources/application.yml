server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: bluewhale-server

  # ---------------------------------------------------------------------------
  # 默认 profile：h2（内存库）。零外部依赖，clone 下来 pnpm/mvn 一把就能跑起来。
  #
  # 要连本机 MySQL，显式切过去：
  #   --spring.profiles.active=mysql        （见 application-mysql.yml）
  #
  # 为什么用 profile 而不是"改几行配置"：
  #   两种库要同时存在 —— 新人 / CI 不该被迫先装一个数据库，而真实联调又需要
  #   数据能持久化。profile 让"用哪个库"成为一个**启动参数**，而不是一份
  #   需要手工切换、切错了还看不出来的文件状态。
  # ---------------------------------------------------------------------------
  profiles:
    active: h2

  # ---------------------------------------------------------------------------
  # 表结构变更统一交给 Flyway，不再使用 spring.sql.init。
  #
  # 为什么换：`spring.sql.init` 每次启动都无条件重放脚本，只能表达"建表"，
  # 表达不了"改表"——线上要给已有表加一列，它无能为力。Flyway 用
  # schema_history 表记录已执行的版本，追加一个 V2__xxx.sql 就能演进。
  #
  # 迁移脚本由**领域模块自带**（谁拥有表结构谁写脚本），
  # 具体目录在各自 profile 里指定 —— 按数据库厂商分目录，各写各的原生方言。
  # 详见 docs/decisions/0009。
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    # 已发布脚本的内容一旦变化，校验和不匹配会让启动直接失败。
    # 这是**特性不是麻烦**：迁移脚本是历史，改了历史就该新增一条，不是覆盖它。
    validate-on-migrate: true

mybatis-plus:
  configuration:
    # 下划线转驼峰：level_count → levelCount。关掉它就得给每个聚合列写 @Results
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# -----------------------------------------------------------------------------
# 跨域：默认关闭，这里为本地前端联调打开。
# 前端 dev server 已经配了 /api 代理（同源），理论上用不到；
# 但直接打开构建产物、或用别的端口调试时就需要它。
# 生产环境由网关统一处理，此项保持 false。
# -----------------------------------------------------------------------------
bluewhale:
  web:
    cors:
      enabled: true

  # -----------------------------------------------------------------------------
  # 权限域
  #
  # jwt.secret 属**密钥级配置**（docs/decisions/0003）：生产必须用环境变量注入。
  # 这里给的是仅用于本地开发的占位值 —— 它已进版本库，因此等于公开，
  # 上线前必须通过 BW_JWT_SECRET 覆盖，且长度建议不少于 64 字节（HS512 的密钥长度）。
  #
  # TTL 属业务运行期配置，给默认值即可：访问令牌短（2 小时）是因为它无状态、
  # 撤销只能靠过期；刷新令牌长（7 天）是因为它落库、可撤销、可轮换。
  # -----------------------------------------------------------------------------
  auth:
    jwt:
      secret: ${BW_JWT_SECRET:bluewhale-dev-only-placeholder-secret-must-be-overridden-in-production-0123456789}
      issuer: bluewhale
      audience: bluewhale-api
      access-ttl: 2h
      refresh-ttl: 7d
    password:
      iterations: 120000
    login:
      max-failed-attempts: 5
      lock-duration: 15m

# -----------------------------------------------------------------------------
# 接口文档：/v3/api-docs 是契约的产出源，scripts/export-openapi.sh 从这里取。
# 生产环境建议 api-docs.enabled=false，避免把内部接口清单公开。
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: info
    com.bluewhale.sts: debug
