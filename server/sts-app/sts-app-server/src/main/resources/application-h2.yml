# =============================================================================
# profile: h2 —— 内存库（默认）
#
# 零外部依赖：不需要装数据库、不需要建库、不需要凭据，clone 下来即可运行。
# 这是默认 profile，为的是让"跑起来"这件事没有任何前置条件。
#
# 代价必须说清楚：**数据活在 JVM 进程内存里**。
#   - 进程一停，数据全没
#   - 同时起两个实例，各自看到的是两个互不相干的空库
# 因此它只适合开发、演示、自动化测试。
# 需要数据留下来，用 mysql profile。
# =============================================================================

spring:
  # ---------------------------------------------------------------------------
  # MODE=MySQL          ：语法尽量贴近 MySQL，减少换库时的意外
  # DATABASE_TO_LOWER   ：标识符统一小写，避免大小写敏感带来的
  #                       "本地能跑、线上报表不存在"
  # DB_CLOSE_DELAY=-1   ：最后一个连接关闭后不销毁库，否则连接池回收一次数据就没了
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:bluewhale;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    # 只跑 H2 方言的迁移脚本。换 profile 就换一套，互不干扰。
    locations: classpath:db/migration/h2

  # H2 自带的 Web 控制台，浏览器里直接查表。生产环境务必关闭。
  h2:
    console:
      enabled: true
      path: /h2-console

# =============================================================================
# 权限域种子数据：**只在 h2 打开**
#
# 内存库每次启动都是空的，若不种一套默认数据，则"没有任何账号可登录"——
# 而建账号的接口本身要求已登录，形成死锁。种一套默认管理员解决引导问题。
#
# 换到 mysql / dameng 时本项不生效（那些 profile 不包含本文件）：
# 真实库里的账号应由运维显式创建，而不是让应用每次启动都去补一个固定口令的管理员。
#
# ⚠️ 口令必须**显式**写在这里：`AuthProperties` 里两个口令字段都**没有默认值**，
#    开了种子却不给口令会让应用**拒绝启动**（见 `DefaultAdminSeeder#requirePassword`）。
#    这是刻意的 —— 有默认值就等于"生产开启种子、忘了覆盖 ⇒ 静默得到一个口令公开可查的管理员"。
#
# ⚠️ 下面这两个值是**本仓唯一一处**种子口令的真值来源。别处（`scripts/verify-*.mjs`
#    与登录页的开发提示）都从这里取，或明确标注"必须与本文件保持一致"。
#    h2 是开发 / 演示 profile，这两个口令**不是秘密**；它们的问题是曾被印在
#    **生产包**里（见 `docs/decisions/0029`），而不是"被开发机看到"。
# =============================================================================
bluewhale:
  auth:
    seed-admin:
      enabled: true
      # 开发演示口令。生产不用 h2 profile，因此它不会成为任何生产账号的口令。
      password: Admin@12345
    # -------------------------------------------------------------------------
    # 只读账号（审计员）：**依赖 seed-admin**
    #
    # 它落在 seed-admin 种下的那个租户里、授予 seed-admin 建出来的资源的子集，
    # 因此 seed-admin 关闭时本项无效（没有租户与资源可挂）。
    #
    # 存在的意义是让"权限确实生效了"可观测：只种管理员时所有接口对唯一身份都放行，
    # 权限标识写错、资源漏配、前端按钮显隐判反，症状都只是"看起来很正常"。
    # 这个**有读无写**的第二身份把差异摆出来（列表看得见、新建按钮不出现、直接调写接口 403）。
    # -------------------------------------------------------------------------
    seed-auditor:
      enabled: true
      password: Auditor@12345
