# =============================================================================
# profile: mysql —— 本机 MySQL（数据落在磁盘上）
#
# 启用方式：
#   BW_DB_PASSWORD=<密码> java -jar sts-app-server.jar --spring.profiles.active=mysql
#
# 与 h2 profile 的关键差别：**数据真的留下来了**。进程重启、换端口、
# 甚至同时起多个实例，看到的都是同一个库。
#
# 前置准备（一次性）：数据库要先存在，Flyway 只负责建表、不负责建库。
#   CREATE DATABASE bluewhale DEFAULT CHARACTER SET utf8mb4
#     COLLATE utf8mb4_0900_as_cs;
#
# ⚠️ **排序规则用 `_as_cs`（区分大小写 + 区分重音），不要用 MySQL 默认的 `_ai_ci`。**
#    本仓的"两个文本什么时候算相等"是**统一决定过**的：区分大小写（见 docs/decisions/0065）。
#    用 `_ai_ci` 会让 MySQL 上 `A@b.com` 与 `a@b.com` 是同一个邮箱、`ADMIN` 能登进 `admin`
#    的账号，而 H2 / 达梦上不能 —— 同一串请求在两个 profile 下结果不同。
#    已存在的库里，13 张 `bw_auth_*` 表由迁移 `V8__align_text_equality_collation.sql`
#    转过来（V3 给每张表显式写了 `_ai_ci`，所以这一行**不能**省 —— 见 V8 的注释）。
#    注意别顺手选名字更像"二进制比较"的 `utf8mb4_bin`：它是 PAD SPACE，
#    `'a@b.com '` 与 `'a@b.com'` 会被当成同一个，而 H2 认为它们不同（ADR-0065 的探针表）。
#
# 前置准备（二，一次性）：**种一套开发账号**。
#
# 本 profile 里**故意不打开**种子开关 —— 与 h2 的取舍不同：
#   h2 每次启动都是空库，不自动种就一个账号都没有可登录（而建账号的接口本身要求已登录）；
#   mysql 是真实库、数据留得住，应用不该每次启动都去补一个固定口令的管理员。
# 所以账号由人显式开一次种子种下，之后就一直在了：
#
# ⚠️ **口令必须一起给。** `AuthProperties` 的两个口令字段**没有默认值**，
#    只开开关不给口令 ⇒ 应用**拒绝启动**（见 `DefaultAdminSeeder#requirePassword`）。
#    这是刻意的：这两个字段历史上是有默认值的（就写在本仓库里），于是"开了种子、
#    忘了覆盖"会**静默**种下一个口令公开可查的管理员。见 `docs/decisions/0029`。
#
#   BW_DB_PASSWORD=<密码> java -jar sts-app-server.jar --spring.profiles.active=mysql \
#     --bluewhale.auth.seed-admin.enabled=true   --bluewhale.auth.seed-admin.password=<强口令> \
#     --bluewhale.auth.seed-auditor.enabled=true --bluewhale.auth.seed-auditor.password=<强口令>
#
# 三个要点：
#   · 种子是**幂等**的（ensure* 语义：已存在就跳过、缺什么补什么），重复执行没有副作用；
#   · `seed-auditor` 依赖 `seed-admin` —— 只读账号挂在 admin 种下的租户与资源上，
#     少了 admin 它就没有可挂的东西，开了也不生效；
#   · **口令只在"首次种下"那一刻生效**：`ensureUser` 遇到已存在的用户直接返回、不改口令。
#     所以日后改这里的口令**不会**改掉已有账号 —— 那是改密接口的职责，不是种子的。
# 若确实不想在任何库留下固定口令的账号，就别开这两个开关，用已有管理员账号调
# `/api/auth/users`、`/api/auth/tenants` 建号即可（首次需要一个已有的管理员）。
# =============================================================================

spring:
  datasource:
    # ---------------------------------------------------------------------------
    # 参数逐个说明，避免后来者"顺手删掉"：
    #   sslMode=DISABLED              本地回环连接，省掉握手开销与自签证书告警
    #   allowPublicKeyRetrieval=true  MySQL 8 默认认证插件是 caching_sha2_password，
    #                                 在非 SSL 连接下需要允许向服务端索取 RSA 公钥。
    #                                 少了它，连接会以
    #                                 "Public Key Retrieval is not allowed" 失败 ——
    #                                 报错信息完全没提"该加哪个参数"，很费时间。
    #   characterEncoding=UTF-8       保证中文日志正文不乱码（utf8mb4 由建库时指定）
    #
    # 刻意不设 serverTimezone：日志时间戳一律以 BIGINT 毫秒存储，
    # 不碰 MySQL 的日期类型，时区配置对本项目毫无影响，多写反而是个隐患。
    # ---------------------------------------------------------------------------
    url: jdbc:mysql://127.0.0.1:3306/bluewhale?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver

    # ---------------------------------------------------------------------------
    # 凭据走环境变量，**不写进仓库**。
    #
    # 依据 docs/decisions/0003：密钥级配置归 Vault/KMS 管，最次也得是运行期注入。
    # 把密码提交进版本库的问题是它会永久留在 git 历史里 ——
    # 即便后来删掉那一行，历史提交里依然能翻出来。
    #
    # 用户名给了默认值 root，本地开发够用；生产环境同样用环境变量覆盖。
    # ---------------------------------------------------------------------------
    username: ${BW_DB_USERNAME:root}
    password: ${BW_DB_PASSWORD:}

  flyway:
    # 只跑 MySQL 方言的迁移脚本（见该目录下的 SQL 注释）
    locations: classpath:db/migration/mysql

  # H2 控制台在 MySQL 下没有意义，显式关掉而不是靠"反正没人访问"
  h2:
    console:
      enabled: false
