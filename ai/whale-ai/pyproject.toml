[project]
name = "whale-ai"
version = "0.1.0"
description = "BlueWhale LangChain/LangGraph 智能体服务（内网 8092，不注册网关与 Nacos）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whale_ai"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# 静态检查（T-17）：仅启用「一定错误」类规则（E9 语法错误 / F63 格式化语法 /
# F7 不可能执行的语句 / F82 未定义名），不引入风格与导入类规则，避免历史代码噪音；
# mypy 以阻断模式接入 CI（见文末 `[tool.mypy]`）。
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# 类型检查（T-17）：以阻断模式接入 CI（版本固定 mypy==2.4.1），
# 缺失三方类型桩时不报错。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["whale_ai"]
exclude = [".venv"]
